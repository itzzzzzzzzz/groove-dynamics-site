<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

/* the same paper, ink and type as the scroll page — the two are one site */
:root{
  --paper:#FFFFFF;
  --mist:#F6F6F4;
  --ink:#0A0A0A;
  --ink-2:rgba(10,10,10,.56);
  --ink-3:rgba(10,10,10,.34);
  --line:rgba(10,10,10,.1);
  --line-2:rgba(10,10,10,.06);
  --pad:clamp(16px,4vw,48px);
  --r:12px;
  --e-out:cubic-bezier(.16,1,.3,1);
  --e-io:cubic-bezier(.76,0,.24,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --sans:"Inter Tight","Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --head-h:60px;
  --tabs-h:44px;
  --chrome-h:var(--head-h);   /* members get the tabs as a second row (see .has-tabs) */
}

*,*::before,*::after{box-sizing:border-box}
/* the gutter stays, so the page never shifts when a view locks the scroll */
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px;scrollbar-gutter:stable}
body.is-painting{overflow:hidden}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:clip}
svg{display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
::selection{background:var(--ink);color:var(--paper)}

.meta{font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3)}

@view-transition{navigation:auto}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
}


/* ============================================================
   chrome — Skool's bar: the group on the left, you on the right,
   the tabs in a row underneath. Hairlines, no weight.
   ============================================================ */
.chrome{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line-2);
  transition:opacity .9s var(--e-out),transform .9s var(--e-out)}
.top{height:var(--head-h);display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-inline:var(--pad)}
/* only the mark, in light, as igloo's mark sits on its picture: pure white
   with a soft white glow, on a breath of igloo's grey sky so the glow has
   something to shine on, on paper as on snow; pointed at, it flickers as
   igloo's does */
.brand{position:relative;display:flex;align-items:center;min-width:0;padding:10px 14px;margin-left:-14px;isolation:isolate}
.brand svg{width:40px;flex:none;color:var(--ink);overflow:visible;transition:color .4s var(--e-out),width .4s var(--e-out)}
.on-scene .chrome:not(.is-solid) .brand::before{content:"";position:absolute;inset:-10px -16px;z-index:-1;border-radius:50%;
  background:radial-gradient(closest-side,rgba(126,131,143,.62),rgba(126,131,143,.34) 52%,rgba(126,131,143,0));filter:blur(6px)}
.on-scene .chrome:not(.is-solid) .brand svg{width:44px;color:#fff;
  filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 0 6px rgba(255,255,255,.8)) drop-shadow(0 0 14px rgba(255,255,255,.45))}
.brand:hover svg,.brand:focus-visible svg{animation:flicker .16s steps(1,end) 1}
@keyframes flicker{0%{opacity:.55}20%{opacity:1}40%{opacity:.6}60%{opacity:1}80%{opacity:.7}100%{opacity:1}}
.top__right{display:flex;align-items:center;gap:4px}
.top__link{font-size:13px;font-weight:500;color:var(--ink-2);padding:8px 10px;border-radius:8px;
  transition:color .2s,background .2s}
.top__link:hover{color:var(--ink);background:var(--mist)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:0;background:none;
  border-radius:50%;cursor:pointer;color:var(--ink-2);position:relative;transition:background .2s,color .2s}
.icon-btn:hover{background:var(--mist);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .pip{position:absolute;top:8px;right:9px;width:6px;height:6px;border-radius:50%;
  background:var(--ink);box-shadow:0 0 0 2px var(--paper)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--ink);color:var(--paper);font-size:12px;font-weight:600;letter-spacing:.01em;
  border:0;cursor:pointer}
.avatar--soft{background:var(--mist);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.avatar--sm{width:22px;height:22px;font-size:9px;cursor:default}
.avatar--lg{width:40px;height:40px;font-size:13px}

.tabs{position:relative;display:none;align-items:stretch;gap:28px;height:var(--tabs-h);
  padding-inline:var(--pad);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.chrome.has-tabs .tabs{display:flex}
.chrome.has-tabs ~ #view{--chrome-h:calc(var(--head-h) + var(--tabs-h))}
.tab{display:flex;align-items:center;font-size:14px;font-weight:500;color:var(--ink-2);
  white-space:nowrap;transition:color .25s}
.tab:hover,.tab.is-on{color:var(--ink)}
.tabs__bar{position:absolute;bottom:-1px;left:0;height:2px;width:0;background:var(--ink);
  transition:transform .5s var(--e-out),width .5s var(--e-out)}

.menu{position:absolute;top:calc(var(--head-h) - 6px);right:var(--pad);z-index:60;min-width:230px;
  padding:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 18px 40px rgba(10,10,10,.1),0 3px 8px rgba(10,10,10,.05);
  opacity:0;transform:translateY(-4px) scale(.98);transform-origin:100% 0;pointer-events:none;
  transition:opacity .2s var(--e-out),transform .3s var(--e-out)}
.menu.is-open{opacity:1;transform:none;pointer-events:auto}
.menu button,.menu a{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;
  border-radius:8px;font-size:14px;cursor:pointer}
.menu button:hover,.menu a:hover{background:var(--mist)}

.wrap{max-width:1080px;margin-inline:auto;padding-inline:var(--pad)}

/* ============================================================
   buttons, cards — shadcn's shapes, in this page's ink
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;
  border:0;border-radius:8px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:500;
  white-space:nowrap;cursor:pointer;transition:background .2s,transform .2s var(--e-out),opacity .2s}
.btn:hover{background:rgba(10,10,10,.86)}
.btn:active{transform:scale(.985)}
.btn svg{width:16px;height:16px;flex:none}
.btn--lg{height:44px;padding:0 32px}
.btn--block{width:100%}
.btn--ghost{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn--ghost:hover{background:var(--mist)}
.btn[disabled]{cursor:default}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.3);
  border-top-color:var(--paper);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--ink);
  color:var(--paper);font-size:10px;font-weight:600;line-height:1;padding:4px 6px}
.badge--outline{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);
  font-size:12px;font-weight:500;padding:5px 10px}
.badge svg{width:12px;height:12px}
.bar{position:relative;flex:1;height:3px;border-radius:3px;background:var(--line-2);overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(var(--p,0));background:var(--ink);
  border-radius:inherit;transition:transform .9s var(--e-out)}
.online{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:6px;
  vertical-align:1px;animation:breathe 2.6s var(--e-io) infinite}
@keyframes breathe{50%{opacity:.35}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats div{padding:4px 0}
.stats div+div{border-left:1px solid var(--line-2)}
.stats b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.3;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--ink-2)}

/* every view arrives the way magicui's BlurFade does, a little up — but without
   the blur, which costs a repaint per frame; opacity and transform stay on the GPU */
.rise{animation:rise .55s var(--e-out) both;animation-delay:calc(var(--i,0) * 60ms + 40ms)}
@keyframes rise{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}

/* a Skool page: the main column and a narrow one on the right */
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:56px;align-items:start;padding-block:40px 112px}
.aside{position:sticky;top:calc(var(--chrome-h) + 28px);display:grid;gap:18px}
/* a short screen cannot hold the card still — let it scroll with the page */
@media (max-height:760px){.aside{position:static}}
.page-title{font-size:clamp(26px,3vw,34px);font-weight:600;letter-spacing:-.04em;line-height:1.08}
.page-sub{margin-top:8px;font-size:15px;color:var(--ink-2)}
.page-sub b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* ============================================================
   über — Skool's group page: title, cover, facts, the text;
   the card on the right
   ============================================================ */
.about__title{margin-bottom:24px}
.cover{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--mist)}
.cover__ring{position:absolute;inset:0;animation:turn 160s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.cover__card{position:absolute;left:50%;top:50%;border-radius:8px;overflow:hidden;
  box-shadow:0 8px 16px rgba(10,10,10,.08),0 2px 4px rgba(10,10,10,.05)}
.cover__card svg{width:100%;height:100%}
.cover__card::after{content:"";position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(10,10,10,.07)}
.cover__mid{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center}
.cover__mid svg{width:clamp(44px,7vw,64px);color:var(--ink)}
.cover__mid .meta{color:var(--ink-2)}
.facts{list-style:none;padding:0;margin:20px 0 34px;display:flex;flex-wrap:wrap;gap:10px 24px;
  font-size:14px;color:var(--ink-2)}
.facts li{display:flex;align-items:center;gap:8px}
.facts svg{width:16px;height:16px;color:var(--ink-3)}
.facts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.prose{max-width:60ch}
.prose p{font-size:16px;line-height:1.7}
.prose p+p{margin-top:14px}
.prose .meta{display:block;margin:40px 0 6px}
.gets{list-style:none;padding:0;margin:0}
.gets li{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.gets__tile{position:relative;flex:none;width:52px;height:52px;border-radius:10px;overflow:hidden}
.gets__tile svg{position:absolute;inset:0;width:100%;height:100%}
.gets__tile::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(10,10,10,.07)}
.gets b{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em}
.gets span{font-size:14px;color:var(--ink-2)}
.trust{text-align:center;font-size:12px;color:var(--ink-2)}
.trust b{color:var(--ink);font-weight:500}

/* ---- the pricing card — 7ovr's single-plan card from 21st.dev ---- */
.price{overflow:hidden}
.price__head{display:flex;flex-direction:column;gap:16px;padding:24px 24px 0}
.price__name{font-size:16px;font-weight:600;line-height:1}
.price__tag{margin-top:6px;font-size:14px;line-height:1.45;color:var(--ink-2)}
.seg{display:flex;align-items:center;gap:4px;padding:4px;border-radius:8px;
  box-shadow:inset 0 0 0 1px var(--line);background:rgba(246,246,244,.7)}
.seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;
  padding:0 12px;border:0;border-radius:6px;background:none;font-size:14px;font-weight:500;
  color:var(--ink-2);cursor:pointer;transition:color .2s,background .2s,box-shadow .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);
  box-shadow:0 1px 2px rgba(10,10,10,.08),0 0 0 1px rgba(10,10,10,.04)}
.price__amount{display:flex;align-items:baseline;gap:6px}
.price__num{font-size:48px;font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.price__num.is-swap{animation:swap .45s var(--e-out)}
@keyframes swap{from{opacity:0;filter:blur(6px);transform:translateY(6px)}}
.price__per{font-size:14px;color:var(--ink-2)}
.price__body{display:flex;flex-direction:column;gap:20px;padding:16px 24px 24px}
.sep{height:1px;border:0;margin:0;background:var(--line)}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.checks li{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.4}
.checks svg{width:16px;height:16px;flex:none}
.price__foot{display:flex;flex-direction:column;gap:12px;padding:20px 24px 22px;
  border-top:1px solid var(--line);background:rgba(246,246,244,.5)}
.price__note{text-align:center;font-size:12px;line-height:1.5;color:var(--ink-2)}
.lmb .spin{width:14px;height:14px}

/* ============================================================
   the welcome — Aram, a few words, nothing else on the page
   ============================================================ */
.intro{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:var(--pad);
  background:var(--paper);transition:background-color 1.1s var(--e-io)}
.intro.is-clear{background-color:rgba(255,255,255,0);pointer-events:none}
.intro__line{max-width:17em;margin:0;text-align:center;font-size:clamp(26px,4.2vw,50px);font-weight:600;
  letter-spacing:-.04em;line-height:1.12;text-wrap:balance}
.intro__line span{display:inline-block;opacity:0;filter:blur(10px);will-change:opacity,filter,transform}
/* Aram's questions, where his words were: the question a little smaller,
   the answers under it as a row of quiet pills on the picture */
.intro__in{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;max-width:900px}
.intro.is-asking .intro__line{max-width:20em;font-size:clamp(26px,3.3vw,42px)}
.intro__ask{display:flex;flex-direction:column;align-items:center;width:100%}
.intro__ask:empty{display:none}
.intro__sub{max-width:33em;margin:16px 0 0;text-align:center;font-size:15.5px;line-height:1.5;color:rgba(42,42,60,.68);text-wrap:balance}
.intro__opts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:840px;margin-top:30px}
.intro__opt{display:inline-flex;align-items:center;gap:10px;padding:11px 18px 11px 11px;border:1px solid rgba(42,42,60,.14);border-radius:999px;
  background:rgba(255,255,255,.66);-webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);
  box-shadow:0 10px 26px -16px rgba(30,34,50,.4);font:inherit;font-size:15px;font-weight:500;letter-spacing:-.012em;color:#2a2a3c;cursor:pointer;
  transition:background-color .2s,color .2s,border-color .2s,transform .25s var(--spring)}
.intro__opt i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-style:normal;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;color:rgba(42,42,60,.62);box-shadow:inset 0 0 0 1px rgba(42,42,60,.2);transition:background-color .2s,color .2s,box-shadow .2s}
.intro__opt:hover{border-color:rgba(42,42,60,.36);background:rgba(255,255,255,.86)}
.intro__opt:active{transform:scale(.97)}
.intro__opt.is-on{background:#2a2a3c;border-color:#2a2a3c;color:#fff}
.intro__opt.is-on i{background:#fff;color:#2a2a3c;box-shadow:none}
.intro__nav{display:flex;align-items:center;justify-content:center;gap:26px;min-height:42px;margin-top:26px}
.intro__nav:empty{min-height:0}
.intro__back{display:inline-flex;align-items:center;gap:6px;padding:8px 4px;border:0;background:none;font:inherit;font-size:14px;color:rgba(42,42,60,.62);cursor:pointer}
.intro__back:hover{color:#2a2a3c}
.intro__back svg,.intro__go svg{width:15px;height:15px}
.intro__go{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border:0;border-radius:999px;background:#2a2a3c;color:#fff;
  font:inherit;font-size:14.5px;font-weight:500;cursor:pointer;transition:transform .25s var(--spring)}
.intro__go:active{transform:scale(.97)}
/* ============================================================
   the way — the tree, painted, and the courses on its branches
   ============================================================ */
.weg__stage{position:relative;height:calc(100svh - var(--chrome-h));min-height:560px;overflow:hidden}
.weg__tree,.weg__lines{position:absolute;inset:0;width:100%;height:100%}
.weg__lines{pointer-events:none;overflow:visible}
.weg__lines path{fill:none;stroke:var(--ink);stroke-width:.75;stroke-opacity:.28;
  transition:stroke-opacity .3s,stroke-dashoffset 1.1s var(--e-out)}
.weg__lines path.is-hot{stroke-opacity:.9}
.weg__title{position:absolute;top:30px;left:0;right:0;z-index:3;padding-inline:var(--pad);text-align:center}
.weg__title .meta{display:block;margin-bottom:10px}
.weg__title h1{font-size:clamp(24px,2.6vw,34px);font-weight:600;letter-spacing:-.035em;line-height:1.1}
.weg__hint{position:absolute;left:50%;bottom:18px;z-index:3;transform:translateX(-50%);display:inline-flex;
  align-items:center;gap:8px;padding:8px 12px;border:0;background:none;cursor:pointer;transition:color .2s}
.weg__hint:hover{color:var(--ink)}
.weg__hint svg{width:14px;height:14px;animation:nudge 2.4s var(--e-io) infinite}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(3px)}}
.dot{position:absolute;z-index:3;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;
  background:var(--ink);box-shadow:0 0 0 3px rgba(255,255,255,.95);pointer-events:none;
  transition:transform .6s var(--spring),opacity .4s}
.dot.is-hot{transform:scale(1.5)}
.dot i{position:absolute;inset:-7px;border-radius:50%;box-shadow:0 0 0 1px var(--ink);opacity:0;
  transition:opacity .3s}
.dot.is-hot i{opacity:.35}
.leaf{position:absolute;z-index:4;display:flex;flex-direction:column;gap:3px;max-width:15rem;padding:8px 0;
  border:0;background:none;text-align:left;cursor:pointer;transform:translateY(-50%)}
.leaf--l{align-items:flex-end;text-align:right;transform:translate(-100%,-50%)}
.leaf i{font-style:normal;font-size:10px;font-weight:500;letter-spacing:.22em;color:var(--ink-3)}
.leaf b{font-size:17px;font-weight:600;letter-spacing:-.025em;line-height:1.15;
  background:linear-gradient(var(--ink),var(--ink)) 0 100%/0 1.5px no-repeat;
  transition:background-size .45s var(--e-out)}
.leaf span{font-size:12.5px;color:var(--ink-2)}
.leaf--l b{background-position:100% 100%}
.leaf:hover b,.leaf:focus-visible b{background-size:100% 1.5px}
.leaf .num{display:none}

/* the tree in igloo's scene (src/app/igloo.js): the picture fills the window
   behind everything, the bar lies clear over it, the courses hang in a layer
   that stays with the picture, and the cards scroll up over both */
.scene3d{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity .6s var(--e-out),visibility 0s linear .6s}
.scene3d.is-on{opacity:1;visibility:visible;transition:opacity .6s var(--e-out)}
.scene3d canvas{display:block}
.on-scene .chrome:not(.is-solid){background:transparent;border-bottom-color:transparent;
  -webkit-backdrop-filter:none;backdrop-filter:none}
.weg--scene .weg__stage{height:100svh;min-height:560px;margin-top:calc(-1 * var(--chrome-h));overflow:visible}
.weg__float{position:fixed;inset:0;z-index:1;pointer-events:none}
.weg__cut{height:50svh}
.weg__float{transition:opacity .25s linear}
.weg__float .leaf{pointer-events:auto}
/* The courses on the tree: a ring on the course's own twigs, a hairline
   that grows out of the crown in a curve and runs on, level, as the
   course's progress under its name — the line and the bar are one stroke */
.weg--scene .weg__lines path{stroke:#2a2a3c;stroke-opacity:.34;stroke-width:1;stroke-linecap:round;
  stroke-dasharray:var(--len,900);stroke-dashoffset:var(--len,900);transition:stroke-opacity .3s,stroke-dashoffset 1.6s var(--e-out) var(--d,0s)}
.weg--scene .is-in .weg__lines path{stroke-dashoffset:0}
.weg--scene .weg__lines path.is-hot{stroke-opacity:.85}
.weg--scene .dot{width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;transform:none;
  background:rgba(255,255,255,.88);box-shadow:0 0 0 1px rgba(42,42,60,.62),0 0 0 4px rgba(255,255,255,.5),0 0 16px 2px rgba(255,255,255,.85)}
.weg--scene .dot.is-hot{transform:scale(1.3)}
/* its middle fills once the course has begun */
.weg--scene .dot i{display:block;position:absolute;inset:3px;border-radius:50%;background:#2a2a3c;box-shadow:none;
  opacity:0;transform:scale(.3);transition:opacity .4s,transform .5s var(--spring)}
.weg--scene .dot.is-on i{opacity:1;transform:none}
/* and round it, now and then, a ring goes out into the crown */
.weg--scene .dot::after{content:"";position:absolute;inset:-1px;border-radius:50%;box-shadow:0 0 0 1px rgba(42,42,60,.4);
  opacity:0;animation:ripple 4.8s var(--e-out) infinite;animation-delay:calc(var(--d,0s) * 6)}
@keyframes ripple{0%{opacity:.6;transform:scale(1)}55%,100%{opacity:0;transform:scale(2.6)}}
.weg--scene .leaf i{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.06em;color:rgba(42,42,60,.55)}
.weg--scene .leaf b{color:#2a2a3c}
.weg--scene .leaf span{color:rgba(42,42,60,.62)}
.weg--scene .weg__hint{z-index:2;color:rgba(42,42,60,.7)}
.weg--scene .leaf,.weg--scene .dot,.weg--scene .weg__lines,.weg--scene .weg__hint{opacity:0;pointer-events:none}
.weg--scene .is-in .leaf,.weg--scene .is-in .weg__hint{opacity:1;pointer-events:auto}
.weg--scene .is-in .dot,.weg--scene .is-in .weg__lines{opacity:1}
.weg--scene .weg__lines{transition:opacity .9s var(--e-out) .3s}
.leaf__bar{display:none}
/* the name stands on its line: the label is hung from the inner end of its bar */
.weg--scene .leaf{padding:8px 0 0;transform:translate(0,-100%)}
.weg--scene .leaf--l{transform:translate(-100%,-100%)}
.weg--scene .leaf__bar{display:block;flex:none;width:128px;height:2px;margin-top:8px;border-radius:0;overflow:visible;
  background:linear-gradient(rgba(42,42,60,.34),rgba(42,42,60,.34)) 0 50%/100% 1px no-repeat}
.weg--scene .leaf__bar i{background:#2a2a3c;border-radius:1px}
/* the progress runs out from the tree */
.weg--scene .leaf--l .leaf__bar i{transform-origin:100% 50%}
.weg--scene .dot{box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.weg--scene .dot:not(.is-on){background:#fff;box-shadow:0 0 0 1.5px #3c3c54,0 0 0 4px rgba(255,255,255,.7)}
.weg__sum{display:none}
.weg--scene .weg__sum{position:absolute;left:var(--pad);bottom:30px;z-index:2;display:flex;flex-direction:column;gap:7px;
  width:min(250px,calc(100vw - 2 * var(--pad)));padding:16px 18px 15px;border-radius:16px;
  background:rgba(255,255,255,.74);-webkit-backdrop-filter:saturate(1.3) blur(16px);backdrop-filter:saturate(1.3) blur(16px);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 30px -12px rgba(30,34,50,.25);
  opacity:0;transition:opacity .9s var(--e-out) var(--d,0s)}
.weg--scene .is-in .weg__sum{opacity:1}
.weg__sum b{font-size:28px;font-weight:600;letter-spacing:-.04em;line-height:1;color:#2a2a3c;font-variant-numeric:tabular-nums}
.weg__sum b em{font-style:normal;font-size:14px;font-weight:500;letter-spacing:-.01em;color:rgba(42,42,60,.62)}
.weg__sum .bar{flex:none;background:rgba(42,42,60,.14)}
.weg__sum .bar i{background:#2a2a3c}
.weg__pct{font-size:12px;color:rgba(42,42,60,.62)}
@media (max-width:760px){
  .weg--scene .weg__sum{bottom:62px;left:50%;transform:translateX(-50%);align-items:center;text-align:center}
  .weg--scene .weg__sum .bar{align-self:stretch}
  .weg--scene .leaf__bar{display:none}
}
.weg--scene ~ .kurse{position:relative;z-index:2}

/* while it paints, nothing else is on the page */
.is-painting .chrome{opacity:0;transform:translateY(-10px);pointer-events:none}
.is-painting .weg__title,.is-painting .leaf,.is-painting .dot,.is-painting .weg__hint,
.is-painting .kurse{opacity:0;pointer-events:none}
.is-painting .weg__lines path{stroke-dashoffset:var(--len)}
.weg__title,.leaf,.dot,.weg__hint,.kurse{transition:opacity .9s var(--e-out),transform .9s var(--e-out);
  transition-delay:var(--d,0s)}
.is-painting .dot{transform:scale(0)}
/* over the picture, while Aram speaks and asks, there is only the tree and his words */
.is-painting .weg--scene .leaf,.is-painting .weg--scene .dot,.is-painting .weg--scene .weg__lines,
.is-painting .weg--scene .weg__cards,.is-painting .weg--scene .weg__hint{opacity:0 !important;pointer-events:none !important}

/* the same courses, as Skool's classroom cards */
.kurse{padding-block:64px 104px}
.kurse__head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px}
.kurse__head h2{font-size:22px;font-weight:600;letter-spacing:-.03em}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.course{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--paper);transition:transform .5s var(--e-out),box-shadow .5s var(--e-out)}
.course:hover{transform:translateY(-3px);
  box-shadow:0 18px 34px rgba(10,10,10,.07),0 3px 8px rgba(10,10,10,.05)}
.course__cover{position:relative;aspect-ratio:16/10;border-bottom:1px solid var(--line-2);overflow:hidden}
.course__cover svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .8s var(--e-out)}
.course:hover .course__cover svg{transform:scale(1.04)}
.course__body{display:flex;flex-direction:column;gap:4px;padding:16px 18px 4px}
.course__body i{font-style:normal;font-size:10px;font-weight:500;letter-spacing:.22em;color:var(--ink-3)}
.course__body b{font-size:16px;font-weight:600;letter-spacing:-.02em}
.course__desc{font-size:13.5px;line-height:1.5;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.course__prog{display:flex;align-items:center;gap:12px;padding:14px 18px 16px;margin-top:auto}
.course__prog em{font-style:normal;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}

/* ============================================================
   one course — Skool's classroom: lessons on the left, the
   lesson on the right
   ============================================================ */
.cv{display:grid;grid-template-columns:280px minmax(0,1fr);gap:56px;padding-block:32px 112px}
.cv__side{position:sticky;top:calc(var(--chrome-h) + 28px);align-self:start;
  max-height:calc(100vh - var(--chrome-h) - 56px);overflow:hidden auto;scrollbar-width:thin;
  padding-inline:10px;margin-inline:-10px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);margin-bottom:20px;
  transition:color .2s,gap .3s var(--e-out)}
.back:hover{color:var(--ink);gap:9px}
.back svg{width:14px;height:14px}
.back--m{display:none;margin-bottom:16px}
.cv__num{display:block;margin-bottom:6px}
.cv__title{font-size:21px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
.cv__prog{display:flex;align-items:center;gap:10px;margin:14px 0 20px}
.cv__prog span:last-child{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.mod{border-top:1px solid var(--line-2);padding:14px 0 6px}
.mod__head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px;
  font-size:13px;font-weight:600}
.mod__head small{font-size:12px;font-weight:500;color:var(--ink-3)}
.mod__list{list-style:none;margin:0;padding:0}
.les{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;
  margin:0 -10px;border-radius:8px;font-size:14px;line-height:1.35;color:var(--ink-2);transition:background .2s,color .2s}
.les:hover{background:var(--mist);color:var(--ink)}
.les.is-on{background:var(--mist);color:var(--ink);font-weight:500}
.les small{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chk{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink-3);display:grid;
  place-items:center;transition:background .3s,box-shadow .3s}
.chk svg{width:10px;height:10px;color:var(--paper);opacity:0;transform:scale(.4);transition:opacity .3s,transform .4s var(--spring)}
.is-done .chk{background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.is-done .chk svg{opacity:1;transform:none}
/* ============================================================
   community — Skool's feed with the group on the right;
   posts divided by hairlines instead of boxed
   ============================================================ */
.composer{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 8px;border-radius:999px;
  box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .25s}
.composer:focus-within{box-shadow:inset 0 0 0 1px var(--ink)}
.composer input{flex:1;min-width:0;height:36px;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--ink)}
.composer input::placeholder{color:var(--ink-3)}
.composer .btn{border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
.chip{height:32px;padding:0 14px;border:0;border-radius:999px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);
  font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.chip:hover{color:var(--ink)}
.chip.is-on{background:var(--ink);color:var(--paper);box-shadow:none}
.post{padding:24px 0;border-bottom:1px solid var(--line-2)}
.post__head{display:flex;align-items:center;gap:12px}
.post__who b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.post__who span{font-size:12px;color:var(--ink-2)}
.post__pin{margin-left:auto}
.post h3{margin:14px 0 4px;font-size:17px;font-weight:600;letter-spacing:-.02em}
.post p{font-size:15px;line-height:1.6;color:rgba(10,10,10,.8)}
.post__foot{display:flex;gap:6px;margin-top:12px}
.act{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;margin-left:-10px;border:0;border-radius:8px;
  background:none;font-size:13px;color:var(--ink-2);cursor:pointer;transition:background .2s,color .2s}
.act+.act{margin-left:0}
.act:hover{background:var(--mist);color:var(--ink)}
.act svg{width:16px;height:16px}
.act.is-on{color:var(--ink)}
.act.is-on svg{fill:currentColor}
.act.is-pop svg{animation:heart-pop .45s var(--spring)}
@keyframes heart-pop{0%{transform:scale(1)}35%{transform:scale(1.32)}100%{transform:scale(1)}}
/* the conversation under a post: it unfolds in place, a hairline down its left */
.thread{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--e-out)}
.post.is-open .thread{grid-template-rows:1fr}
.thread__in{min-height:0;overflow:hidden;opacity:0;transition:opacity .35s var(--e-out)}
.post.is-open .thread__in{opacity:1;transition-delay:.08s}
.cmts{list-style:none;margin:16px 0 0;padding:0 0 0 18px;border-left:1px solid var(--line-2)}
.cmts:empty{display:none}
.cmt{display:flex;gap:10px;padding:9px 0}
.cmt .avatar{width:28px;height:28px;font-size:10px}
.cmt__body{min-width:0}
.cmt__head{display:flex;align-items:baseline;gap:8px;line-height:1.3}
.cmt__head b{font-size:13px;font-weight:600}
.cmt__head i{font-style:normal;font-size:11px;font-weight:500;color:var(--ink-2)}
.cmt__head span{font-size:12px;color:var(--ink-3)}
.post .cmt p{margin:3px 0 0;font-size:14px;line-height:1.55}
.cmt.is-new{animation:cmt-in .5s var(--e-out)}
@keyframes cmt-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cmts__none{margin:14px 0 0 18px;font-size:13px;color:var(--ink-3)}
.cmt-form{display:flex;align-items:center;gap:10px;margin:10px 0 4px 18px;padding:4px 4px 4px 6px;border-radius:999px;
  box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .25s}
.cmt-form:focus-within{box-shadow:inset 0 0 0 1px var(--ink)}
.cmt-form .avatar{width:28px;height:28px;font-size:10px}
.cmt-form input{flex:1;min-width:0;height:32px;border:0;outline:0;background:none;font:inherit;font-size:14px;color:var(--ink)}
.cmt-form input::placeholder{color:var(--ink-3)}
.cmt-send{display:grid;place-items:center;flex:none;width:32px;height:32px;border:0;border-radius:50%;background:var(--ink);color:var(--paper);
  cursor:pointer;opacity:.28;transition:opacity .2s,transform .25s var(--spring)}
.cmt-send svg{width:15px;height:15px}
.cmt-form.has-text .cmt-send{opacity:1}
.cmt-send:active{transform:scale(.92)}
.group{padding:20px}
.group b{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em}
.group small{display:block;margin:2px 0 12px;font-size:12px;color:var(--ink-3)}
.group p{font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.group .stats{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2)}
.group__next{display:block;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2);font-size:13px;color:var(--ink-2)}
.group__next b{display:block;margin-top:4px;font-size:14px}

/* kalender, mitglieder */
.cal{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid var(--line-2)}
.cal li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:20px;align-items:center;padding:18px 0;
  border-bottom:1px solid var(--line-2)}
.cal__date b{display:block;font-size:28px;font-weight:600;letter-spacing:-.04em;line-height:1}
.cal__date span{font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.cal__what b{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em}
.cal__what span{font-size:13px;color:var(--ink-2)}
.here{margin-top:26px}
.here__row{display:flex;align-items:center;margin-top:12px;padding-left:2px}
.here__who{position:relative;margin-right:-9px}
.here__who .avatar{width:36px;height:36px;box-shadow:0 0 0 2.5px var(--paper)}
.here__more{margin-left:20px;font-size:13px;color:var(--ink-2)}
.joined{margin-top:28px}
.joined ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.joined li{display:grid;grid-template-columns:22px auto minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13.5px}
.joined li b{font-weight:600}
.joined li span:not(.avatar){color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.joined em{font-style:normal;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
[data-members]{font-variant-numeric:tabular-nums}
[data-members].is-new{animation:joined 1.6s var(--e-out)}
@keyframes joined{0%{opacity:.35}100%{opacity:1}}
.people{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px}
.person{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.person b{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em}
.person > div > span{font-size:13px;color:var(--ink-2)}
.person .badge--outline{margin-left:auto;white-space:nowrap}
.more{margin-top:22px;font-size:13px;color:var(--ink-2)}

.toast{position:fixed;left:50%;bottom:24px;z-index:90;padding:10px 16px;border-radius:999px;background:var(--ink);
  color:var(--paper);font-size:13px;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;
  transform:translate(-50%,8px);transition:opacity .3s var(--e-out),transform .4s var(--e-out)}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

/* a reminder is a small switch, not a button */
.remind{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:999px;
  background:none;box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;
  transition:background .25s,color .25s,box-shadow .25s}
.remind:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.remind svg{width:14px;height:14px}
.remind.is-on{background:var(--ink);color:var(--paper);box-shadow:none}

/* the button under "Loslegen", shared with the start page */
/* ============================================================
   05 · liquid-metal-button — the original's stack:
   a shader plate, a black core floating 10px above it, and a
   transparent hit surface on top. Springy 0.8s easing throughout.
   ============================================================ */
/* it is a link now: no underline, and no visited-purple either */
.lmb{position:relative;display:inline-block;border:0;padding:0;background:none;
  color:inherit;text-decoration:none;
  cursor:pointer;border-radius:100px;transform-style:preserve-3d;perspective:600px;
  transition:transform .8s var(--spring)}

/* the plate that carries the metal and the shadow stack */
.lmb__plate{position:relative;border-radius:100px;overflow:hidden;
  transform:translateZ(0);
  box-shadow:0 0 0 1px rgba(0,0,0,.3),
             0 36px 14px rgba(0,0,0,.02), 0 20px 12px rgba(0,0,0,.08),
             0 9px 9px rgba(0,0,0,.12),   0 2px 5px rgba(0,0,0,.15);
  transition:box-shadow .15s cubic-bezier(.4,0,.2,1),transform .8s var(--spring)}
.lmb:hover .lmb__plate{box-shadow:0 0 0 1px rgba(0,0,0,.4),
  0 12px 6px rgba(0,0,0,.05), 0 8px 5px rgba(0,0,0,.1),
  0 4px 4px rgba(0,0,0,.15),  0 1px 2px rgba(0,0,0,.2)}
.lmb__shader{position:absolute;inset:0;border-radius:100px;overflow:hidden;
  background:linear-gradient(180deg,#3a3a3a,#0c0c0c)}
.lmb__shader canvas{display:block;width:100%!important;height:100%!important}

/* the core sits 2px in and 10px forward, exactly as in the original */
.lmb__core{position:relative;z-index:2;margin:2px;border-radius:100px;
  min-height:42px;padding:0 24px;display:grid;place-items:center;
  background:linear-gradient(180deg,#202020 0%,#000 100%);
  transform:translateZ(10px);
  transition:transform .8s var(--spring),box-shadow .15s cubic-bezier(.4,0,.2,1)}
.lmb.is-down{transform:translateY(1px) scale(.98)}
.lmb.is-down .lmb__core{box-shadow:inset 0 2px 4px rgba(0,0,0,.4),
  inset 0 1px 2px rgba(0,0,0,.3)}
.lmb__label{position:relative;z-index:3;color:#fff;font-size:13px;font-weight:600;
  letter-spacing:.02em;white-space:nowrap}
.lmb__ripple{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;
  border-radius:50%;pointer-events:none;z-index:4;
  background:radial-gradient(circle,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 70%);
  animation:ripple .6s ease-out forwards}
@keyframes ripple{from{transform:scale(.4);opacity:1}to{transform:scale(9);opacity:0}}

/* ---- variants for the Inner Circle: the same metal, other sizes and cores ---- */
.lmb--block{display:block;width:100%}
.lmb--block .lmb__core{min-height:46px}
.lmb--sm .lmb__core{min-height:36px;padding:0 18px}
.lmb--sm .lmb__label{font-size:12.5px}
/* a white core in the same metal rim, for the second button next to a first */
.lmb--light .lmb__core{background:linear-gradient(180deg,#fff 0%,#f2f2f0 100%)}
.lmb--light .lmb__label{color:#0A0A0A}
.lmb--light .lmb__ripple{background:radial-gradient(circle,rgba(10,10,10,.14) 0%,rgba(10,10,10,0) 70%)}
.lmb__label{display:inline-flex;align-items:center;gap:8px}
.lmb__label svg{width:15px;height:15px;flex:none}
.lmb[disabled],.lmb.is-off{cursor:default;opacity:.4;filter:grayscale(1)}


/* the lessons, their exercises, the tour */
/* ============================================================
   a lesson — wide and quiet: the course on the left, the lesson
   on the right as video, reading and exercises, one under the other
   ============================================================ */
.lv{display:grid;grid-template-columns:268px minmax(0,1fr);gap:clamp(32px,4vw,72px);max-width:1280px;
  margin-inline:auto;padding:28px var(--pad) 120px}
.lv__side{position:sticky;top:calc(var(--chrome-h) + 24px);align-self:start;
  max-height:calc(100vh - var(--chrome-h) - 48px);overflow:hidden auto;scrollbar-width:thin;
  scrollbar-color:var(--line) transparent;padding-right:6px}
.lv__main{min-width:0;max-width:880px}

.lh__crumb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.lh__crumb a:hover{color:var(--ink)}
.lh__crumb i{width:3px;height:3px;border-radius:50%;background:var(--ink-3)}
.lh__title{margin:14px 0 0;font-size:clamp(30px,4vw,48px);font-weight:600;letter-spacing:-.045em;line-height:1.04;text-wrap:balance}
.lh__meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.lh__chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;
  box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.lh__chip b{color:var(--ink);font-weight:600}
.lh__chip.is-done{background:var(--ink);color:var(--paper);box-shadow:none}
.lh__chip svg{width:13px;height:13px}
.lh__goal{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:22px;padding:16px 18px;border-radius:var(--r);
  background:var(--mist);font-size:15.5px;line-height:1.5}
.lh__goal span{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}

/* the video, until it is filmed */
.lvid{position:relative;margin-top:28px;aspect-ratio:16/9;border-radius:16px;overflow:hidden;
  background:radial-gradient(120% 90% at 30% 20%,#2a2a2a 0%,#0e0e0e 60%,#080808 100%);color:#fff;
  display:grid;place-items:center}
.lvid__play{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
  transition:transform .4s var(--e-out),background .3s}
.lvid:hover .lvid__play{transform:scale(1.06);background:rgba(255,255,255,.18)}
.lvid__play svg{width:24px;height:24px;margin-left:4px}
.lvid__cap{position:absolute;left:22px;right:22px;bottom:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.lvid__cap b{font-size:clamp(14px,1.6vw,17px);font-weight:600;letter-spacing:-.015em;line-height:1.3;max-width:34em}
.lvid__cap span{flex:none;font-size:12px;font-weight:500;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.14)}
.lvid__tag{position:absolute;left:22px;top:18px;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.5)}

/* the reading */
.lt{margin-top:40px}
.lt > *{max-width:66ch}
.lt > p{font-size:17px;line-height:1.72;color:rgba(10,10,10,.82)}
.lt > p + p{margin-top:14px}
.lt > * + p{margin-top:16px}
.lt b{color:var(--ink);font-weight:600}
.lt h3{margin-top:34px;font-size:20px;font-weight:600;letter-spacing:-.025em}
.lt__list{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.lt__list li{position:relative;padding-left:22px;font-size:16.5px;line-height:1.62;color:rgba(10,10,10,.82)}
.lt__list li::before{content:"";position:absolute;left:3px;top:.68em;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.lt__steps{list-style:none;margin:18px 0 0;padding:0;counter-reset:s;display:grid;gap:14px}
.lt__steps li{position:relative;padding-left:44px;font-size:16.5px;line-height:1.62;counter-increment:s;color:rgba(10,10,10,.82)}
.lt__steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;background:var(--ink);color:var(--paper);font-size:12.5px;font-weight:600}
.lt__note{position:relative;margin-top:22px;padding:16px 18px 16px 20px;border-radius:var(--r);font-size:15.5px;line-height:1.6;
  background:var(--mist)}
.lt__note::before{display:block;margin-bottom:4px;font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.lt__note--tip::before{content:"Tipp"}
.lt__note--mistake{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.lt__note--mistake::before{content:"Häufiger Fehler"}
.lt__fig{max-width:none !important;margin:26px 0 0;padding:18px 18px 16px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line)}
.lt__fig figcaption{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;
  font-size:13px;font-weight:600;letter-spacing:-.01em}
.lt__fig figcaption span{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}

/* the exercises */
.lx{margin-top:56px}
.lx__head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lx__head h2{font-size:26px;font-weight:600;letter-spacing:-.035em}
.lx__head .lx__count{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lx__bar{margin-top:14px}
.task{position:relative;margin-top:18px;padding:22px 22px 20px;border-radius:18px;background:var(--paper);
  box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .4s var(--e-out)}
.task.is-done{box-shadow:inset 0 0 0 1.5px var(--ink)}
.task__head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:14px}
.task__n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;
  box-shadow:inset 0 0 0 1px var(--line);transition:background .3s,color .3s}
.task__n svg{width:15px;height:15px;display:none}
.task.is-done .task__n{background:var(--ink);color:var(--paper);box-shadow:none}
.task.is-done .task__n span{display:none}
.task.is-done .task__n svg{display:block}
.task.is-pop .task__n{animation:pop .5s var(--spring)}
@keyframes pop{40%{transform:scale(1.22)}}
.task__kind{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.task__title{display:block;margin-top:3px;font-size:18px;font-weight:600;letter-spacing:-.025em;line-height:1.3}
.task__text{margin-top:6px;font-size:15px;line-height:1.55;color:var(--ink-2);max-width:62ch}
.task__flag{display:none;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--ink);
  color:var(--paper);font-size:11.5px;font-weight:600;white-space:nowrap}
.task__flag svg{width:12px;height:12px}
.task.is-done .task__flag{display:inline-flex}
.task__body{margin-top:18px}

.lup{display:grid;justify-items:center;gap:6px;margin-top:22px;padding:30px 20px;text-align:center;border-radius:18px;
  border:1.5px dashed var(--line)}
.lup svg{width:22px;height:22px;color:var(--ink-3);margin-bottom:2px}
.lup b{font-size:15px;font-weight:600}
.lup span{font-size:13px;color:var(--ink-2);max-width:42ch}

.lend{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:44px;padding-top:24px;
  border-top:1px solid var(--line-2)}
.lend p{font-size:15px;color:var(--ink-2)}
.lend p b{color:var(--ink)}
.lend__nav{display:flex;gap:10px;margin-left:auto}
.lend .btn.is-due{box-shadow:0 0 0 4px rgba(10,10,10,.08)}

/* the course list in the sidebar */
.lv__side .cv__title{font-size:20px}
.lv__mobilenav{display:none}

/* ---- the exercises' own parts ------------------------------------------- */
.dk{--ui:40px}
.dk-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:14px}
.dk-gap{flex:1}
.dk-play{width:44px;height:44px;flex:none;border:0;border-radius:50%;display:grid;place-items:center;background:var(--ink);
  color:var(--paper);cursor:pointer;transition:transform .2s var(--e-out),background .2s}
.dk-play:hover{background:rgba(10,10,10,.86)}
.dk-play:active{transform:scale(.94)}
.dk-play svg{width:16px;height:16px}
.dk-play svg:first-child{margin-left:2px}
.dk-play svg:last-child,.is-playing .dk-play[data-play] svg:first-child{display:none}
.is-playing .dk-play[data-play] svg:last-child{display:block}
.dk-play--sm{width:34px;height:34px}
.dk-play--sm svg{width:13px;height:13px}
.pr__item.is-running .dk-play svg:first-child{display:none}
.pr__item.is-running .dk-play svg:last-child{display:block}
.dk-tempo{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 220px;max-width:380px}
.dk-tempo span{font-size:12px;font-weight:500;color:var(--ink-2)}
.dk-tempo output{flex:none;min-width:64px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.dk-tempo output b{color:var(--ink);font-weight:600}
.dk input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:60px;height:24px;background:none;cursor:pointer;margin:0}
.dk input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:var(--line)}
.dk input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:var(--line)}
.dk input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7.5px;border-radius:50%;
  background:var(--paper);box-shadow:0 0 0 1.5px var(--ink),0 2px 6px rgba(10,10,10,.12)}
.dk input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--paper);
  box-shadow:0 0 0 1.5px var(--ink),0 2px 6px rgba(10,10,10,.12)}
.dk-toggle,.dk-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border:0;border-radius:999px;
  font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s,transform .2s var(--e-out)}
.dk-toggle{background:none;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.dk-toggle.is-on{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.dk-toggle svg,.dk-btn svg{width:15px;height:15px}
.dk-btn{background:var(--ink);color:var(--paper)}
.dk-btn:hover{background:rgba(10,10,10,.86)}
.dk-btn:active,.dk-toggle:active{transform:scale(.97)}
.dk-btn--ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.dk-btn--ghost:hover{background:var(--mist)}
.dk-link{border:0;background:none;padding:0;margin-left:6px;font:inherit;font-weight:600;color:var(--ink);text-decoration:underline;
  text-underline-offset:3px;cursor:pointer}
.dk-status{display:none;align-items:flex-start;gap:8px;margin-top:14px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.dk-status.is-show{display:flex;flex-wrap:wrap}
.dk-status.is-ok{color:var(--ink);font-weight:500}
.dk-status svg{width:16px;height:16px;flex:none;margin-top:2px}
.dk-tabs{display:inline-flex;gap:2px;padding:3px;margin-bottom:14px;border-radius:999px;background:var(--mist);max-width:100%;overflow-x:auto;scrollbar-width:none}
.dk-tab{height:30px;padding:0 13px;border:0;border-radius:999px;background:none;font-size:13px;font-weight:500;color:var(--ink-2);
  cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.dk-tab.is-on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(10,10,10,.1)}
.dk-scroll{overflow-x:auto;scrollbar-width:thin;margin-inline:-4px;padding:4px}

/* the groove grid */
.dg{display:grid;gap:6px;min-width:calc(92px + var(--cols) * 22px)}
.dg__row{display:grid;grid-template-columns:92px repeat(var(--cols),minmax(18px,1fr));align-items:center;column-gap:3px}
.dg__name{font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap;padding-right:8px}
.dg__count{text-align:center;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;border-radius:6px;padding:2px 0;
  transition:background .08s,color .08s}
.dg__count.is-beat{color:var(--ink);font-weight:600}
.dg__count.is-now{background:var(--ink);color:var(--paper)}
.dg__cell,.dg__cell:where(button){position:relative;display:grid;place-items:center;height:30px;border:0;padding:0;border-radius:8px;
  background:var(--mist);font:inherit}
.dg__cell.is-beat{background:#EFEFEC}
.dg__cell.is-bar,.dg__count.is-bar{margin-left:6px}
.dg__cell i{width:12px;height:12px;border-radius:50%;background:transparent;transition:transform .12s,background .12s}
.dg__cell.is-x i{background:var(--ink)}
.dg__cell.is-acc i{width:15px;height:15px;box-shadow:0 0 0 3px rgba(10,10,10,.12)}
.dg__cell.is-ghost i{width:9px;height:9px;background:none;box-shadow:inset 0 0 0 1.5px var(--ink)}
.dg__cell.is-open i{background:none;box-shadow:inset 0 0 0 2px var(--ink)}
.dg__cell.is-cs i{border-radius:2px;transform:rotate(45deg);width:10px;height:10px}
.dg__cell.is-now{background:#E3E3DF}
.dg__cell.is-now.is-x i{transform:scale(1.35)}
.dg--edit .dg__cell{cursor:pointer;transition:background .15s}
.dg--edit .dg__cell:hover{background:#E6E6E2}
.dg--edit .dg__cell:not(.is-x):hover i{background:rgba(10,10,10,.18)}
.dg__cell.is-wrong{background:#FBE3E1}
.dg__cell.is-missing{box-shadow:inset 0 0 0 1.5px var(--ink);animation:nudge .6s var(--e-out) 2}
@keyframes nudge{50%{transform:scale(1.08)}}
.is-solved .dg--edit .dg__cell{cursor:default}

/* tap along */
.tp__lane{position:relative;height:74px;border-radius:14px;background:var(--mist);overflow:hidden}
.tp__lane.is-flash{animation:flash .25s ease-out}
@keyframes flash{from{background:#E9E9E5}to{background:var(--mist)}}
.tp__beat{position:absolute;left:calc(var(--x) * 100%);top:8px;transform:translateX(4px);font-size:11px;font-weight:600;color:var(--ink-3)}
.tp__beat:first-of-type{transform:translateX(10px)}
.tp__mark{position:absolute;left:calc(var(--x) * (100% - 24px) + 12px);top:28px;bottom:12px;width:3px;margin-left:-1.5px;border-radius:3px;background:rgba(10,10,10,.22)}
.tp__head{position:absolute;left:calc(var(--x,0) * (100% - 24px) + 12px);top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);opacity:0}
.tp__taps{position:absolute;inset:0}
.tp__tap{position:absolute;left:calc(var(--x) * (100% - 24px) + 12px);top:34px;width:12px;height:12px;margin-left:-6px;border-radius:50%;
  background:var(--ink);animation:land .3s var(--e-out)}
.tp__tap.is-good{background:rgba(10,10,10,.6)}
.tp__tap.is-near{background:none;box-shadow:inset 0 0 0 2px rgba(10,10,10,.55)}
.tp__tap.is-extra{background:#D9534F;width:8px;height:8px;margin-left:-4px;top:36px}
@keyframes land{from{transform:translateY(-10px);opacity:0}}
.tp__row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;margin-top:16px}
.tp__pad{width:132px;height:132px;border:0;border-radius:24px;display:grid;place-content:center;gap:4px;justify-items:center;
  background:var(--ink);color:var(--paper);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  box-shadow:0 10px 28px rgba(10,10,10,.18);transition:transform .08s,box-shadow .08s}
.tp__pad span{font-size:17px;font-weight:600;letter-spacing:-.01em}
.tp__pad small{font-size:11px;color:rgba(255,255,255,.55)}
.tp__pad:active{transform:scale(.95);box-shadow:0 4px 12px rgba(10,10,10,.2)}
.tp__info p{font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.tp__info p b{color:var(--ink)}
.tp__big{font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1;min-height:0}
.tp__big:empty{display:none}
.tt__bpm{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.tt__bpm b{font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.tt__bpm span{font-size:13px;color:var(--ink-2)}

/* find the count */
.pl__ask{font-size:16px}
.pl__ask b{font-weight:600}
.pl{position:relative;margin-top:16px;padding:0 12px}
.pl__line{position:relative;height:64px}
.pl__line::before{content:"";position:absolute;left:0;right:0;top:34px;height:2px;border-radius:2px;background:var(--line)}
.pl__tick{position:absolute;left:calc(var(--x) * 100%);top:28px;width:1.5px;height:14px;margin-left:-.75px;background:rgba(10,10,10,.22)}
.pl__tick.is-beat{top:22px;height:26px;width:2px;background:var(--ink)}
.pl__tick b{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;font-style:normal}
.pl__marker{position:absolute;left:calc(var(--x,0) * 100%);top:23px;width:24px;height:24px;margin-left:-12px;border-radius:50%;
  background:var(--ink);box-shadow:0 0 0 5px rgba(10,10,10,.1);transition:left .12s var(--e-out),transform .15s}
.pl__marker.is-hit{transform:scale(1.25)}
.pl__range{position:absolute;inset:0 0 0 0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.pl__round{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* tempo ladder */
.tl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.tl__label{font-size:12.5px;color:var(--ink-2);margin-right:4px}
.tl__step{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border:0;border-radius:999px;background:none;
  box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;
  transition:background .2s,color .2s}
.tl__step svg{width:13px;height:13px;display:none}
.tl__step.is-on{background:var(--ink);color:var(--paper);box-shadow:none}
.tl__step.is-on svg{display:block}

/* sticking */
.st{display:flex;flex-wrap:wrap;gap:6px}
.st__n{position:relative;display:grid;place-items:center;min-width:44px;height:52px;padding:0 6px;border-radius:12px;background:var(--mist);
  font-size:20px;font-weight:600;letter-spacing:-.02em;transition:background .08s,color .08s}
.st__n.is-acc::before{content:">";position:absolute;top:-2px;font-size:12px;font-weight:600;color:var(--ink-2)}
.st__n.is-ghost{color:var(--ink-3);font-size:16px}
.st__n small{font-size:11px;margin-right:1px;color:var(--ink-2)}
.st__n.is-now{background:var(--ink);color:var(--paper)}
.st__n.is-now small,.st__n.is-now.is-acc::before{color:rgba(255,255,255,.6)}

/* feel slider */
.fl{margin-top:16px}
.fl__scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-bottom:2px}
.fl__range{width:100%}
.fl__val{display:block;margin-top:4px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}

/* quiz */
.qz__top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qz__n{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.02em}
.qz__q{margin-top:10px;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.35}
.qz__a{display:grid;gap:8px;margin-top:14px}
.qz__opt{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 16px 10px 12px;
  border:0;border-radius:14px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);text-align:left;font-size:15px;line-height:1.4;
  cursor:pointer;transition:box-shadow .2s,background .2s,transform .15s var(--e-out)}
.qz__opt:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.qz__opt:active{transform:scale(.99)}
.qz__opt span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--mist);font-size:12px;font-weight:600}
.qz__opt.is-right{box-shadow:inset 0 0 0 2px var(--ink)}
.qz__opt.is-right span{background:var(--ink);color:var(--paper)}
.qz__opt.is-wrong{opacity:.5;text-decoration:line-through;text-decoration-color:rgba(10,10,10,.35);cursor:default}

/* kit */
.kt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kt__pad{position:relative;display:grid;align-content:start;gap:4px;min-height:112px;padding:14px 14px 14px;border:0;border-radius:16px;
  background:var(--mist);text-align:left;cursor:pointer;touch-action:manipulation;transition:background .2s,transform .1s}
.kt__pad b{font-size:15px;font-weight:600;letter-spacing:-.015em}
.kt__pad span{font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.kt__pad i{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;display:none;place-items:center;
  background:var(--ink);color:var(--paper)}
.kt__pad i svg{width:11px;height:11px}
.kt__pad.is-heard i{display:grid}
.kt__pad.is-hit{animation:hit .35s var(--e-out)}
@keyframes hit{30%{transform:scale(.96);background:#E4E4E0}}

/* checklist and plan */
.ck,.pr{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ck__item{display:grid;grid-template-columns:26px minmax(0,1fr);align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 14px;
  border:0;border-radius:12px;background:var(--mist);text-align:left;font-size:15px;line-height:1.4;cursor:pointer;transition:background .2s}
.ck__item:hover{background:#EFEFEC}
.ck__item i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);color:transparent;transition:background .2s,color .2s}
.ck__item i svg{width:13px;height:13px}
.ck__item.is-on i{background:var(--ink);color:var(--paper);box-shadow:none}
.ck__item.is-on span{color:var(--ink-2)}
.pr__item{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:12px;background:var(--mist)}
.pr__text b{display:block;font-size:15px;font-weight:500;line-height:1.35}
.pr__text span{font-size:12.5px;color:var(--ink-2)}
.pr__time{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.pr__done{width:34px;height:34px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);
  color:transparent;cursor:pointer;transition:background .2s,color .2s}
.pr__done svg{width:14px;height:14px}
.pr__item.is-on .pr__done{background:var(--ink);color:var(--paper);box-shadow:none}
.pr__item.is-on .pr__text b{color:var(--ink-2)}

/* song */
.sg{list-style:none;margin:0;padding:0;display:flex;gap:4px}
.sg__sec{position:relative;flex:var(--bars) 1 0;min-width:0;padding:12px 10px;border-radius:12px;background:var(--mist);overflow:hidden}
.sg__sec b{position:relative;z-index:1;display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg__sec span{position:relative;z-index:1;font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.sg__fill{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(var(--p,0));background:#E2E2DE;transition:transform .12s linear}
.sg__sec.is-on{box-shadow:inset 0 0 0 1.5px var(--ink)}
.sg__sec.is-past .sg__fill{transform:scaleX(1)}
.sg__now{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ============================================================
   the tour — the page dims, one place stays lit, and a card
   beside it says what you are looking at
   ============================================================ */
.tour{position:fixed;inset:0;z-index:85}
.tour__veil{position:fixed;inset:0;background:rgba(10,10,10,0);transition:background .5s var(--e-out)}
.tour.is-in .tour__veil{background:rgba(10,10,10,.001)}
.tour__spot{position:fixed;left:50%;top:50%;width:0;height:0;border-radius:20px;pointer-events:none;
  box-shadow:0 0 0 200vmax rgba(12,12,12,0);
  transition:left .6s var(--e-out),top .6s var(--e-out),width .6s var(--e-out),height .6s var(--e-out),box-shadow .5s var(--e-out)}
.tour.is-in .tour__spot{box-shadow:0 0 0 200vmax rgba(12,12,12,.58),0 0 0 1.5px rgba(255,255,255,.9),0 0 40px rgba(255,255,255,.25)}
.tour__spot.is-none{width:0 !important;height:0 !important}
.tour__card{position:fixed;width:min(380px,calc(100vw - 32px));padding:22px 22px 18px;background:var(--paper);border-radius:20px;
  box-shadow:0 30px 80px rgba(0,0,0,.28),0 6px 18px rgba(0,0,0,.12);opacity:0;transform:translateY(8px) scale(.98);
  transition:opacity .35s var(--e-out),transform .45s var(--e-out),left .6s var(--e-out),top .6s var(--e-out)}
.tour.is-in .tour__card{opacity:1;transform:none}
.tour__card.is-swap{opacity:0;transform:translateY(6px)}
.tour__x{position:absolute;top:12px;right:12px;width:32px;height:32px;border:0;border-radius:50%;display:grid;place-items:center;
  background:none;color:var(--ink-3);cursor:pointer;transition:background .2s,color .2s}
.tour__x:hover{background:var(--mist);color:var(--ink)}
.tour__x svg{width:16px;height:16px}
.tour__step{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.tour__card h2{margin-top:8px;padding-right:24px;font-size:21px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
.tour__card p{margin-top:8px;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.tour__anat{display:grid;gap:6px;margin-top:14px}
.tour__anat div{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--mist);font-size:13.5px}
.tour__anat i{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-style:normal;font-size:12px;font-weight:600}
.tour__anat b{font-weight:600}
.tour__anat span{color:var(--ink-2)}
.tour__prog{display:flex;gap:4px;margin-top:18px}
.tour__prog i{flex:1;height:3px;border-radius:3px;background:var(--line);transition:background .4s}
.tour__prog i.is-on{background:var(--ink)}
.tour__foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.tour__back{border:0;background:none;padding:8px 2px;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer}
.tour__back:hover{color:var(--ink)}
.tour__back[hidden]{display:block;visibility:hidden}
.tour__next{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border:0;border-radius:999px;background:var(--ink);
  color:var(--paper);font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,transform .2s var(--e-out)}
.tour__next:hover{background:rgba(10,10,10,.86)}
.tour__next:active{transform:scale(.97)}
.tour__next svg{width:15px;height:15px}

@media (max-width:980px){
  .lv{grid-template-columns:1fr;gap:28px}
  .lv__side{position:static;max-height:none;overflow:visible;order:2;padding-right:0}
  .lv__mobilenav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;font-size:13px;color:var(--ink-2)}
  .lv__mobilenav a{display:inline-flex;align-items:center;gap:6px}
  .lv__mobilenav svg{width:14px;height:14px}
}
@media (max-width:620px){
  .lh__goal{grid-template-columns:1fr}
  .lvid{border-radius:14px;margin-inline:calc(var(--pad) * -1);border-radius:0}
  .lvid__play{width:62px;height:62px}
  .lvid__cap{left:16px;right:16px;bottom:14px}
  .lvid__cap b{font-size:13.5px}
  .lvid__tag{left:16px;top:14px}
  .lt > p{font-size:16.5px}
  .task{padding:18px 16px 16px;border-radius:16px;margin-inline:-4px}
  .task__head{grid-template-columns:auto minmax(0,1fr)}
  .task__flag{grid-column:2;justify-self:start}
  .tp__row{grid-template-columns:1fr;justify-items:center;text-align:center}
  .tp__pad{width:100%;height:120px}
  .kt{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dk-tempo{flex-basis:100%;max-width:none}
  .lt__fig{padding:14px 12px 12px;margin-inline:-4px}
  .dg{min-width:calc(64px + var(--cols) * 20px)}
  .dg__row{grid-template-columns:64px repeat(var(--cols),minmax(16px,1fr));column-gap:2px}
  .dg__name{font-size:11px;padding-right:4px;white-space:normal;line-height:1.15}
  .dg__cell{height:28px}
  .pr__item{grid-template-columns:minmax(0,1fr) auto auto;padding-left:14px}
  .pr__time{display:none}
  .sg{flex-wrap:wrap}
  .sg__sec{flex-basis:calc(33% - 4px)}
  .lend__nav{width:100%;margin-left:0}
  .lend__nav .btn{flex:1}
  .tour__card{width:auto;left:12px !important;right:12px;top:auto !important;bottom:12px;padding:20px 18px 16px}
}

/* ============================================================
   the coach — the questions, the plan, today's training
   ink on paper, nothing coloured
   ============================================================ */
.ask{min-height:calc(100svh - var(--chrome-h));display:flex;flex-direction:column;padding:28px var(--pad) 56px}
.ask__top{display:flex;align-items:center;gap:18px;max-width:720px;width:100%;margin:0 auto}
.ask__step{font-size:11px;font-weight:500;letter-spacing:.2em;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.ask__bar{flex:1}
.ask__x{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--ink-2)}
.ask__x:hover{background:var(--mist);color:var(--ink)}
.ask__x svg{width:16px;height:16px}
.ask__body{max-width:720px;width:100%;margin:auto;padding-top:48px}
.ask__body > .meta{display:block;margin-bottom:12px}
.ask__q{font-size:clamp(30px,4.2vw,48px);font-weight:600;letter-spacing:-.045em;line-height:1.05;margin:0}
.ask__sub{margin:16px 0 0;max-width:560px;font-size:16px;line-height:1.55;color:var(--ink-2)}
.ask__opts{display:grid;gap:10px;margin-top:34px}
.ask__opts.is-many{grid-template-columns:repeat(2,minmax(0,1fr))}
.ask__opt{display:flex;align-items:center;gap:16px;width:100%;padding:17px 18px;border:1px solid var(--line);border-radius:14px;
  background:var(--paper);font:inherit;font-size:16px;font-weight:500;color:var(--ink);text-align:left;cursor:pointer;
  transition:border-color .2s,background .2s,transform .25s var(--e-out)}
.ask__opt:hover{border-color:rgba(10,10,10,.28)}
.ask__opt:active{transform:scale(.99)}
.ask__opt i{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);
  font-style:normal;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;transition:all .2s}
.ask__opt span{flex:1}
.ask__opt svg{flex:none;width:18px;height:18px;opacity:0;transform:scale(.6);transition:all .25s var(--spring)}
.ask__opt.is-on{border-color:var(--ink);background:var(--mist)}
.ask__opt.is-on i{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ask__opt.is-on svg{opacity:1;transform:none}
.ask__nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:34px}
.ask__back{display:inline-flex;align-items:center;gap:8px;padding:10px 4px;border:0;background:none;font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer}
.ask__back:hover{color:var(--ink)}
.ask__back svg{width:15px;height:15px}

/* the plan: what comes first, and what a day looks like */
.plan{list-style:none;margin:30px 0 0;padding:0;border-top:1px solid var(--line-2)}
.plan li{display:flex;align-items:baseline;gap:18px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.plan li > i{font-style:normal;font-size:11px;letter-spacing:.12em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.plan li b{display:block;font-size:16px;font-weight:600;letter-spacing:-.015em}
.plan li span{font-size:13px;color:var(--ink-2)}
.day{margin-top:30px}
.day ul{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.day li{padding:16px;border:1px solid var(--line);border-radius:14px}
.day li b{display:block;font-size:22px;font-weight:600;letter-spacing:-.03em}
.day li span{display:block;margin-top:4px;font-size:13px;line-height:1.45;color:var(--ink-2)}

/* the plan above the courses */
.myplan{margin-bottom:56px}
.myplan__head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.myplan__head h2{font-size:22px;font-weight:600;letter-spacing:-.03em}
.myplan__edit{margin-left:auto;font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.plan--row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border:0;margin:18px 0 22px}
.plan--row li{display:block;padding:0;border:0}
.plan--row a{display:block;height:100%;padding:16px 16px 18px;border:1px solid var(--line);border-radius:14px;transition:border-color .2s,transform .3s var(--e-out)}
.plan--row a:hover{border-color:rgba(10,10,10,.3);transform:translateY(-2px)}
.plan--row li:first-child a{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.plan--row li:first-child span,.plan--row li:first-child i{color:rgba(255,255,255,.6)}
.plan--row a > i{display:block;margin-bottom:10px;font-style:normal;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.plan--row b{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.plan--row span{display:block;margin-top:6px;font-size:12.5px;color:var(--ink-2)}

/* the two cards on the scene: progress, and today */
.weg--scene .weg__cards{position:absolute;left:var(--pad);bottom:30px;z-index:2;display:flex;gap:12px;align-items:stretch;
  opacity:0;transition:opacity .9s var(--e-out) .6s}
.weg--scene .is-in .weg__cards{opacity:1}
.weg--scene .weg__cards .weg__sum{position:static;opacity:1}
.weg__cards{display:none}
.today{display:none}
.weg--scene .today{display:flex;flex-direction:column;gap:7px;width:min(270px,calc(100vw - 2 * var(--pad)));padding:16px 18px 15px;border-radius:16px;
  background:rgba(255,255,255,.74);-webkit-backdrop-filter:saturate(1.3) blur(16px);backdrop-filter:saturate(1.3) blur(16px);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 30px -12px rgba(30,34,50,.25)}
.today b{font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.25;color:#2a2a3c}
.today__line{font-size:12px;color:rgba(42,42,60,.62)}
.today__go{display:inline-flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px;font-size:13.5px;font-weight:600;color:#2a2a3c}
.today__go svg{width:15px;height:15px;transition:transform .3s var(--e-out)}
.today__go:hover svg{transform:translateX(3px)}

/* today's training */
.tr{max-width:860px;padding-top:44px;padding-bottom:96px}
.tr__head{margin-bottom:30px}
.tr__head .meta{display:block;margin-bottom:10px}
.tr__block{margin-top:16px;padding:22px 22px 24px;border:1px solid var(--line);border-radius:18px;transition:border-color .3s,background .3s}
.tr__block.is-done{background:var(--mist);border-color:var(--line-2)}
.tr__bh{display:flex;align-items:center;gap:14px}
.tr__bh > i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);font-style:normal;font-size:12px;font-weight:600}
.tr__bh h2{font-size:19px;font-weight:600;letter-spacing:-.025em}
.tr__clock{margin-left:auto;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tr__done{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);
  font:inherit;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:all .2s}
.tr__done svg{width:14px;height:14px}
.tr__done[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tr__text{margin:14px 0 0;color:var(--ink-2);line-height:1.55}
.tr__w{margin-top:16px}
.tr__lesson{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin-top:16px;padding:16px 18px;border-radius:14px;background:var(--ink);color:var(--paper)}
.tr__lesson b{font-size:17px;font-weight:600;letter-spacing:-.02em}
.tr__lesson span{flex:1;font-size:13px;color:rgba(255,255,255,.62)}
.tr__lesson svg{width:18px;height:18px}
.tr__end{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px}
.tr__end p{margin:0;color:var(--ink-2)}

@media (max-width:760px){
  .ask__opts.is-many{grid-template-columns:1fr}
  .day ul{grid-template-columns:1fr}
  .plan--row{grid-template-columns:1fr 1fr}
  .weg--scene .weg__cards{left:16px;right:16px;bottom:58px;flex-direction:column;gap:8px}
  .weg--scene .weg__cards .weg__sum,.weg--scene .today{width:auto;transform:none;left:auto;align-items:flex-start;text-align:left}
  .weg--scene .weg__cards .weg__sum .weg__pct{display:none}
}

/* play along: each note of the last run, hit, near or missed */
.pa__src{margin:12px 0 0;font-size:13px;line-height:1.5;color:var(--ink-2)}
.pa__src a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.dg__cell.is-hit i{background:var(--ink);box-shadow:0 0 0 3px rgba(10,10,10,.12)}
.dg__cell.is-near i{background:rgba(10,10,10,.42)}
.dg__cell.is-miss i{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(10,10,10,.35)}
.dg__cell.is-miss::after{content:"";position:absolute;width:14px;height:1.5px;background:rgba(10,10,10,.45);transform:rotate(-45deg)}
.pa__score{display:grid;grid-template-columns:auto 1fr;gap:14px 28px;align-items:center;margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:14px}
.pa__score[hidden]{display:none}
.pa__big b{display:block;font-size:34px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.pa__big span{display:block;margin-top:6px;font-size:12.5px;color:var(--ink-2);max-width:320px}
.pa__lean{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ink-3)}
.pa__scale{position:relative;flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--line-2),var(--line) 50%,var(--line-2))}
.pa__scale::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:rgba(10,10,10,.3)}
.pa__scale i{position:absolute;left:calc(var(--x,.5) * 100%);top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--ink);transition:left .6s var(--e-out)}
.pa__lanes{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.pa__lanes span{display:inline-flex;gap:8px;padding:6px 10px;border-radius:999px;background:var(--mist);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pa__lanes b{font-weight:600;color:var(--ink)}

/* the instrument page */
.ins{max-width:860px;padding-top:44px;padding-bottom:96px}
.ins header .meta{display:block;margin-bottom:10px}
.ins .page-sub{max-width:620px;line-height:1.55}
.ins__card{margin-top:18px;padding:22px;border:1px solid var(--line);border-radius:18px}
.ins__head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ins__head h2{font-size:19px;font-weight:600;letter-spacing:-.025em}
.ins__state{font-size:12.5px;color:var(--ink-3)}
.ins__state.is-on{color:var(--ink);font-weight:600}
.ins__state.is-on::before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--ink);vertical-align:1px}
.ins__head .btn{margin-left:auto}
.ins__note,.ins__hint{margin:12px 0 0;font-size:14px;line-height:1.55;color:var(--ink-2)}
.ins__pads{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:16px}
.ins__pad{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);
  font:inherit;text-align:left;cursor:pointer;transition:border-color .2s}
.ins__pad b{font-size:13.5px;font-weight:600}
.ins__pad span{min-height:16px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ins__pad.is-learn{border-color:var(--ink);border-style:dashed}
.ins__pad.is-hit{animation:padhit .5s var(--e-out)}
@keyframes padhit{0%{background:var(--ink);color:var(--paper)}100%{background:var(--paper)}}
.ins__meter{position:relative;height:10px;margin-top:16px;border-radius:5px;background:var(--line-2);overflow:hidden}
.ins__meter i{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(var(--v,0));background:var(--ink);transition:transform .06s linear}
.ins__meter.is-hit{animation:meterhit .35s var(--e-out)}
@keyframes meterhit{0%{box-shadow:0 0 0 3px rgba(10,10,10,.18)}100%{box-shadow:none}}
.ins__sens{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:13px;color:var(--ink-2)}
.ins__sens input{flex:1;accent-color:#0a0a0a}
.ins__cal{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.ins__out{margin:14px 0 0;min-height:22px;font-size:15px}
@media (max-width:760px){
  .ins__pads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pa__score{grid-template-columns:1fr}
}

   the phone — its own version: the mark and you at the top,
   the five places at the bottom under the thumb, and at the

  .weg--scene .is-in .ks{opacity:1;transform:none}
