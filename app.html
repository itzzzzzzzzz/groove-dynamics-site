<script>
/* The address shows the site and nothing more: the page asked for — after
   a #, or the one you were on before a reload — is handed to the router. */
(function () {
  window.GDAt = /^#\//.test(location.hash) ? location.hash : '';
  try {
    if (!window.GDAt && sessionStorage.getItem('gd.again')) window.GDAt = sessionStorage.getItem('gd.at') || '';
    sessionStorage.removeItem('gd.again');
  } catch (e) {}
  history.replaceState(null, '', location.pathname.replace(/[^/]*$/, '') + location.search);
})();
</script>

<script>
/* The page keeps to itself: no menu on the right button, nothing dragged
   off it, selected or copied out of it (what you type stays yours), and the
   console says one thing only — who made it. With ?debug in the address the
   console is left as it is, for finding faults. */
(function () {
  if (!/[?&]debug\b/.test(location.search)) {
    var c = window.console, quiet = function () {};
    try { c.log('%cGemacht von Georg', 'font:600 12px/1.8 "Inter Tight",system-ui,sans-serif;color:#0a0a0a'); } catch (e) {}
    ['log', 'info', 'warn', 'error', 'debug', 'trace', 'dir', 'dirxml', 'table', 'group', 'groupCollapsed', 'groupEnd',
     'time', 'timeEnd', 'timeLog', 'count', 'countReset', 'assert', 'clear', 'profile', 'profileEnd', 'timeStamp'].forEach(function (k) {
      try { c[k] = quiet; } catch (e) {}
    });
    /* an error nobody caught is handled here, so it is not written out either */
    addEventListener('error', function (e) { e.preventDefault(); }, true);
    addEventListener('unhandledrejection', function (e) { e.preventDefault(); });
  }
  function typing(t) { return !!(t && t.closest && t.closest('input,textarea,select,[contenteditable]:not([contenteditable="false"])')); }
  addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
  addEventListener('dragstart', function (e) { if (!typing(e.target)) e.preventDefault(); }, true);
  addEventListener('selectstart', function (e) { if (!typing(e.target)) e.preventDefault(); }, true);
  ['copy', 'cut'].forEach(function (type) {
    addEventListener(type, function (e) { if (!typing(e.target)) e.preventDefault(); }, true);
  });
})();
</script>
