<script>
/* the courses and every lesson in them */
/* ============================================================================
   THE CURRICULUM — six courses from the first stroke to a whole song. Every
   lesson: a video (still a placeholder until Aram films it), the lesson read,
   and exercises that are done in the browser — tapping along, building a beat,
   finding a count, a tempo ladder, a feel slider, a quiz, a practice plan.
   A lesson is done when all its exercises are; then the tree grows a leaf.
   ========================================================================== */
var GD = window.GD || {};

GD.COURSES = (function () {
  'use strict';
  function A(o, b) { for (var k in b) if (b.hasOwnProperty(k)) o[k] = b[k]; return o; }
  function P(steps, lanes, bpm) { return A({ steps: steps, bpm: bpm || 80 }, lanes); }
  function L(id, title, min, level, o) { o.id = id; o.title = title; o.dur = min + ' Min.'; o.level = level; return o; }
  function Q(q, a, ok, why) { return { q: q, a: a, ok: ok, why: why }; }
  function G(caption, pattern, o) { return { groove: A({ caption: caption, pattern: pattern }, o || {}) }; }
  function GV(caption, patterns, o) { return { groove: A({ caption: caption, patterns: patterns }, o || {}) }; }
  var T = {
    tap: function (title, text, pattern, target, o) { return A({ type: 'tap', title: title, text: text, pattern: pattern, target: target }, o || {}); },
    build: function (title, text, o) { return A({ type: 'build', title: title, text: text }, o); },
    place: function (title, text, steps, rounds, o) { return A({ type: 'place', title: title, text: text, steps: steps, rounds: rounds }, o || {}); },
    tempo: function (title, text, o) { return A({ type: 'tempo', title: title, text: text }, o); },
    taptempo: function (title, text, target, o) { return A({ type: 'taptempo', title: title, text: text, target: target }, o || {}); },
    feel: function (title, text, o) { return A({ type: 'feel', title: title, text: text }, o); },
    quiz: function (title, questions) { return { type: 'quiz', title: title, questions: questions }; },
    check: function (title, text, items, o) { return A({ type: 'check', title: title, text: text, items: items }, o || {}); },
    practice: function (title, text, items, o) { return A({ type: 'practice', title: title, text: text, items: items }, o || {}); },
    kit: function (title, text) { return { type: 'kit', title: title, text: text }; },
    song: function (title, text, o) { return A({ type: 'song', title: title, text: text }, o); }
  };

  /* ---- the grooves the lessons are made of ---------------------------------- */
  var CLICK4 = P(4, { sd: 'xxxx' }, 70);
  var EIGHTHS = P(8, { sd: 'xxxxxxxx' }, 70);
  var SIXTEENTHS = P(16, { sd: 'xxxxxxxxxxxxxxxx' }, 60);
  var TRIPLETS = P(12, { sd: 'xxxxxxxxxxxx' }, 60);
  var BEAT4 = P(4, { hh: 'xxxx', sd: '-x-x', bd: 'x-x-' }, 80);
  var ROCK = P(8, { hh: 'xxxxxxxx', sd: '--x---x-', bd: 'x---x---' }, 90);
  var ROCK16 = P(16, { hh: 'x-x-x-x-x-x-x-x-', sd: '----x-------x---', bd: 'x-------x-------' }, 90);
  var RIDE = P(8, { rd: 'xxxxxxxx', sd: '--x---x-', bd: 'x---x---', hf: '--x---x-' }, 92);
  var DISCO = P(8, { hh: 'xoxoxoxo', sd: '--x---x-', bd: 'x-x-x-x-' }, 112);
  var FUNK16 = P(16, { hh: 'xxxxxxxxxxxxxxxx', sd: '----x-------x---', bd: 'x-------x-x-----' }, 84);
  var GHOSTS = P(16, { hh: 'x-x-x-x-x-x-x-x-', sd: '--g-x--g-g--x-g-', bd: 'x-----x---x-----' }, 86);
  var LINEAR = P(16, { hh: '-xxx-x-xxx-x-xxx', sd: '----x-------x---', bd: 'x-----x---x-----' }, 88);
  var HALF = P(8, { hh: 'xxxxxxxx', sd: '----x---', bd: 'x--x----' }, 140);
  var DOUBLE = P(8, { hh: 'xxxxxxxx', sd: '-x-x-x-x', bd: 'x-x-x-x-' }, 160);
  var SHUFFLE = P(12, { hh: 'x-xx-xx-xx-x', sd: '---x-----x--', bd: 'x-----x-----' }, 96);
  var HALFSHUF = P(12, { hh: 'x-xx-xx-xx-x', sd: '-g--g-X---g-', bd: 'x-------x---' }, 80);
  var ONEDROP = A(P(8, { hh: 'xxxxxxxx', sd: '----c---', bd: '----x---' }, 76), { swing: 0.66 });
  var BOSSA = P(16, { rd: 'x-x-x-x-x-x-x-x-', sd: 'c--c--c---c--c--', bd: 'x--xx--xx--xx--x', hf: '----x-------x---' }, 120);
  var JAZZ = P(12, { rd: 'x--x-xx--x-x', hf: '---x-----x--', bd: 'g--g--g--g--' }, 120);
  /* two bars: the groove, then the groove with a fill on its last beat */
  var FILL1 = P(8, { cr: 'x------- --------', hh: '-xxxxxxx xxxxxx--', sd: '--x---x- --x---xx', bd: 'x---x--- x---x---' }, 90);
  var FILL16 = P(16, { cr: 'x--------------- ----------------', hh: '--x-x-x-x-x-x-x- x-x-x-x-x-x-----', sd: '----x-------x--- ----x-------xxxx', bd: 'x-------x------- x-------x-------' }, 88);
  var TOMS = P(16, { cr: 'x--------------- ----------------', hh: '--x-x-x-x-x-x-x- ----------------', sd: '----x-------x--- xxxx------------', t1: '---------------- ----xxxx--------', t2: '---------------- --------xxxx----', ft: '---------------- ------------xxxx', bd: 'x-------x------- ----------------' }, 84);

  return [
  /* ======================================================================== */
  { id: 'fundament', n: '01', title: 'Fundament', motif: 'head', theme: 'ink',
    desc: 'Das Set, die Haltung, der Griff, die ersten Rudiments und Noten. Darauf steht alles.',
    modules: [
    { title: 'Am Set', lessons: [
      L('kennenlernen', 'Das Schlagzeug kennenlernen', 8, 1, {
        goal: 'Du kennst jedes Instrument am Set beim Namen und am Klang.',
        video: 'Ein Rundgang um das Set: was wo steht und wie es klingt',
        body: [
          'Ein Schlagzeug ist kein einzelnes Instrument, sondern eine kleine Band aus Trommeln und Becken. Jedes Teil hat seine Aufgabe, und fast jeder Groove, den du jemals spielst, verteilt sich auf dieselben drei: Bass Drum, Snare und Hi-Hat.',
          { h: 'Die drei, um die sich alles dreht' },
          { list: ['<b>Bass Drum</b> – die tiefe Trommel am Boden, gespielt mit dem rechten Fuß. Sie gibt den Puls.', '<b>Snare</b> – die Trommel zwischen deinen Knien. Sie markiert den Backbeat, meist auf 2 und 4.', '<b>Hi-Hat</b> – zwei Becken auf einem Ständer. Sie zählt die Zeit durch, meist in Achteln.'] },
          { h: 'Der Rest' },
          'Toms färben Fills, das Ride-Becken ersetzt die Hi-Hat, wenn ein Song aufgehen soll, und das Crash setzt Akzente. Die Namen brauchst du ab jetzt in jeder Lektion.',
          { tip: 'Klick dich in der Klang-Tour durch jedes Instrument. Achte darauf, wie lang jeder Klang ist: die Hi-Hat ist kurz, das Crash klingt lange nach.' }
        ],
        tasks: [
          T.kit('Klang-Tour', 'Tippe jedes Instrument einmal an und hör genau hin.'),
          T.quiz('Wer macht was?', [
            Q('Welches Instrument spielst du mit dem rechten Fuß?', ['Snare', 'Bass Drum', 'Hi-Hat'], 1, 'Die Bass Drum liegt unter deinem rechten Fuß.'),
            Q('Welches Instrument hörst du hier?', ['Snare', 'Crash', 'Stand-Tom'], 0, 'Der kurze, schnarrende Klang ist die Snare.'),
            Q('Wofür nimmst du das Crash am häufigsten?', ['Um die Zeit durchzuzählen', 'Für einen Akzent, meist auf der Eins nach einem Fill', 'Für leise Strophen'], 1, 'Das Crash setzt Akzente. Für das Durchzählen sind Hi-Hat und Ride da.')
          ].map(function (q, i) { if (i === 1) q.sound = 'sd'; return q; }))
        ] }),
      L('sitzen', 'Sitzposition und Höhe', 7, 1, {
        goal: 'Du sitzt so, dass beide Füße frei arbeiten und dein Rücken entspannt bleibt.',
        video: 'Hocker einstellen: Höhe, Abstand, Balance',
        body: [

  /* ======================================================================
     GROOVES — every style a band will ask you for
     ====================================================================== */
  /* {id, t: title, p: pattern, bpm, lv, text, keys: [what matters], tip, songs} */
  function groove(g) {
    var slow = Math.max(50, Math.round(g.bpm * 0.8 / 5) * 5);
    var body = [g.text, G(g.t, g.p, { click: true }), { h: 'Worauf es ankommt' }, { list: g.keys }];
    if (g.tip) body.push({ tip: g.tip });
    if (g.no) body.push({ mistake: g.no });
    if (g.songs) { body.push({ h: 'Wo du ihn hörst' }); body.push(g.songs); }
    return L(g.id, g.t, g.min || 10, g.lv, {
      goal: 'Du spielst den Groove vier Takte am Stück bei ' + g.bpm + ' BPM, sauber und entspannt.',
      video: g.t + ': erst langsam, dann im Originaltempo',

<script>
/* ============================================================================
   THE TREE — grown by xubohuah's "Simple Growth Tree" (21st.dev): every branch
   walks upward with a little drift, dies after its life and splits into two to
   four thinner ones. The walk runs once, seeded, and is painted as watercolour.

   It starts bare. Every lesson owns one leaf — a wash in its course's part of
   the crown — and the leaf only comes out once the lesson is done. The crown
   is cut into six slices, one per course, going round from the bottom left:
   up the left side, over the top, down the right.

      var hh = new Array(steps + 1).join('-').split(''); for (var i = 0; i < steps; i += spb) hh[i] = 'x';
      if (pl) pl.stop();
      pl = Player({ pattern: norm({ steps: steps, hh: hh.join(''), sd: lane.join('') }), bpm: spec.bpm || 72, loop: false, repeat: 2,
        onStep: function (i) { marker.classList.toggle('is-hit', i === val); } });
      pl.start();
    });
    $('[data-check]', el).addEventListener('click', function () {
      if (val === rounds[at].at) {
        if (at < rounds.length - 1) { status(el, icon('check') + 'Stimmt.', true); at++; setTimeout(function () { status(el, ''); show(); }, 700); }
        else { status(el, icon('check') + 'Alle gefunden. Du weißt, wo jede Zählzeit liegt.', true); el.classList.add('is-solved'); if (done) done(); }
      } else {
        var c = val % spb === 0 ? 'die ' + (val / spb + 1) : 'die „' + COUNTS[spb][val % spb] + '“ von ' + (Math.floor(val / spb) + 1);
        status(el, 'Da liegt ' + c + '. Zähl laut mit und hör es dir an.');
      }
    });
    show();
    return { destroy: function () { if (pl) pl.stop(); } };
  }

  /* ---- 5. the tempo ladder ------------------------------------------------ */
  function tempo(el, spec, done) {
    var from = spec.from || 60, to = spec.to || 100, by = spec.by || 10, ladder = [];
    for (var b = from; b <= to; b += by) ladder.push(b);
    var p = norm(spec.pattern || { steps: 4, hh: 'xxxx' }), bpm = from, okd = {};
    el.innerHTML =
      (spec.sticking ? '<div class="st" data-st>' + stickHtml(spec.sticking) + '</div>' : '<div class="dk-scroll" data-grid>' + gridHtml(p) + '</div>') +
      '<div class="dk-bar">' + playBtn() + tempoHtml(bpm, Math.max(30, from - 20), to + 20) + '</div>' +
      '<div class="tl"><span class="tl__label">Sauber gespielt bei</span>' + ladder.map(function (b) {
        return '<button class="tl__step" type="button" data-step="' + b + '"><span>' + b + '</span>' + icon('check') + '</button>';
      }).join('') + '</div>' +
      '<p class="dk-status" data-status></p>';
    var sticks = $$('.st__n', el);
    var pl = Player({ pattern: p, bpm: bpm, loop: true, click: true,
      onStep: function (i) {
        if (sticks.length) { sticks.forEach(function (s) { s.classList.remove('is-now'); }); if (i >= 0 && sticks[i % sticks.length]) sticks[i % sticks.length].classList.add('is-now'); }
        else lightCol(el, i);
      },
      onStop: function () { el.classList.remove('is-playing'); } });
    $('[data-play]', el).addEventListener('click', function () {
      if (pl.playing()) { pl.stop(); return; }
      if (pl.start()) el.classList.add('is-playing');
    });
    wireTempo(el, pl, function (v) { bpm = v; });
    $$('[data-step]', el).forEach(function (s) {
      s.addEventListener('click', function () {
        var b = +s.getAttribute('data-step');
        if (Math.abs(bpm - b) > 2 && !okd[b]) { status(el, 'Stell erst ' + b + ' BPM ein und spiel ein paar Takte mit. Dann hak es ab.'); return; }
        okd[b] = !okd[b]; s.classList.toggle('is-on', okd[b]);
        var all = ladder.every(function (x) { return okd[x]; });
        status(el, all ? icon('check') + 'Ganze Leiter geschafft. Morgen fängst du eine Stufe höher an.' : '', all);
        if (all && done) done();
      });
    });
    return { destroy: pl.stop };
  }
  function stickHtml(s) {
    /* R L as written; >R an accent, (R) a ghost, lR a flam (the grace note small) */
    return s.split(/\s+/).filter(Boolean).map(function (t) {
      var cls = '';
      if (t[0] === '>') { cls = ' is-acc'; t = t.slice(1); }
      if (t[0] === '(') { cls = ' is-ghost'; t = t.replace(/[()]/g, ''); }
      if (/^[rl][RL]$/.test(t)) return '<span class="st__n is-flam' + cls + '"><small>' + t[0] + '</small>' + t[1] + '</span>';
      return '<span class="st__n' + cls + '">' + esc(t) + '</span>';
    }).join('');
  }

  /* ---- 6. feel the tempo: tap it ------------------------------------------ */
  function taptempo(el, spec, done) {
    var target = spec.target || 80, tol = spec.tol || 4, times = [];
    el.innerHTML =
      '<div class="tp__row"><button class="tp__pad" type="button" data-pad aria-label="Tippen"><span>Tippen</span><small>oder Leertaste</small></button>' +
      '<div class="tp__info"><div class="tt__bpm"><b data-bpm>–</b><span>BPM</span></div><p data-info>Tipp gleichmäßig ' + target + ' Schläge pro Minute. Acht Schläge in Folge zählen.</p></div></div>' +
      '<div class="dk-bar"><button class="dk-btn dk-btn--ghost" type="button" data-hear>' + icon('ear') + target + ' BPM anhören</button></div>' +
      '<p class="dk-status" data-status></p>';
    var solved = false, pl = null;
    function tapNow(e) {
      var now = (e && e.timeStamp) || performance.now();
      if (times.length && now - times[times.length - 1] > 2000) times = [];
      times.push(now); if (times.length > 9) times.shift();
      if (times.length < 3) { $('[data-bpm]', el).textContent = '…'; return; }
      var iv = []; for (var i = 1; i < times.length; i++) iv.push(times[i] - times[i - 1]);
      var mean = iv.reduce(function (s, x) { return s + x; }, 0) / iv.length, bpm = 60000 / mean;
      var sd = Math.sqrt(iv.reduce(function (s, x) { return s + (x - mean) * (x - mean); }, 0) / iv.length) / mean;
      $('[data-bpm]', el).textContent = Math.round(bpm);
      if (!solved && times.length >= 9 && Math.abs(bpm - target) <= tol && sd < 0.08) {
        solved = true; el.classList.add('is-solved');
        status(el, icon('check') + 'Genau. Dein ' + target + ' sitzt.', true); if (done) done();
      } else if (!solved && times.length >= 9) {
        status(el, Math.abs(bpm - target) > tol ? (bpm > target ? 'Etwas zu schnell.' : 'Etwas zu langsam.') : 'Das Tempo stimmt, aber es schwankt noch.');
      }
    }
    $('[data-pad]', el).addEventListener('pointerdown', function (e) { e.preventDefault(); tapNow(e); });
    function onKey(e) { if (e.key === ' ' && document.activeElement === $('[data-pad]', el)) { e.preventDefault(); if (!e.repeat) tapNow(e); } }
    addEventListener('keydown', onKey);
    $('[data-hear]', el).addEventListener('click', function () {
      if (pl) pl.stop();
      pl = Player({ pattern: norm({ steps: 4, hh: 'xxxx' }), bpm: target, loop: false, repeat: 2, click: true, mute: { hh: true } }); pl.start();
    });
    return { destroy: function () { if (pl) pl.stop(); removeEventListener('keydown', onKey); } };
  }

  /* ---- 7. the feel slider: swing, or where the backbeat sits ---------------- */
  function feel(el, spec, done) {
    var p = norm(spec.pattern), pocket = spec.mode === 'pocket', v = pocket ? 0 : 0.5;
    var lo = pocket ? -40 : 0.5, hi = pocket ? 40 : 0.75, stepv = pocket ? 1 : 0.005;
    el.innerHTML =
      '<div class="dk-scroll" data-grid>' + gridHtml(p) + '</div>' +
      '<div class="fl"><div class="fl__scale">' + (pocket ? '<span>vorne drauf</span><span>mittig</span><span>laid back</span>' : '<span>gerade</span><span>triolisch</span><span>hart</span>') + '</div>' +
      '<input class="fl__range" type="range" min="' + lo + '" max="' + hi + '" step="' + stepv + '" value="' + v + '" data-feel aria-label="' + (pocket ? 'Lage der Snare' : 'Swing') + '">' +
      '<output class="fl__val" data-val></output></div>' +
      '<div class="dk-bar">' + playBtn() + tempoHtml(spec.bpm || p.bpm, 50, 160) + '<span class="dk-gap"></span>' +
      '<button class="dk-btn" type="button" data-check>' + icon('check') + 'Prüfen</button></div>' +
      '<p class="dk-status" data-status></p>';
    function label() {
      var a = Math.round(v * 100);
      $('[data-val]', el).textContent = pocket ? (v > 0 ? '+' : '') + v + ' ms' : a + ' : ' + (100 - a);
    }
    var pl = Player({ pattern: p, bpm: spec.bpm || p.bpm, loop: true,
      offset: pocket ? function (i, pp) { return pp.lanes.sd && pp.lanes.sd[i] !== '-' ? v / 1000 : 0; } : null,
      onStep: function (i) { lightCol(el, i); }, onStop: function () { el.classList.remove('is-playing'); } });
    var r = $('[data-feel]', el);
    r.addEventListener('input', function () { v = +r.value; if (!pocket) { p.swing = v; } label(); });
    label();
    $('[data-play]', el).addEventListener('click', function () {
      if (pl.playing()) { pl.stop(); return; }
      if (pl.start()) el.classList.add('is-playing');
    });
    wireTempo(el, pl);
    $('[data-check]', el).addEventListener('click', function () {
      var t = spec.target;
      if (v >= t[0] && v <= t[1]) { status(el, icon('check') + (spec.ok || 'Genau da.'), true); el.classList.add('is-solved'); if (done) done(); }
      else status(el, v < t[0] ? (spec.low || 'Noch zu wenig.') : (spec.high || 'Zu weit.'));
    });
    return { destroy: pl.stop };
  }

  /* ---- 8. quiz ------------------------------------------------------------ */
  function quiz(el, spec, done) {
    var qs = spec.questions, at = 0, pl = null;
    function show() {
      var q = qs[at];
      el.innerHTML =
        '<div class="qz"><div class="qz__top"><span class="qz__n">Frage ' + (at + 1) + ' von ' + qs.length + '</span>' +
        (q.play || q.sound ? '<button class="dk-btn dk-btn--ghost" type="button" data-hear>' + icon('ear') + 'Anhören</button>' : '') + '</div>' +
        '<p class="qz__q">' + q.q + '</p><div class="qz__a">' + q.a.map(function (a, i) {
          return '<button class="qz__opt" type="button" data-a="' + i + '"><span>' + String.fromCharCode(65 + i) + '</span>' + a + '</button>';
        }).join('') + '</div><p class="dk-status" data-status></p></div>';
      var hear = $('[data-hear]', el);
      if (hear) hear.addEventListener('click', function () {
        if (q.sound) { var a = ctx(); if (a) strike(q.sound, 'x', a.currentTime + 0.02); return; }
        if (pl) pl.stop();
        pl = Player({ pattern: norm(q.play), bpm: q.play.bpm || 90, loop: false, repeat: q.play.repeat || 2 }); pl.start();
      });
      $$('[data-a]', el).forEach(function (b) {
        b.addEventListener('click', function () {
          var i = +b.getAttribute('data-a');
          if (el.querySelector('.qz__opt.is-right')) return;
          if (i === q.ok) {
            b.classList.add('is-right');
            status(el, icon('check') + (q.why || 'Richtig.') + (at < qs.length - 1 ? ' <button class="dk-link" type="button" data-next>Nächste Frage</button>' : ''), true);
            var nx = $('[data-next]', el);
            if (nx) nx.addEventListener('click', function () { if (pl) pl.stop(); at++; show(); });
            else { el.classList.add('is-solved'); if (done) done(); }
          } else {
            b.classList.add('is-wrong'); b.disabled = true;
            status(el, q.no || 'Nicht ganz. Versuch es noch einmal.');
          }
        });
      });
    }
    show();
    return { destroy: function () { if (pl) pl.stop(); } };
  }

  /* ---- 9. the kit, to listen to ------------------------------------------- */
  var KIT = [
    { id: 'bd', name: 'Bass Drum', text: 'Die große Trommel am Boden, mit dem rechten Fuß gespielt. Das Fundament.' },
    { id: 'sd', name: 'Snare', text: 'Zwischen deinen Knien. Unten liegt ein Teppich aus Drahtspiralen, daher der Schnarr-Klang.' },
    { id: 'hh', name: 'Hi-Hat', text: 'Zwei Becken auf einem Ständer, mit dem linken Fuß geöffnet und geschlossen.' },
    { id: 'hho', name: 'Hi-Hat offen', text: 'Fuß locker, die Becken schwingen gegeneinander. Zischt.' },
    { id: 'rd', name: 'Ride', text: 'Das große Becken rechts. Für gleichmäßige Muster, wie die Hi-Hat, nur offener.' },
    { id: 'cr', name: 'Crash', text: 'Für Akzente, meist auf der Eins nach einem Fill.' },
    { id: 't1', name: 'Tom 1', text: 'Hängt über der Bass Drum. Hoch gestimmt.' },
    { id: 't2', name: 'Tom 2', text: 'Neben Tom 1, etwas tiefer.' },
    { id: 'ft', name: 'Stand-Tom', text: 'Steht rechts auf drei Beinen. Der tiefste Ton.' }
  ];
  function kit(el, spec, done) {
    var heard = {};
    el.innerHTML = '<div class="kt">' + KIT.map(function (k) {
      return '<button class="kt__pad" type="button" data-k="' + k.id + '"><b>' + k.name + '</b><span>' + k.text + '</span><i>' + icon('check') + '</i></button>';
    }).join('') + '</div><p class="dk-status" data-status></p>';
    $$('[data-k]', el).forEach(function (b) {
      b.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        var id = b.getAttribute('data-k'), a = ctx(); if (!a) return;
        if (id === 'hho') strike('hh', 'o', a.currentTime + 0.01); else strike(id, 'x', a.currentTime + 0.01);
        b.classList.remove('is-hit'); void b.offsetWidth; b.classList.add('is-hit', 'is-heard');
        heard[id] = true;
        var n = Object.keys(heard).length;
        if (n === KIT.length) { status(el, icon('check') + 'Du kennst jetzt jeden Klang am Set.', true); if (done) done(); }
        else status(el, n + ' von ' + KIT.length + ' angehört.');
      });
    });
    return { destroy: function () {} };
  }

  /* ---- 10. checklist ------------------------------------------------------ */
  function check(el, spec, done) {
    var on = {};
    el.innerHTML = '<ul class="ck">' + spec.items.map(function (t, i) {
      return '<li><button type="button" class="ck__item" data-i="' + i + '" aria-pressed="false"><i>' + icon('check') + '</i><span>' + t + '</span></button></li>';
    }).join('') + '</ul><p class="dk-status" data-status></p>';
    $$('[data-i]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        var i = b.getAttribute('data-i'); on[i] = !on[i];
        b.classList.toggle('is-on', on[i]); b.setAttribute('aria-pressed', String(on[i]));
        var all = spec.items.every(function (x, k) { return on[k]; });
        status(el, all ? icon('check') + (spec.ok || 'Alles abgehakt.') : '', all);
        if (all && done) done();
      });
    });
    return { destroy: function () {} };
  }

  /* ---- 11. the practice plan: a timer per item ------------------------------ */
  function practice(el, spec, done) {
    var on = {}, run = null, tick = 0, pl = null;
    el.innerHTML = '<ol class="pr">' + spec.items.map(function (it, i) {
      return '<li class="pr__item" data-i="' + i + '"><div class="pr__text"><b>' + it.text + '</b><span>' + it.min + ' Min.' + (it.bpm ? ' · ' + it.bpm + ' BPM' : '') + '</span></div>' +
        '<span class="pr__time" data-time>' + fmt(it.min * 60) + '</span>' +
        '<button class="dk-play dk-play--sm" type="button" data-run aria-label="Timer starten">' + icon('play') + icon('stop') + '</button>' +
        '<button class="pr__done" type="button" data-done aria-pressed="false" aria-label="Erledigt">' + icon('check') + '</button></li>';
    }).join('') + '</ol><p class="dk-status" data-status></p>';
    function fmt(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
    function mark(i, v) {
      on[i] = v;
      var li = $('[data-i="' + i + '"]', el); li.classList.toggle('is-on', v); $('[data-done]', li).setAttribute('aria-pressed', String(v));
      var all = spec.items.every(function (x, k) { return on[k]; });
      status(el, all ? icon('check') + (spec.ok || 'Übeplan für heute geschafft.') : '', all);
      if (all && done) done();
    }
    function stopRun() {
      if (!run) return;
      clearInterval(tick); if (pl) pl.stop(); pl = null;
      $('[data-i="' + run.i + '"]', el).classList.remove('is-running'); run = null;
    }
    $$('.pr__item', el).forEach(function (li) {
      var i = +li.getAttribute('data-i'), it = spec.items[i];
      $('[data-run]', li).addEventListener('click', function () {
        if (run && run.i === i) { stopRun(); return; }
        stopRun();
        var left = run && run.i === i ? run.left : it.min * 60, last = Date.now();
        run = { i: i, left: left }; li.classList.add('is-running');
        if (it.bpm) { pl = Player({ pattern: norm(it.pattern || { steps: 4, hh: 'xxxx' }), bpm: it.bpm, loop: true, click: true, mute: it.pattern ? {} : { hh: true } }); pl.start(); }
        tick = setInterval(function () {
          var now = Date.now(); run.left -= (now - last) / 1000; last = now;
          $('[data-time]', li).textContent = fmt(run.left);
          if (run.left <= 0) { stopRun(); $('[data-time]', li).textContent = fmt(0); mark(i, true); }
        }, 250);
      });
      $('[data-done]', li).addEventListener('click', function () { if (run && run.i === i) stopRun(); mark(i, !on[i]); });
    });
    return { destroy: stopRun };
  }

  /* ---- 12. the song: its form, played through ------------------------------ */
  function song(el, spec, done) {
    var secs = spec.sections, bpm = spec.bpm || 96, bars = 0, map = [];
    secs.forEach(function (s, si) { var pp = norm(s.pattern); for (var b = 0; b < s.bars; b++) map.push({ si: si, b: b, p: pp }); bars += s.bars; });
    var steps = norm(secs[0].pattern).steps;
    /* one long pattern, bar after bar */
    var whole = { steps: steps, bars: bars, bpm: bpm };
    LANES.forEach(function (l) {
      var s = '';
      map.forEach(function (m) { var lane = m.p.lanes[l.id]; var bb = m.b % m.p.bars; s += lane ? lane.slice(bb * m.p.steps, (bb + 1) * m.p.steps) : new Array(steps + 1).join('-'); });
      if (/[^-]/.test(s)) whole[l.id] = s;
    });
    var p = norm(whole);
    el.innerHTML =
      '<ol class="sg">' + secs.map(function (s, i) {
        return '<li class="sg__sec" data-s="' + i + '" style="--bars:' + s.bars + '"><b>' + esc(s.name) + '</b><span>' + s.bars + ' Takte</span><i class="sg__fill"></i></li>';
      }).join('') + '</ol>' +
      '<div class="dk-bar">' + playBtn() + tempoHtml(bpm, 60, 140) +
      '<button class="dk-toggle is-on" type="button" data-click aria-pressed="true">' + icon('click') + '<span>Klick</span></button>' +
      '<span class="dk-gap"></span><span class="sg__now" data-now></span></div>' +
      '<p class="dk-status" data-status></p>';
    var click = true;
    var pl = Player({ pattern: p, bpm: bpm, loop: false, countIn: 1, click: true,
      onCount: function (c) { $('[data-now]', el).textContent = 'Einzählen ' + (c + 1); },
      onStep: function (i, bar) {
        if (i < 0) return;
        var m = map[bar]; if (!m) return;
        $$('.sg__sec', el).forEach(function (s, k) { s.classList.toggle('is-on', k === m.si); s.classList.toggle('is-past', k < m.si); });
        var sec = $('[data-s="' + m.si + '"]', el);
        sec.style.setProperty('--p', ((m.b + (i % steps) / steps) / secs[m.si].bars).toFixed(3));
        $('[data-now]', el).textContent = secs[m.si].name + ' · Takt ' + (m.b + 1) + ' von ' + secs[m.si].bars;
      },
      onStop: function () { el.classList.remove('is-playing'); },
      onEnd: function () {
        el.classList.remove('is-playing'); $('[data-now]', el).textContent = 'Durchgespielt.';
        $$('.sg__sec', el).forEach(function (s) { s.classList.remove('is-on'); s.classList.add('is-past'); s.style.setProperty('--p', 1); });
        status(el, icon('check') + (spec.ok || 'Einmal ganz durch. So klingt der Song von vorn bis hinten.'), true);
        if (done) done();
      } });
    $('[data-play]', el).addEventListener('click', function () {
      if (pl.playing()) { pl.stop(); $$('.sg__sec', el).forEach(function (s) { s.classList.remove('is-on', 'is-past'); s.style.setProperty('--p', 0); }); $('[data-now]', el).textContent = ''; return; }
      if (pl.start()) el.classList.add('is-playing');
    });
    wireTempo(el, pl);
    $('[data-click]', el).addEventListener('click', function (e) {
      click = !click; pl.set('click', click);
      e.currentTarget.classList.toggle('is-on', click); e.currentTarget.setAttribute('aria-pressed', String(click));
    });
    return { destroy: pl.stop };
  }

  /* ---- a sticking line, played -------------------------------------------- */
  function sticking(el, spec) {
    var n = spec.text.split(/\s+/).filter(Boolean).length, steps = spec.steps || n;
    var p = norm({ steps: steps, hh: new Array(steps + 1).join('x') });
    el.innerHTML = '<div class="st" data-st>' + stickHtml(spec.text) + '</div>' +
      '<div class="dk-bar">' + playBtn() + tempoHtml(spec.bpm || 70, 40, 160) + '</div>';
    var sticks = $$('.st__n', el);
    var pl = Player({ pattern: p, bpm: spec.bpm || 70, loop: true, click: true, mute: { hh: true },
      onStep: function (i) { sticks.forEach(function (s) { s.classList.remove('is-now'); }); if (i >= 0 && sticks[i % sticks.length]) sticks[i % sticks.length].classList.add('is-now'); },
      onStop: function () { el.classList.remove('is-playing'); } });
    $('[data-play]', el).addEventListener('click', function () {
      if (pl.playing()) { pl.stop(); return; }
      if (pl.start()) el.classList.add('is-playing');
    });
    wireTempo(el, pl);
    return { destroy: pl.stop };
  }

  /* ---- 13. play along: the whole groove, on your own kit -------------------- */
  /* Your kit is heard (src/app/input.js): e-drums by the pad you hit, an
     acoustic kit or a pad by the microphone. A bar is counted in, then the
     groove runs with the click for bars bars, the drums you play muted, and
     every note of it is matched with what you played: on time, near, or
     missed — on its own drum, if your kit says which. Without a kit
     connected, the keys stand in: F bass drum, J snare, K hi-hat, L ride. */
  var KEYS = { f: 'bd', j: 'sd', k: 'hh', l: 'rd', d: 'hf', ';': 'cr' };
  function playalong(el, spec, done) {
    var p = norm(spec.pattern), bars = spec.bars || 4, bpm = spec.bpm || p.bpm, pass = spec.pass || 0.8;
    var lanes = spec.lanes || used(p), byLane = true;
    el.innerHTML =
      '<div class="pa">' +
        '<div class="dk-scroll" data-grid>' + gridHtml(p) + '</div>' +
        '<p class="pa__src" data-src></p>' +
        '<div class="dk-bar">' + playBtn('Mitspielen') + tempoHtml(bpm, Math.max(40, bpm - 30), bpm + 40) +
          '<button class="dk-toggle is-on" type="button" data-hear aria-pressed="true"><span>Groove hören</span></button></div>' +
        '<div class="pa__score" data-score hidden>' +
          '<div class="pa__big"><b data-acc></b><span data-acc-sub></span></div>' +
          '<div class="pa__lean"><span>zu früh</span><div class="pa__scale"><i data-lean></i></div><span>zu spät</span></div>' +
          '<div class="pa__lanes" data-lanes></div>' +
        '</div>' +
        '<p class="dk-status" data-status></p>' +
      '</div>';
    var running = false, pl = null, notes = [], hits = [], hear = true;
    function source() {
      var s = window.GDInput ? GDInput.state() : {}, txt;
      byLane = s.midi === 'on' || s.mic !== 'on';
      if (s.midi === 'on') txt = 'Hört auf ' + esc(s.devices.join(', ')) + '. Spiel jede Trommel des Grooves.';
      else if (s.mic === 'on') txt = 'Hört über das Mikrofon mit. Es zählt, ob du im Timing bist; welche Trommel, hört es nicht.';
      else txt = 'Keine E-Drums, kein Mikrofon verbunden: Tasten F Bass Drum, J Snare, K Hi-Hat, L Ride. <a href="#/instrument">Instrument verbinden</a>';

    }

      $$('.dg__cell', el).forEach(function (c) { c.classList.remove('is-hit', 'is-near', 'is-miss'); });

        onTick: function (t, i, bar) {

      if (!byLane || !lane) notes.forEach(function (n) { if (n.got === null && Math.abs(n.t - best.t) < 0.012) n.got = best.got; });

    }

      running = false; el.classList.remove('is-running');
      if (window.GDInput) GDInput.listen(null);

      var score = notes.length ? Math.max(0, (got.length - extra * 0.25) / notes.length) : 0;
      var mean = got.length ? got.reduce(function (s, n) { return s + n.got; }, 0) / got.length : 0;
      var spread = got.length ? Math.sqrt(got.reduce(function (s, n) { return s + Math.pow(n.got - mean, 2); }, 0) / got.length) : 0;
      $('[data-score]', el).hidden = false;
      $('[data-acc]', el).textContent = Math.round(score * 100) + ' %';
      $('[data-acc-sub]', el).innerHTML = got.length + ' von ' + notes.length + ' Noten' + (extra ? ' · ' + extra + ' zu viel' : '') +
        ' · im Schnitt ' + Math.round(Math.abs(mean) * 1000) + ' ms ' + (Math.abs(mean) < 0.006 ? 'genau' : mean < 0 ? 'zu früh' : 'zu spät') +
        ' · Streuung ' + Math.round(spread * 1000) + ' ms';
      $('[data-lean]', el).style.setProperty('--x', clamp(0.5 + mean / 0.12, 0, 1));
      $('[data-lanes]', el).innerHTML = byLane ? lanes.map(function (l) {
        var mine = notes.filter(function (n) { return n.lane === l; }), ok = mine.filter(function (n) { return n.got !== null; }).length;
        return '<span><b>' + LANE[l].name + '</b>' + ok + ' / ' + mine.length + '</span>';
      }).join('') : '';
      var ok = score >= pass;
      status(el, ok ? icon('check') + (score > 0.95 ? 'Sauber. Nimm beim nächsten Mal ' + (bpm + 5) + ' BPM.' : 'Geschafft.')
                    : 'Noch nicht: ' + Math.round(pass * 100) + ' % brauchst du. Langsamer ist schneller: nimm ' + Math.max(40, bpm - 10) + ' BPM.', ok);
      $('[data-play]', el).classList.remove('is-on');
      if (ok && done) done({ bpm: bpm, score: score });
    }
    $('[data-play]', el).addEventListener('click', function () {
      if (running) { pl.stop(); running = false; el.classList.remove('is-running'); if (window.GDInput) GDInput.listen(null); return; }
      begin();
    });
    $('[data-hear]', el).addEventListener('click', function (e) {
      hear = !hear; e.currentTarget.classList.toggle('is-on', hear); e.currentTarget.setAttribute('aria-pressed', String(hear));
    });
    function onKey(e) {
      if (!running || e.repeat) return;
      var lane = KEYS[e.key.toLowerCase()];
      if (!lane) return;
      e.preventDefault();
      var a = ctx(), delay = Math.max(0, performance.now() - e.timeStamp) / 1000;
      hit(a.currentTime - delay - (a.outputLatency || a.baseLatency || 0), lane);
    }
    addEventListener('keydown', onKey);
    wireTempo(el, null, function (v) { bpm = v; });
    return { destroy: function () { if (pl) pl.stop(); removeEventListener('keydown', onKey); if (window.GDInput) GDInput.listen(null); if (unwatch) unwatch(); } };
  }

  var WIDGETS = { groove: groove, tap: tap, build: build, place: place, tempo: tempo, taptempo: taptempo,
    feel: feel, quiz: quiz, kit: kit, check: check, practice: practice, song: song, sticking: sticking, playalong: playalong };
  var NAMES = { tap: 'Mitspielen', build: 'Beat bauen', place: 'Zählzeit finden', tempo: 'Tempo-Leiter', taptempo: 'Tempo fühlen',
    feel: 'Feel einstellen', quiz: 'Quiz', kit: 'Klang-Tour', check: 'Checkliste', practice: 'Übeplan', song: 'Song spielen', playalong: 'Groove mitspielen' };

  /* mount one exercise or figure into el; done() once it is solved */
  function mount(el, spec, done) {
    var w = WIDGETS[spec.type];
    if (!w) { el.textContent = ''; return { destroy: function () {} }; }
    el.classList.add('dk', 'dk--' + spec.type);
    return w(el, spec, done) || { destroy: function () {} };
  }

  return { ctx: ctx, norm: norm, Player: Player, mount: mount, stopAll: stopAll, grid: gridHtml, names: NAMES, lanes: LANE };
})();

<script>
/* ============================================================================
   PLAYING FOR REAL — the app hears what you play. E-drums come in over MIDI
   (Chrome, Edge, Opera; the pad you hit tells which drum it was), an acoustic
   kit or a practice pad over the microphone (when, not which). Every hit is
   turned into the audio clock's time, the clock the exercises schedule their
   notes on, minus the delay your device adds — measured once by playing
   eight clicks along — so an exercise can say how early or late you were.
   ========================================================================== */
var GDInput = (function () {
  'use strict';

  /* General MIDI drum notes to the kit's lanes (src/app/drums.js) */
  var GM = {
    35: 'bd', 36: 'bd', 37: 'cs', 38: 'sd', 40: 'sd', 39: 'sd',
    42: 'hh', 44: 'hf', 46: 'hh', 22: 'hh', 26: 'hh',
    49: 'cr', 52: 'cr', 55: 'cr', 57: 'cr', 51: 'rd', 53: 'rd', 59: 'rd',
    48: 't1', 50: 't1', 45: 't2', 47: 't2', 41: 'ft', 43: 'ft', 58: 'ft'

  var listener = null, watchers = [], midi = null, mic = null, map = load('map', {});

  function out() { var a = ac(); return a ? (a.outputLatency || a.baseLatency || 0) : 0; }
  function tell() { watchers.forEach(function (fn) { try { fn(state); } catch (e) {} }); }

  /* one hit, wherever it came from */
  function emit(t, lane, vel, from, note) {
    var h = { t: t, lane: lane, vel: vel, from: from, note: note };
    watchers.forEach(function (fn) { try { fn(state, h); } catch (e) {} });
    if (listener) listener(t, lane, vel, from);

  /* ---- MIDI ---- */
  function connectMidi() {
    if (!navigator.requestMIDIAccess) return Promise.reject(new Error('Dein Browser kann kein MIDI. Nimm Chrome oder Edge.'));
    return navigator.requestMIDIAccess({ sysex: false }).then(function (access) {
      midi = access;
      function wire() {
        state.devices = [];
        midi.inputs.forEach(function (input) {
          state.devices.push(input.name || 'MIDI-Gerät');
          input.onmidimessage = onMidi;

  }

  var WORKLET = [
    'class Onsets extends AudioWorkletProcessor{',
    ' constructor(){super();this.prev=0;this.floor=0.002;this.hold=0;this.sens=1;this.n=0;this.peak=0;',
    '  this.port.onmessage=e=>{if(e.data.sens!=null)this.sens=e.data.sens;};}',
    ' process(inputs){',
    '  const ch=inputs[0]&&inputs[0][0];if(!ch)return true;',
    '  let e=0,last=this.prev;',
    '  for(let i=0;i<ch.length;i++){const d=ch[i]-last;last=ch[i];e+=d*d;}',   /* the energy of the change: a cheap high-pass, so the hum does not count */
    '  this.prev=last;e/=ch.length;',
    '  const at=currentTime;',
    '  if(this.hold>0)this.hold-=ch.length/sampleRate;',
    '  else if(e>this.floor*(6/this.sens)&&e>0.00004/this.sens){this.port.postMessage({t:at,level:Math.sqrt(e)});this.hold=0.055;}',
    '  this.floor=this.floor*0.995+e*0.005;',
    '  this.peak=Math.max(this.peak,Math.sqrt(e));if(++this.n%12===0){this.port.postMessage({meter:this.peak});this.peak=0;}',
    '  return true;}}',
    'registerProcessor("gd-onsets",Onsets);'

    var a = ac();

  function auto() {
    if (load('auto-midi', false) && state.midi === 'off') connectMidi().catch(function () {});

    }

  });

  function calibrate(from, onStep) {
    var a = ac();

      var beats = [], offs = [], keep = listener;

        if (best != null) { offs.push(t + lat[from] - best); if (onStep) onStep(offs.length); }
      };

    latency: function (from) { return Math.round((lat[from] || 0) * 1000); },
    sensitivity: function (v) { if (v == null) return load('sens', 1); save('sens', v); if (mic) mic.node.port.postMessage({ sens: v }); return v; },
    /* the one exercise that is listening right now: fn(t, lane, velocity, from) */
    listen: function (fn) { listener = fn || null; },
    /* anything that wants to see the state change, or every hit go by */
    watch: function (fn) { watchers.push(fn); return function () { watchers = watchers.filter(function (x) { return x !== fn; }); }; },
    active: function () { return state.midi === 'on' || state.mic === 'on'; },
    /* a pad that sends a note the map does not know is taught by hitting it when asked */
    learn: function (note, lane) { map[note] = lane; save('map', map); },
    lanes: GM
  };
})();

<script>
/* ============================================================================
   THE KURSE PAGE'S SCENE — igloo's first scene, the one igloo.inc opens with:
   the sky, the mountains, the snowfield and its patches, the smoke, the snow,
   the particles of the way in, the bloom, igloo's colour grade, the camera
   that leans after the pointer, the words it writes into the picture. All of
   it igloo's own code (assets/igloo/App3D-patched.js), set up through what
   that code exposes; nothing in it is changed.

   Only the igloo is not there. Where it stood a tree grows out of the snow:
   a trunk with its roots in the ground, limbs, branches, twigs and shoots,
   bark with its picture on it, leaves with theirs. At rest it is whole.
   It is broken all the same, the way the igloo is built of blocks — along
   wavy breaks that close without a trace — and igloo's code takes it for its
   igloo: where the pointer comes near, the pieces come apart, a thin branch
   with all its leaves as one, and their breaks glow blue; the blue line
   draws it on the way in, the plexus of numbers joins the pieces. Every
   lesson owns one twig at the edge of its course's part of the crown: its
   leaves are buds until the lesson is done, then they grow out.
   ========================================================================== */
var GDIgloo = (function () {
  'use strict';

     its roots go out */

  /* how wide the bark's picture is on the wood; a leaf, how long, how wide

  var BARKW = 0.5, LEAFLEN = 0.23, ASPECT = 0.58, NODE = 0.052;
  /* a branch thinner than this at its foot is one piece, with all that grows from it */
  var THIN = 0.032;
  /* where igloo's camera looks from, as the tree sees it: across the screen, and towards it */
  var ACROSS = [Math.SQRT1_2, 0, Math.SQRT1_2], TOWARDS = [-Math.SQRT1_2, 0, Math.SQRT1_2];

  var BUD = 0.1;
  /* how far behind igloo's cut the paper follows it down to the lessons */
  var LAG = 0.3;
  /* igloo's bloom over a white picture: enough to glow, not enough to blur */
  var BLOOM = 0.42;
  /* the glow igloo gives a block's faces and its cut sides, and how light a

  var box = null, scene = null, composer = null, plane = null, paper = null, cutter = null, sky = null;

  var tree = null, live = false, introDone = false, introRunning = false;

  function unit(v) { var l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }

    return { pieces: pieces, outline: outline, leaves: leaves, sectors: sectors, anchors: anchors, mid: mid,
      centroids: centroids, lo: lo, hi: hi };
  }

  /* ---- the pictures on the wood and on the leaves, painted once ---- */

  /* noise that repeats, so the bark's picture goes round a limb without a seam */
  function wrapNoise(seed) {
    function h(i, j) { var n = Math.sin(i * 127.1 + j * 311.7 + seed * 74.7) * 43758.5453; return n - Math.floor(n); }
    return function (x, y, px, py) {
      var i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
      var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
      function g(a, b) { return h(((a % px) + px) % px, ((b % py) + py) % py); }
      var a0 = g(i, j) + (g(i + 1, j) - g(i, j)) * ux, a1 = g(i, j + 1) + (g(i + 1, j + 1) - g(i, j + 1)) * ux;
      return a0 + (a1 - a0) * uy;
    };
  }
  /* Bark: plates, long and narrow as an old tree's are, parted by furrows
     that wander and join; fibres along each plate, its edges broken. The
     plates are cells round scattered points, measured taller than wide. */
  function barkPicture() {
    var N = 512, GX = 10, GY = 2, c = document.createElement('canvas');
    c.width = c.height = N;
    var x = c.getContext('2d'), img = x.createImageData(N, N), d = img.data;
    var roll = dice(7), pts = [];
    for (var gy = 0; gy < GY; gy++) for (var gx = 0; gx < GX; gx++) pts.push([(gx + 0.1 + roll() * 0.8) / GX, (gy + 0.1 + roll() * 0.8) / GY, roll()]);
    var n1 = wrapNoise(1), n2 = wrapNoise(2), n3 = wrapNoise(3), n4 = wrapNoise(4);
    function mod(a, m) { return ((a % m) + m) % m; }
    for (var j = 0; j < N; j++) for (var i = 0; i < N; i++) {
      var u = i / N, v = j / N;
      var wu = u + (n1(u * 4, v * 3, 4, 3) - 0.5) * 0.09 + (n3(u * 9, v * 7, 9, 7) - 0.5) * 0.02, wv = v + (n2(u * 4, v * 2, 4, 2) - 0.5) * 0.12;
      var cx = Math.floor(wu * GX), cy = Math.floor(wv * GY), f1 = 9, f2 = 9, own = 0;
      for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
        var ax = cx + dx, ay = cy + dy, q = pts[mod(ay, GY) * GX + mod(ax, GX)];
        var px = q[0] + (ax - mod(ax, GX)) / GX, py = q[1] + (ay - mod(ay, GY)) / GY;
        var ex = (wu - px) * GX, ey = (wv - py) * GY * 0.6, dist = Math.sqrt(ex * ex + ey * ey);
        if (dist < f1) { f2 = f1; f1 = dist; own = q[2]; } else if (dist < f2) f2 = dist;
      }
      var edge = f2 - f1;
      /* a plate rises from its furrow and is flat on top, lit a little more on one side */
      var plate = smooth(0.03, 0.22, edge), top = smooth(0.14, 0.7, edge);
      var fibre = n3(u * 110, v * 9, 110, 9) - 0.5, grain = n4(u * 56, v * 48, 56, 48) - 0.5;
      var broken = smooth(0.3, 0.04, edge) * (n2(u * 72, v * 30, 72, 30) - 0.5);
      var val = 0.08 + plate * (0.5 + 0.12 * own) + 0.14 * top + 0.16 * fibre * plate + 0.07 * grain + 0.2 * broken;
      val = clamp01(val);
      var o = (j * N + i) * 4;
      d[o] = d[o + 1] = d[o + 2] = Math.round(val * 255); d[o + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    return c;
  }
  /* a leaf: oval with a drawn-out tip and a toothed edge, the midrib and its veins lighter */
  function leafPicture() {
    var N = 256, c = document.createElement('canvas');
    c.width = c.height = N;
    var x = c.getContext('2d');
    function half(t) {
      /* narrow at the stalk, widest below the middle, drawn out to a point */
      var w = (t < 0.42 ? Math.pow(Math.sin(t / 0.42 * Math.PI / 2), 1.4) : Math.pow(Math.cos((t - 0.42) / 0.58 * Math.PI / 2), 0.85)) * (1 - 0.1 * t);
      if (t > 0.12 && t < 0.96) w *= 1 - 0.045 * ((t * 24) % 1);
      return w * (N / 2 - 3);
    }
    function y(t) { return N - 6 - t * (N - 12); }
    x.beginPath();
    for (var k = 0; k <= 120; k++) { var t = k / 120; x.lineTo(N / 2 - half(t), y(t)); }
    for (var k2 = 120; k2 >= 0; k2--) { var t2 = k2 / 120; x.lineTo(N / 2 + half(t2), y(t2)); }
    x.closePath();
    var g = x.createLinearGradient(0, 0, N, 0);
    g.addColorStop(0, '#9a9a9a'); g.addColorStop(0.5, '#808080'); g.addColorStop(1, '#a4a4a4');
    x.fillStyle = g;
    x.fill();
    x.save();
    x.clip();
    x.strokeStyle = 'rgba(220,220,220,.75)';
    x.lineCap = 'round';
    x.lineWidth = 3.2;
    x.beginPath(); x.moveTo(N / 2, y(0)); x.quadraticCurveTo(N / 2 + 2, y(0.5), N / 2, y(1)); x.stroke();
    x.lineWidth = 1.5;
    x.strokeStyle = 'rgba(210,210,210,.6)';
    for (var v = 0; v < 8; v++) {
      var t0 = 0.1 + v * 0.1, side = v % 2 ? 1 : -1;
      [-1, 1].forEach(function (s) {
        var t1 = Math.min(0.98, t0 + 0.16);
        x.beginPath(); x.moveTo(N / 2, y(t0));
        x.quadraticCurveTo(N / 2 + s * half(t0) * 0.55, y(t0 + 0.05), N / 2 + s * half(t1) * 0.92, y(t1));
        x.stroke();
      });
    }
    x.restore();
    return c;
  }
  function picture(canvas, repeat) {
    var t = new ig.Rt(canvas);
    if (repeat) t.wrapS = t.wrapT = 1000;
    t.anisotropy = 8;
    t.needsUpdate = true;
    return t;
  }

  /* igloo's own shader for its igloo, told about the bark and the leaves: a
     leaf's picture cuts out its shape, the bark's lies over the wood, thinning
     where snow lies on it. Everything else it does stays as it is. */
  function dress(material) {
    var vs = material.vertexShader, fs = material.fragmentShader;
    var vAt = 'attribute float emission;', vMain = 'vEmission = emission;';
    var fAt = 'uniform sampler2D tMap;', fMix = 'color = mix(color, exploded, textureMix);';
    if (vs.indexOf(vAt) < 0 || vs.indexOf(vMain) < 0 || fs.indexOf(fAt) < 0 || fs.indexOf(fMix) < 0) { note('the igloo shader is not as expected'); return; }
    material.vertexShader = vs.replace(vAt, vAt + '\nattribute vec3 tex;\nvarying vec3 vTex;').replace(vMain, vMain + '\n                    vTex = tex;');
    material.fragmentShader = fs.replace(fAt, fAt + '\nuniform sampler2D tBark;\nuniform sampler2D tLeaf;\nvarying vec3 vTex;').replace(fMix, fMix + [
      '',
      'if (vTex.z > 2.5) {',
      '  vec4 lf = texture2D(tLeaf, vTex.xy, -0.75);',
      '  if (lf.a < 0.42) discard;',
      '  color *= 0.48 + 0.95 * lf.r;',
      '} else if (vTex.z > 0.5) {',
      '  float snow = clamp((vTex.z - 1.0) / 0.9, 0.0, 1.0);',
      '  float bark = texture2D(tBark, vTex.xy).r;',
      '  color *= mix(0.6 + 0.78 * bark, 1.0, snow);',
      '}'
    ].join('\n'));
    material.uniforms.tBark = { value: picture(barkPicture(), true) };
    material.uniforms.tLeaf = { value: picture(leafPicture(), false) };
    material.needsUpdate = true;
  }

  /* igloo's lightmaps, made for a white tree: the shade across, from the cool
     grey of a face turned away to snow white; the exploded one brighter still */
  function lightmap(stops) {
    var c = document.createElement('canvas');
    c.width = 256; c.height = 4;
    var x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 256, 0);
    stops.forEach(function (s) { g.addColorStop(s[0], s[1]); });
    x.fillStyle = g; x.fillRect(0, 0, 256, 4);
    var t = new ig.Rt(c);
    t.colorSpace = 'srgb';
    t.needsUpdate = true;
    t._loaded = Promise.resolve(t);
    return t;
  }

  /* ---------------------------------------------------------------- the scene */

  function build(counts) {
    tree = grow(counts);
    note('tree grown: ' + tree.pieces.length + ' blocks');
    /* the tree is handed to igloo's scene in place of the igloo, its outline, its lightmaps */
    ig.zt._geometryCache.set('batched_<>_igloo.drc', Promise.resolve(tree.pieces));
    ig.zt._geometryCache.set('igloo/igloo_outline.drc_<>_default', Promise.resolve(tree.outline));
    ig.le._texturesCache.set('igloo/igloo_color.ktx2_<>_srgb',
      lightmap([[0, '#3f4653'], [0.35, '#6b7382'], [0.7, '#9da5b2'], [1, '#d4d9e0']]));
    /* a piece that has come away goes pale: the same shading, lighter */
    ig.le._texturesCache.set('igloo/igloo_exploded_color.ktx2_<>_srgb',
      lightmap([[0, '#757c88'], [0.35, '#a3a9b4'], [0.7, '#d3d7de'], [1, '#f6f7f9']]));

    /* igloo's words in the picture are ours (its typeface has no umlauts) */
    ig.Be.manifesto.title = '////// Dein Weg';
    ig.Be.manifesto.text = 'Sechs Kurse, ein Baum. Jede Lektion, die du schaffst, bringt ein Blatt zum Wachsen.';
    ig.Be.colorText = '#3c3c54';
    ig.Be.copyright = '// Inner Circle';
    ig.Be.rights = 'Groove Dynamics\nmit Aram Sepehri';

    var bridge = { scroll: { y: 0 }, centerScroll: function () {}, isDetailOpen: false };
    composer = new ig.tA({ scene: new ig.ty.igloo({ mainController: bridge }) });
    scene = composer.passes[0].scene;

    var board = ig.he.renderPass.scene;
    paper = whiten();
    cutter = cut();
    sky = skyOf();
    plane = new ig.Ce(ig.Si.triangle, cutter);
    plane.frustumCulled = false;
    board.add(plane);
    return Promise.all([scene.uploaded, board._upload()]).then(function () {
      /* the ground under the igloo is igloo's own picture of it without the igloo */
      scene.igloobase.mesh.material.uniforms.tMap.value = ig.le.load('igloo/ground_sansigloo_color.ktx2', 'srgb');
      /* the white is the last step of igloo's own chain for this scene */
      (scene.composer || composer).addPass(new ig.Eg(paper));
      /* igloo's words in the picture stay unwritten: the tree speaks for itself */
      if (scene.manifesto) ['title', 'text', 'copyright', 'rights'].forEach(function (k) { if (scene.manifesto[k]) scene.manifesto[k].visible = false; });
      /* leaves are seen from both sides; the wood and the leaves wear their pictures */
      scene.igloo.mesh.material.side = 2;
      dress(scene.igloo.mesh.material);
      prepare();
      setLeaves([]);
      blue();
      scene.isSceneVisible = true;
      board.beforeRenderCbs.push(draw);
      ig.Q.on('webgl_postrender', after);
      ig.Q.on('resize', frame);
      frame();
      note('scene built');
    });
  }

  /* The page is white, igloo's snowfield is grey. Its picture is drawn
     exactly as igloo draws it, and only then set into white: the lightest of
     it — the sky, the haze — becomes the paper, every darker tone keeps its
     distance from it, so each ridge and branch stays drawn. igloo's blue
     stays blue: whatever is strongly coloured — the shockwave over the snow,
     the lines, a break glowing — is kept as it is. The way in comes out of
     the white into igloo's own grey, plays there as igloo plays it, and
     turns white as it ends. */
  function whiten() {
    return new ig.fe({
      uniforms: { tDiffuse: { value: null }, uIntro: { value: 0 }, uWhite: { value: 0 }, uKeep: { value: 1 } },
      vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}',
      fragmentShader: [
        'uniform sampler2D tDiffuse;uniform float uIntro;uniform float uWhite;uniform float uKeep;varying vec2 vUv;',
        'vec3 toSrgb(vec3 c){return mix(pow(max(c,0.0),vec3(0.41666))*1.055-0.055,c*12.92,vec3(lessThanEqual(c,vec3(0.0031308))));}',
        'vec3 toLinear(vec3 c){return mix(pow((c+0.055)/1.055,vec3(2.4)),c/12.92,vec3(lessThanEqual(c,vec3(0.04045))));}',
        'void main(){',
        '  vec3 c=toSrgb(texture2D(tDiffuse,vUv).rgb);',
        '  float l=dot(c,vec3(0.2126,0.7152,0.0722));',
        '  float g=clamp((l-0.10)/(0.80-0.10),0.0,1.0);',
        '  g=1.0-pow(1.0-g,1.35);',
        '  float w=mix(0.22,1.0,g);',
        '  vec3 tint=c/max(l,0.001);',
        '  vec3 col=w*mix(vec3(1.0),tint,0.10);',
        '  float hi=max(c.r,max(c.g,c.b)),lo=min(c.r,min(c.g,c.b));',
        '  col=mix(col,c,smoothstep(0.24,0.5,(hi-lo)/max(hi,0.001))*uKeep);',
        '  col=mix(c,col,uWhite);',
        '  col=mix(vec3(1.0),col,uIntro);',
        '  gl_FragColor=vec4(toLinear(clamp(col,0.0,1.0)),1.0);',
        '}'
      ].join('\n'),
      depthTest: false,
      depthWrite: false
    });
  }

  /* Down from the tree to the lessons the page goes through igloo's cut, the
     same as between the scroll page's scenes: its icy edge climbs the screen
     and the tree slides away above it; below it comes igloo's grey sky, and
     a little way behind, the same cut once more, laying the paper the
     lessons are written on. igloo's own shader, told about the paper. */
  function cut() {
    var m = new ig.f3(), src = m.fragmentShader;
    var at = 'color = clamp(mix(scene1, scene2, cut), vec3(0.0), vec3(1.0));';
    var head = 'uniform float uProgressVel;';
    if (src.indexOf(at) < 0 || src.indexOf(head) < 0) return m;
    src = src.replace(head, head + '\nuniform float uPaper;');
    src = src.replace(at, at + [
      '',
      'float paperDiagonal = falloff(vUv.y + inclination * abs(slope), 0.0, 1.0, 0.2, fit(uPaper, 0.0, 1.0, 0.0, 1.0 + abs(slope)));',
      'color = mix(color, vec3(1.0), falloff(scrollTex.r, 0.0, 1.0, 2.0, paperDiagonal) * step(0.0001, uPaper));'
    ].join('\n'));
    m.fragmentShader = src;
    m.uniforms.uPaper = { value: 0 };
    return m;
  }
  /* igloo's sky, as its scenes have it before they turn to paper */
  function skyOf() {
    var c = document.createElement('canvas');
    c.width = 4; c.height = 256;
    var x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, '#d6dbe6'); g.addColorStop(0.55, '#c3c9d6'); g.addColorStop(1, '#adb4c5');
    x.fillStyle = g; x.fillRect(0, 0, 4, 256);
    var t = new ig.Rt(c);
    t.colorSpace = 'srgb';
    t.needsUpdate = true;
    return t;
  }

  /* igloo's bloom, once the way in has let it settle */
  function soften() {
    /* the way in was blue; once it is over, blue is white like everything else */
    ig.re.to(paper.uniforms.uKeep, { value: 0, duration: 2.5, ease: 'sine.inOut' });
    ig.he.composer.passes.forEach(function (pass) {
      ((pass._effectComposer || {}).passes || []).forEach(function (inner) {
        (inner.effects || []).forEach(function (effect) {
          if (effect.name === 'BloomEffect') ig.re.to(effect.uniforms.get('intensity'), { value: BLOOM, duration: 1.2, ease: 'sine.inOut' });
        });
      });
    });
  }

  /* What igloo draws in light over its grey would be lost on white. The
     cage and the outline of the way in are drawn in igloo's blue — the way
     in stays blue — and the plexus that joins the pieces later in ink;
     all of it laid on, not added. */
  function blue() {
    var p = scene.igloo.plexus;
    [scene.igloocage.mesh.material, scene.igloooutline.mesh.material].forEach(function (m) { m.color.set(BLUE); m.blending = 1; });
    p.lineMesh.material.color.set(INK);
    p.lineMesh.material.blending = 1;
    p.lineMesh.material.opacity = 0.45;
    p.points.mesh.material.uniforms.uColor.value.set(INK);
    p.points.mesh.material.blending = 1;
    p.numbers.mesh.material.uniforms.uColor.value.set(INK);
    p.numbers.mesh.material.blending = 1;
  }

  /* the chrome sits over the top of the picture: igloo's words move below it */
  var MARGINS = null;
  function frame() {
    if (!ig) return;
    if (!MARGINS) MARGINS = { topMargin: ig.Be.topMargin, topMarginLow: ig.Be.topMarginLow, topMarginMobile: ig.Be.topMarginMobile };
    var chrome = document.getElementById('chrome'), h = chrome ? chrome.offsetHeight : 0;
    Object.keys(MARGINS).forEach(function (k) { ig.Be[k] = MARGINS[k] + h; });
    /* A phone held upright sees the tree low, under a lot of sky, behind a
       card. The camera's window is lifted (and drawn in a touch — the crown
       already spans the width), so the tree stands between the mark and the card. */
    var cam = scene && scene.camera, W = innerWidth, H = innerHeight;
    if (!cam) return;
    if (W <= 760 && H > W) {
      var z = 1.04, w = W / z, hh = H / z;
      cam.setViewOffset(W, H, (W - w) / 2, (H - hh) / 2 + H * 0.1, w, hh);
    } else if (cam.view && cam.view.enabled) cam.clearViewOffset();
  }

  function draw() {
    if (!live) return;
    scene.progress = REST;
    step();
    composer.render();
    var u = cutter.uniforms;
    u.tScene1.value = composer.readBuffer.texture;
    u.tScene2.value = sky;
    u.uProgress.value = cutAt;
    u.uPaper.value = paperAt;
  }

  function after() {
    if (!live) return;
    if (resting && --resting === 0) { live = false; ig.Q.emit('webgl_render_active', false); return; }
    var look = view();
    listeners.forEach(function (fn) { try { fn(look); } catch (e) { console.error(e); } });
  }

  /* where the courses' anchors and the tree are on screen, in CSS pixels */
  var v3 = null;
  function view() {
    if (!v3) v3 = new ig.b();
    var cam = scene.camera, W = innerWidth, H = innerHeight;
    function px(p) {
      v3.set(p[0], p[1], p[2]).project(cam);
      return { x: (v3.x + 1) / 2 * W, y: (1 - v3.y) / 2 * H };
    }
    var anchors = tree.anchors.map(px);
    var rect = { left: 1e9, top: 1e9, right: -1e9, bottom: -1e9 };
    tree.leaves.forEach(function (l) {
      var p = px(l.c), d = Math.hypot(cam.position.x - l.c[0], cam.position.y - l.c[1], cam.position.z - l.c[2]);
      var r = l.r * H / 2 / Math.tan(cam.fov * Math.PI / 360) * (cam.zoom || 1) / d;
      rect.left = Math.min(rect.left, p.x - r); rect.right = Math.max(rect.right, p.x + r);
      rect.top = Math.min(rect.top, p.y - r); rect.bottom = Math.max(rect.bottom, p.y + r);
    });
    var base = px([0, GROUND, 0]);
    rect.bottom = Math.max(rect.bottom, base.y);
    return { anchors: anchors, centre: px(tree.mid), rect: rect, base: base, W: W, H: H };
  }

  /* ---------------------------------------------------------------- the leaves */

  /* A lesson's leaves are part of the piece of wood they hang from, so they
     fly with it. Each grows by its own corners: drawn in to where its stalk
     meets the twig it is a bud, let out it is the leaf. */
  var grown = [], moves = [];
  function prepare() {
    var mesh = scene.igloo.mesh, a = mesh.geometry.attributes.position.array, ranges = mesh._reservedRanges;
    tree.leaves.forEach(function (l) {
      var c = tree.centroids[l.piece];
      l.start = ranges[l.piece].vertexStart + l.from;
      l.base = a.slice(l.start * 3, (l.start + l.count) * 3);
      l.at = new Float32Array(l.anchor.length);
      for (var v = 0; v < l.anchor.length; v += 3) { l.at[v] = l.anchor[v] - c[0]; l.at[v + 1] = l.anchor[v + 1] - c[1]; l.at[v + 2] = l.anchor[v + 2] - c[2]; }
    });
  }
  function size(li, g) {
    var l = tree.leaves[li], at = scene.igloo.mesh.geometry.attributes.position, a = at.array, o = l.start * 3;
    for (var v = 0; v < l.count * 3; v += 3) {
      a[o + v] = l.at[v] + (l.base[v] - l.at[v]) * g;
      a[o + v + 1] = l.at[v + 1] + (l.base[v + 1] - l.at[v + 1]) * g;
      a[o + v + 2] = l.at[v + 2] + (l.base[v + 2] - l.at[v + 2]) * g;
    }
    if (at.addUpdateRange) at.addUpdateRange(o, l.count * 3);
    at.needsUpdate = true;
    grown[li] = g;
  }

  /* a growing leaf comes out with a little spring and settles; one taken back goes in plainly */
  function back(t) { var c = 1.6; t -= 1; return 1 + t * t * ((c + 1) * t + c); }
  function animate(list, to, stagger, then) {
    var now = performance.now();
    list.forEach(function (li, j) {
      moves = moves.filter(function (m) { return m.li !== li; });
      moves.push({ li: li, from: grown[li] || BUD, to: to, t0: now + j * stagger * 1000, d: to > (grown[li] || BUD) ? 1100 : 500 });
    });
    if (then) setTimeout(then, list.length ? (list.length - 1) * stagger * 1000 + 1500 : 0);
  }
  function step() {
    if (!moves.length) return;
    var now = performance.now();
    moves = moves.filter(function (m) {
      var t = (now - m.t0) / m.d;
      if (t < 0) return true;
      t = Math.min(1, t);
      var e = m.to > m.from ? back(t) : 1 - (1 - t) * (1 - t);
      size(m.li, m.from + (m.to - m.from) * e);
      return t < 1;
    });
  }

  var shown = [], previewing = [];
  function setLeaves(list) {
    shown = list.slice();
    moves = [];
    tree.leaves.forEach(function (l, i) { size(i, shown.indexOf(i) >= 0 ? 1 : BUD); });
  }

  /* ---------------------------------------------------------------- showing */

  /* the scene on screen; the first time, the way in igloo opens with */
  function show(opts) {
    opts = opts || {};
    if (!scene || failed) return Promise.resolve(false);
    live = true;
    box.classList.add('is-on');
    ig.Q.emit('webgl_render_active', true);
    /* shown anew after the welcome, the tree is drawn anew, even if it was this visit already */
    if (opts.again && opts.intro !== false && !introRunning) introDone = false;
    if (introDone || introRunning || opts.intro === false) {
      if (!introRunning) {
        if (!introDone) { scene.introTL.progress(1); soften(); }
        paper.uniforms.uIntro.value = 1;
        paper.uniforms.uWhite.value = 1;
        paper.uniforms.uKeep.value = 0;
        introDone = true;
      }
      return Promise.resolve(true);
    }
    introRunning = true;
    ig.re.killTweensOf(paper.uniforms.uKeep);
    paper.uniforms.uIntro.value = 0;
    paper.uniforms.uWhite.value = 0;
    paper.uniforms.uKeep.value = 1;
    ig.re.fromTo(paper.uniforms.uIntro, { value: 0 }, { value: 1, duration: 1, ease: 'inOut3' });
    ig.re.fromTo(paper.uniforms.uWhite, { value: 0 }, { value: 1, duration: 2.6, delay: 2.4, ease: 'sine.inOut' });
    return new Promise(function (resolve) {
      scene.playInAnimation().then(function () {
        introRunning = false;
        introDone = true;
        soften();
        resolve(true);
      });
    });
  }
  /* the way in, cut short: everything where it ends */
  function finish() {
    if (!introRunning || !scene.introTL) return;
    scene.introTL.progress(1);
    ig.re.killTweensOf(paper.uniforms.uWhite);
    paper.uniforms.uIntro.value = 1;
    paper.uniforms.uWhite.value = 1;
    paper.uniforms.uKeep.value = 0;

    failed: function () { return failed; },

    cut: function (p) {

    view: function () { return scene && live ? view() : null; },

    sectors: function () { return tree ? tree.sectors : []; },
    setLeaves: setLeaves,
    bloom: function (list, then) {

    preview: function (list) { previewing = list.filter(function (i) { return shown.indexOf(i) < 0; }); animate(previewing, 1, 0.2); },
    clearPreview: function () { animate(previewing, BUD, 0.04); previewing = []; }
  };
})();

<script>
/* ============================================================================

<script>
/* ============================================================================

   a paper-design shader plate, a black core floating above it, a ripple.

/* ============================================================================

   The address bar shows only the site, whatever is open: where you are is
   kept in the page's own history entries (src/app/address.html). Once the
   welcome and the tour are behind you, the history is the tree and at most
   one page over it, so the browser's back arrow always leads to the tree;
   before that it does nothing here.

  ueber: viewAbout, willkommen: viewWelcome, einstufung: viewAssess, training: viewTraining, instrument: viewInstrument, kurse: viewKurse, kurs: viewCourse,
  community: viewCommunity, kalender: viewCalendar, mitglieder: viewMembers

function parse() { var h = here.replace(/^#\/?/, '').split('/'); return { name: h[0] || '', args: h.slice(1) }; }

function working() { return member && !!profile && !!store.get('tour', false); }

  var r = parse();

  if (!ROUTES[r.name]) { swap(''); route(); return; }
  if (!member && r.name !== 'ueber') { swap('#/ueber'); route(); return; }

  try { sessionStorage.setItem('gd.at', here); } catch (e) {}

function levelOf(p) {
  var lv = +p.years || 0, can = (p.can || []).length;
  if (can >= 4) lv = Math.max(lv, 2); else if (can >= 2) lv = Math.max(lv, 1);
  if (p.timingMs != null) { if (p.timingMs > 60) lv = Math.min(lv, 1); if (p.timingMs < 25 && lv < 3 && can >= 6) lv++; }
  return Math.min(3, lv);
}

/* your path: every lesson in the order you will meet it, without what you can */
function pathOf(p) {
  var order = ORDER.slice();
  if (p) {
    var pulls = [];
    (p.goals || []).concat(p.styles || []).forEach(function (g) { (PULL[g] || []).forEach(function (m) { if (pulls.indexOf(m) < 0) pulls.push(m); }); });
    /* what you are after comes early — one every few places after the very
       basics, in the order your answers name it — but never before them */
    pulls.forEach(function (m, k) {
      var i = order.indexOf(m); if (i < 0) return;
      var to = Math.max(4, Math.min(i, 6 + k * 3));
      order.splice(i, 1); order.splice(to, 0, m);
    });
  }
  var out = [];
  order.forEach(function (ref) {
    var cut = ref.indexOf('/'), c = course(ref.slice(0, cut)), title = ref.slice(cut + 1);
    if (!c) return;
    c.modules.forEach(function (m) {
      if (m.title !== title) return;
      m.lessons.forEach(function (l) { var k = key(c, l); if (!known[k]) out.push({ c: c, l: l, k: k, m: m }); });
    });
  });
  /* anything a new course brings that the order does not name yet goes at the end */
  GD.COURSES.forEach(function (c) { lessonsOf(c).forEach(function (x) { var k = key(c, x.lesson); if (!known[k] && !out.some(function (o) { return o.k === k; })) out.push({ c: c, l: x.lesson, k: k, m: x.module }); }); });
  return out;
}
function nextLessons(n) { return pathOf(profile).filter(function (x) { return !done[x.k]; }).slice(0, n || 5); }

/* ---- the log: a day you trained, and the tempi you played clean ---- */
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function streak() {
  var days = {}, n = 0, d = new Date();
  log.forEach(function (e) { days[e.d] = true; });
  if (!days[today()]) d.setDate(d.getDate() - 1);
  for (;;) {
    var k = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    if (!days[k]) return n;

}

  var since = Date.now() - 7 * 864e5;

function sessionOf(p) {
  var min = +(p && p.time) || 20, lv = p ? levelOf(p) : 0;
  var w = WARMUPS[Math.min(WARMUPS.length - 1, Math.max(0, lv + (new Date().getDay() % 2)))];

  var warm = Math.max(3, Math.round(min * 0.2)), groove = Math.max(3, Math.round(min * 0.3));

    var i = queue.i;
    leave(function () { if (i < queue.lines.length - 1) sayLine(i + 1); else queue.then(); });
  }

  /* he asks, one question at a time */
  function nav(go) {
    return '<div class="intro__nav">' + (q ? '<button type="button" class="intro__back" data-back>' + icon('left') + 'Zurück</button>' : '') +
      (go ? '<button type="button" class="intro__go" data-go><span>' + go + '</span>' + icon('arrow') + '</button>' : '') + '</div>';
  }
  function ask(i) {
    mode = 'ask'; q = i;

    el.classList.add('is-asking');
    var t = write(s.q);
    box.innerHTML = (s.sub ? '<p class="intro__sub">' + s.sub + '</p>' : '') +
      '<div class="intro__opts" role="' + (multi ? 'group' : 'radiogroup') + '" aria-label="' + esc(s.q) + '">' + opts.map(function (o, k) {
        var on = multi ? (a[s.id] || []).indexOf(o[0]) >= 0 : a[s.id] === o[0];
        return '<button class="intro__opt' + (on ? ' is-on' : '') + '" type="button" data-v="' + o[0] + '" role="' + (multi ? 'checkbox' : 'radio') + '" aria-checked="' + on + '">' +
          '<i>' + (k + 1) + '</i><span>' + o[1] + '</span></button>';
      }).join('') + '</div>' + nav(multi ? ((a[s.id] || []).length ? 'Weiter' : 'Nichts davon') : '');
    $$('.intro__opt', box).forEach(function (b) {
      b.addEventListener('click', function (e) { e.stopPropagation(); pick(b.getAttribute('data-v')); });
    });
    var go = $('[data-go]', box), back = $('[data-back]', box);
    if (go) go.addEventListener('click', function (e) { e.stopPropagation(); forward(); });
    if (back) back.addEventListener('click', function (e) { e.stopPropagation(); backward(); });
    box.animate([{ opacity: 0, transform: 'translateY(10px)', filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'blur(0px)' }],
      { duration: REDUCED ? 1 : 700, delay: REDUCED ? 0 : Math.min(t * 0.6, 700), easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' });
  }
  function pick(v) {
    var s = ASK[q];
    if (busy || !s) return;
    if (s.many) {
      var list = a[s.id] = a[s.id] || [], i = list.indexOf(v);
      if (i >= 0) list.splice(i, 1); else { if (s.max && list.length >= s.max) list.shift(); list.push(v); }
      $$('.intro__opt', box).forEach(function (b) { var on = list.indexOf(b.getAttribute('data-v')) >= 0; b.classList.toggle('is-on', on); b.setAttribute('aria-checked', on); });
      $('[data-go] span', box).textContent = list.length ? 'Weiter' : 'Nichts davon';
    } else {
      a[s.id] = v;
      $$('.intro__opt', box).forEach(function (b) { var on = b.getAttribute('data-v') === v; b.classList.toggle('is-on', on); b.setAttribute('aria-checked', on); });

  function forward() {
    var s = ASK[q];

  }
  function backward() {
    if (mode !== 'ask' || busy || q <= 0) return;
    leave(function () { ask(q - 1); });
  }

  /* The plan is made. Aram says what it is, and then shows you your tree. */
  function plan() {
    settle(a);
    var n = Object.keys(known).length, s = sessionOf(profile), first = nextLessons(1)[0];
    var lines = ['Danke. Dein Weg steht.'];
    lines.push(n ? 'Was du schon kannst, überspringen wir. ' + (n === 1 ? 'Das ist eine Lektion.' : 'Das sind ' + n + ' Lektionen.')
                 : 'Wir fangen ganz vorne an. Jedes Blatt verdienst du dir.');
    lines.push(s.min + ' Minuten am Tag, ' + (a.days === '6' ? '6 oder 7' : a.days) + ' Tage die Woche. So ist dein Training gebaut.');
    if (first) lines.push('Als Erstes: „' + first.l.title + '“.');
    lines.push('Und jetzt: dein Baum.');
    speak(lines, open);
  }
  /* The words go, the white stays, and the tree is drawn into it. Nothing
     has grown on it yet: what you can already play comes out once it stands. */
  function open() {
    mode = 'gone';
    store.set('grown', []);
    store.set('leaves', []);
    if (!store.get('tour', false)) tourNext = true;
    unveil = true;
    go('#/kurse');
  }

  function onKey(e) {
    if (mode === 'say') {
      if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); onward(); }
      return;
    }
    if (mode !== 'ask') return;
    var s = ASK[q], k = parseInt(e.key, 10), opts = s.one || s.many;

  }
  current.onKey = onKey;
  addEventListener('keydown', onKey);
  el.addEventListener('click', function () { if (mode === 'say') onward(); });
  current.widgets = (current.widgets || []).concat([{ destroy: function () { clearTimeout(timer); } }]);

  timer = setTimeout(function () { speak(LINES, function () { ask(0); }); }, REDUCED ? 0 : 700);
}

/* ============================================================================
   THE TOUR — the page dims and one place stays lit: the tree, the courses on

   ========================================================================== */
var TOUR = [
  { spot: 'tree', title: 'Das ist dein Baum.', preview: true,
    text: 'Noch ist er kahl. Jede Lektion, die du abschließt, lässt ein Blatt wachsen, so wie diese hier.' },
  { spot: 'labels', title: 'Sechs Kurse, sechs Teile der Krone.',
    text: 'Vom Fundament bis zum Song des Monats. Jeder Kurs füllt seinen Teil des Baums. Tipp auf einen Namen, und du bist drin.' },
  { spot: null, title: 'So ist jede Lektion gebaut.', anatomy: true,
    text: 'Du schaust zu, verstehst und spielst selbst. Sind alle Aufgaben erledigt, wächst dein Blatt.' },
  { spot: 'today', title: 'Dein Training für heute.',
    text: 'Jeden Tag neu aus deinem Plan: aufwärmen, die nächste Lektion, ein Groove in deinem Tempo. Es wartet immer hier unten.' },
  { spot: 'tabs', title: 'Alles andere findest du oben.',
    text: 'Community für Fragen und Erfolge, Kalender für die Live-Calls mit Aram.' },
  { spot: 'first', title: 'Fang beim Fundament an.', last: true,
    text: 'Das Set, die Haltung, der Griff und die ersten Rudiments. Darauf steht alles andere.' }
];
var ANATOMY = [
  ['1', 'Video', 'Aram zeigt dir, worum es geht.'],
  ['2', 'Lektion', 'Erklärung, Tipps und Grooves zum Anhören.'],
  ['3', 'Aufgaben', 'Mitspielen, Beats bauen, Zählzeiten finden.']
];

/* the tour as it is for you: the leaves already on your tree, the first lesson your plan chose */
function tourSteps() {
  var steps = TOUR.map(function (s) { return Object.assign({}, s); }), grown = 0;
  GD.COURSES.forEach(function (c) { grown += progress(c).n; });
  if (grown) steps[0].text = (grown === 1 ? 'Das Blatt daran ist' : 'Die ' + grown + ' Blätter daran sind') + ' das, was du schon kannst. Jede Lektion, die du abschließt, lässt ein neues wachsen, so wie diese hier.';
  var first = profile && nextLessons(1)[0], last = steps[steps.length - 1];
  if (first) {
    last.title = 'Dein erster Schritt.';
    last.text = '„' + esc(first.l.title) + '“ im Kurs ' + first.c.title + '. Den hat dein Plan für dich ausgesucht.';
    last.k = GD.COURSES.indexOf(first.c);
    last.href = '#/kurs/' + first.c.id + '/' + first.l.id;
