}

function startTour() {
  if (!current.tree || $('.tour')) return;
  var TOUR = tourSteps();
  if (current.tree.painting()) current.tree.finish();
  var el = document.createElement('div');
  el.className = 'tour';
  el.innerHTML = '<div class="tour__veil"></div><div class="tour__spot is-none"></div>' +
    '<div class="tour__card" role="dialog" aria-modal="true" aria-label="Einweisung"></div>';
  document.body.appendChild(el);
  document.documentElement.style.overflow = 'hidden';
  var spot = $('.tour__spot', el), card = $('.tour__card', el), at = -1, previewing = false, swapT = 0;

  function union(els, pad) {
    var r = null;
    els.forEach(function (e) {
      if (!e) return;
      var b = e.getBoundingClientRect();
      if (!b.width && !b.height) return;
      r = r ? { left: Math.min(r.left, b.left), top: Math.min(r.top, b.top), right: Math.max(r.right, b.right), bottom: Math.max(r.bottom, b.bottom) }
            : { left: b.left, top: b.top, right: b.right, bottom: b.bottom };
    });
    return r && { left: r.left - pad, top: r.top - pad, right: r.right + pad, bottom: r.bottom + pad };
  }
  function rectOf(name) {
    var stage = $('.weg__stage');
    if (name === 'tree' && current.tree && current.tree.scene) {
      var v = GDIgloo.view();
      return v && { left: v.rect.left - 18, top: v.rect.top - 18, right: v.rect.right + 18, bottom: v.base.y + 18 };
    }
    if (name === 'tree' && stage) {
      var s = stage.getBoundingClientRect(), t = current.tree;
      return { left: s.left + t.crown.left - 18, top: s.top + t.crown.top - 18, right: s.left + t.crown.right + 18, bottom: s.top + t.base.y + 18 };
    }
    var phone = innerWidth <= 760;
    if (name === 'labels') return phone ? union($$('.mk').concat([$('.ks')]), 10) : union($$('.leaf').concat($$('.dot')), 16);
    if (name === 'tabs') return phone && $('#dock') ? union([$('#dock')], 0) : union($$('.tab'), 10);
    if (name === 'today') return union([$('.weg__cards .today')], 10);
    var fk = TOUR[at] && TOUR[at].k || 0;
    if (name === 'first') return phone ? union([$('.mk[data-k="' + fk + '"]'), $('.ks')], 10) : union([$('.leaf[data-k="' + fk + '"]'), $('.dot[data-k="' + fk + '"]')], 14);
    return null;
  }
  function clampTo(v, a, b) { return Math.max(a, Math.min(b, v)); }
  /* the card beside the lit place: right of it, else left, else below, else above */
  function place() {
    var s = TOUR[at], r = s && s.spot ? rectOf(s.spot) : null, W = innerWidth, H = innerHeight;
    if (r) {
      spot.classList.remove('is-none');
      spot.style.left = r.left + 'px'; spot.style.top = r.top + 'px';
      spot.style.width = (r.right - r.left) + 'px'; spot.style.height = (r.bottom - r.top) + 'px';
    } else {
      spot.classList.add('is-none');
      spot.style.left = (W / 2) + 'px'; spot.style.top = (H / 2) + 'px';
    }
    if (W <= 620) { card.style.left = ''; card.style.top = ''; return; }
    var cw = card.offsetWidth, ch = card.offsetHeight, gap = 20, m = 16, x, y;
    if (!r) { x = (W - cw) / 2; y = (H - ch) / 2; }
    else {
      var midY = clampTo((r.top + r.bottom) / 2 - ch / 2, m, H - ch - m), midX = clampTo((r.left + r.right) / 2 - cw / 2, m, W - cw - m);
      var right = W - r.right, left = r.left;
      if (right - gap - m >= cw) { x = r.right + gap; y = midY; }
      else if (left - gap - m >= cw) { x = r.left - gap - cw; y = midY; }
      else if (H - r.bottom - gap - m >= ch) { x = midX; y = r.bottom + gap; }
      else if (r.top - gap - m >= ch) { x = midX; y = r.top - gap - ch; }
      /* a large lit place leaves no room anywhere: the card goes to the wider
         side and covers no more of its edge than it has to */
      else { y = midY; x = right >= left ? W - cw - m : m; }
    }
    card.style.left = Math.round(x) + 'px'; card.style.top = Math.round(y) + 'px';
  }
  function fill() {
    var s = TOUR[at];
    card.innerHTML =
      '<button class="tour__x" type="button" data-close aria-label="Einweisung schließen">' + icon('x') + '</button>' +
      '<span class="tour__step">Einweisung · ' + (at + 1) + ' von ' + TOUR.length + '</span>' +
      '<h2>' + s.title + '</h2><p>' + s.text + '</p>' +
      (s.anatomy ? '<div class="tour__anat">' + ANATOMY.map(function (a) { return '<div><i>' + a[0] + '</i><span><b>' + a[1] + '</b> · ' + a[2] + '</span></div>'; }).join('') + '</div>' : '') +
      '<div class="tour__prog" aria-hidden="true">' + TOUR.map(function (x, k) { return '<i' + (k <= at ? ' class="is-on"' : '') + '></i>'; }).join('') + '</div>' +
      '<div class="tour__foot"><button class="tour__back" type="button" data-back' + (at ? '' : ' hidden') + '>Zurück</button>' +
      '<button class="tour__next" type="button" data-next>' + (s.last ? 'Erste Lektion starten' : 'Weiter') + icon('arrow') + '</button></div>';
    place();
    card.classList.remove('is-swap');
    var nx = $('[data-next]', card); if (nx) nx.focus({ preventScroll: true });
  }
  function show(i) {
    var first = at < 0;
    at = i;
    var s = TOUR[i];
    clearTimeout(swapT);
    if (first) fill(); else { card.classList.add('is-swap'); swapT = setTimeout(fill, 200); }
    /* the preview: a few of the Fundament's leaves come out, and go back after */
    if (s.preview && !previewing && current.tree.sectors[0]) {
      previewing = true;
      current.tree.preview(current.tree.sectors[0].slice(0, 6));
    } else if (!s.preview && previewing) {
      previewing = false;
      current.tree.clearPreview();
    }
  }
  function end(start, quiet) {
    if (!el.isConnected) return;
    removeEventListener('keydown', onKey);
    removeEventListener('resize', place);
    clearTimeout(swapT);
    if (previewing && current.tree && !quiet) current.tree.clearPreview();
    el.classList.remove('is-in');
    if (quiet) el.remove(); else setTimeout(function () { el.remove(); }, 380);
    document.documentElement.style.overflow = '';
    store.set('tour', true);
    current.endTour = null;
    if (start) go(TOUR[TOUR.length - 1].href || '#/kurs/fundament');
  }
  function step(d) {
    if (d > 0 && at === TOUR.length - 1) { end(true); return; }
    var n = at + d;

  }
  function onKey(e) {
    if (e.key === 'Escape') { end(false); return; }
    if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); step(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  }
  card.addEventListener('click', function (e) {
    if (e.target.closest('[data-next]')) step(1);
    else if (e.target.closest('[data-back]')) step(-1);
    else if (e.target.closest('[data-close]')) end(false);
  });
  addEventListener('keydown', onKey);
  addEventListener('resize', place, { passive: true });
  current.endTour = end;
  show(0);
  requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add('is-in'); }); });
}

/* ============================================================================
   KURSE — the tree with the leaves you earned, the courses hanging in it;
   below, the same as cards
   ========================================================================== */
function courseCard(c, i) {
  var pr = progress(c), n = lessonsOf(c).length;
  return '<a class="course rise" style="--i:' + i + '" href="#/kurs/' + c.id + '">' +
    '<span class="course__cover" data-motif="' + c.motif + '" data-theme="' + c.theme + '"></span>' +
    '<span class="course__body"><i>' + c.n + '</i><b>' + c.title + '</b><span class="course__desc">' + c.desc + '</span></span>' +
    '<span class="course__prog"><span class="bar"><i style="--p:' + pr.p.toFixed(3) + '"></i></span><em>' +
    (pr.n ? pr.n + ' von ' + n : n + ' Lektionen') + '</em></span></a>';
}

/* every done lesson owns one leaf in its course's slice of the crown */
function earnedLeaves(tree) {
  var out = [];
  GD.COURSES.forEach(function (c, ci) {
    lessonsOf(c).forEach(function (x, li) {
      var leaf = tree.sectors[ci] && tree.sectors[ci][li];
      if (has(key(c, x.lesson)) && leaf != null) out.push(leaf);
    });
  });
  return out;
}

/* the grid of all courses under the tree, the same in both kinds of page */
function planHtml() {
  if (!profile) return '';
  var next = nextLessons(4);
  return '<div class="myplan"><div class="myplan__head"><h2>Dein Weg</h2><span class="meta">' + LEVELS[profile.level || 0] + ' · ' +
      profile.time + ' Min. an ' + profile.days + ' Tagen</span><a class="myplan__edit" href="#/einstufung">Einstufung ändern</a></div>' +
    '<ol class="plan plan--row">' + next.map(function (x, i) {
      return '<li><a href="#/kurs/' + x.c.id + '/' + x.l.id + '"><i>' + (i ? 'Danach' : 'Als Nächstes') + '</i><b>' + esc(x.l.title) + '</b><span>' + x.c.title + ' · ' + x.l.dur + '</span></a></li>';
    }).join('') + '</ol></div>';
}
function kurseGrid() {
  return '<section class="wrap kurse" id="alle" style="--d:.9s">' + planHtml() +
      '<div class="kurse__head"><h2>Alle Kurse</h2><span class="meta">' + GD.COURSES.length + ' Kurse · ' + TOTAL + ' Lektionen</span></div>' +
      '<div class="grid3">' + GD.COURSES.map(courseCard).join('') + '</div>' +
    '</section>';
}
function wireGrid() {
  $$('.course__cover', view).forEach(function (el, i) { GDMotif.paint(el, 320, 200, { lw: 1.2, seed: i, scale: 0.62 }); });
  $('[data-to-grid]', view).addEventListener('click', function () {
    $('#alle').scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
  });
}

/* The page is igloo's first scene (src/app/igloo.js): the tree stands where
   the igloo stood, the courses hang in it as they hung on the painting, and
   the cards follow below, scrolling up over the picture. A device that cannot
   draw the scene gets the painted tree, exactly as it was. */
function viewKurse(opts) {
  opts = opts || {};
  var presenting = unveil;
  unveil = false;
  /* the tour belongs to the way in: until it has been seen, it comes again */
  if (member && profile && !store.get('tour', false)) tourNext = true;
  if (!window.GDIgloo || !GDIgloo.supported() || GDIgloo.failed()) { viewKursePainted(opts); return; }
  /* straight after the welcome the tree is drawn on an empty page; the bar, the courses and the cards come after it */
  if (presenting) document.body.classList.add('is-painting');
  view.innerHTML =
    '<section class="weg weg--scene">' +
      '<div class="weg__stage">' +
        '<div class="weg__float"><svg class="weg__lines" aria-hidden="true"></svg><div class="weg__leaves"></div></div>' +
        '<div class="weg__cards">' + sumHtml() + todayHtml() + '</div>' +
        '<button class="weg__hint meta" type="button" style="--d:.5s" data-to-grid>Alle Kurse' + icon('down') + '</button>' +
      '</div>' +
      '<div class="weg__cut" aria-hidden="true"></div>' +
    '</section>' + kurseGrid();
  wireGrid();
  document.body.classList.add('on-scene');

  var stage = $('.weg__stage', view), alive = true, off = null, entering = false;
  var labels = sceneLabels(stage);
  var tree = current.tree = {
    scene: true,
    sectors: [],
    painting: function () { return entering; },
    finish: function () { GDIgloo.finish(); },
    preview: function (list) { GDIgloo.preview(list); },
    clearPreview: function () { GDIgloo.clearPreview(); },
    bloom: function (list) { GDIgloo.bloom(list); },
    show: function () { if (GDIgloo.ready()) enter(false); },
    stop: function () {
      alive = false;
      if (off) off();
      removeEventListener('scroll', onScroll);
      clearTimeout(settleT);
      document.body.classList.remove('on-scene');
      if (presenting) document.body.classList.remove('is-painting');
      chrome.classList.remove('is-solid');
      GDIgloo.hide();
    }
  };

  function enter(intro) {
    entering = true;
    return GDIgloo.show({ intro: intro && !REDUCED, again: presenting }).then(function () {
      entering = false;
      if (alive) stage.classList.add('is-in');
    });
  }

  /* Down to the lessons the page goes through igloo's cut, nine tenths of a
     screen of scroll long (src/app/igloo.js), the lessons coming up just
     where the paper is laid: the courses on the tree go as it begins,
     and once the paper is laid the scene rests. Left halfway, the page goes
     on to the end of the cut in the direction it was going — never back. */
  var float = $('.weg__float', stage), lastY = window.scrollY, heading = 1, settleT = 0;
  function onScroll() {
    var y = window.scrollY, len = Math.round(innerHeight * 0.9), p = Math.max(0, Math.min(1, y / len));
    if (y !== lastY) heading = y > lastY ? 1 : -1;
    lastY = y;
    GDIgloo.cut(p);
    GDIgloo.idle(y > len + 4);
    float.style.opacity = String(Math.max(0, 1 - p * 3));
    float.style.visibility = p > 0.4 ? 'hidden' : '';
    chrome.classList.toggle('is-solid', p > 0.85);
    clearTimeout(settleT);
    if (p > 0.002 && p < 0.998) settleT = setTimeout(function () {
      if (!alive || $('.tour')) return;
      /* on down, past the end of the cut, to where the courses begin */
      var to = heading > 0 ? Math.max(len, $('#alle').offsetTop - chrome.offsetHeight - 12) : 0;
      window.scrollTo({ top: to, behavior: REDUCED ? 'auto' : 'smooth' });
    }, 260);
  }
  addEventListener('scroll', onScroll, { passive: true });

  GDIgloo.boot(COUNTS).then(function () {
    if (!alive) return;
    tree.sectors = GDIgloo.sectors();
    /* the leaves you had seen grow on this tree; a tree grown anew starts from all you had */
    var earned = earnedLeaves(tree), seen = store.get('grown', null) || earned;
    var fresh = earned.filter(function (i) { return seen.indexOf(i) < 0; });
    GDIgloo.setLeaves(earned.filter(function (i) { return fresh.indexOf(i) < 0; }));
    store.set('grown', earned);
    off = GDIgloo.onFrame(labels.place);
    onScroll();
    enter(true).then(function () {
      if (!alive) return;
      if (presenting) document.body.classList.remove('is-painting');
      /* leaves earned since you were last here come out now — after the welcome, all you can already play */
      if (fresh.length) {
        GDIgloo.bloom(fresh);
        if (!presenting) say(fresh.length === 1 ? 'Ein neues Blatt an deinem Baum.' : fresh.length + ' neue Blätter an deinem Baum.');
      }
      if (tourNext) { tourNext = false; setTimeout(startTour, fresh.length ? 1800 : 300); }
    });
  }, function () {
    /* no scene after all: the painted tree, and whatever was waiting for it */
    if (!alive) return;
    tree.stop();
    current.tree = null;
    viewKursePainted(opts);
  });
}

/* how far along you are, over all six: in the corner of the picture */
function sumHtml() {
  var n = 0;
  GD.COURSES.forEach(function (c) { n += progress(c).n; });
  return '<div class="weg__sum" style="--d:.6s"><span class="meta">Dein Fortschritt</span>' +
    '<b>' + n + '<em> von ' + TOTAL + ' Lektionen</em></b>' +
    '<span class="bar"><i style="--p:' + (n / TOTAL).toFixed(3) + '"></i></span>' +
    '<span class="weg__pct">' + pct(n / TOTAL) + ' · ' + (n === 1 ? 'ein Blatt' : n + ' Blätter') + ' am Baum</span></div>';
}

/* the six courses, hung beside the tree as on the painting: a dot on their
   part of the crown, a hairline, the name in the margin — following the
   tree wherever igloo's camera takes it */
function sceneLabels(stage) {
  var float = $('.weg__float', stage), svg = $('.weg__lines', float), box = $('.weg__leaves', float);
  var html = '', lines = '';
  GD.COURSES.forEach(function (c, k) {
    var pr = progress(c), n = lessonsOf(c).length, d = (0.15 + k * 0.09).toFixed(2);
    html += '<button class="leaf" type="button" data-course="' + c.id + '" data-k="' + k + '" style="--d:' + d + 's">' +
      '<i>/// ' + c.n + '</i><b>' + c.title + '</b><span>' + (pr.n ? pr.n + ' von ' + n + ' Lektionen' : n + ' Lektionen') + '</span>' +
      '<span class="bar leaf__bar"><i style="--p:' + pr.p.toFixed(3) + '"></i></span>' +
      '<i class="num">' + (+c.n) + '</i></button>' +
      '<span class="dot' + (pr.n ? ' is-on' : '') + '" data-k="' + k + '" style="--d:' + d + 's"><i></i></span>';
    lines += '<path data-k="' + k + '" style="--d:' + d + 's"/>';
  });
  /* on a phone: a mark on each course's part of the crown, and one card for the course you are looking at */
  html += GD.COURSES.map(function (c, k) { return '<button class="mk" type="button" data-k="' + k + '" aria-label="' + c.title + '"><span>' + (k + 1) + '</span></button>'; }).join('') +
    '<div class="ks" data-ks></div>';
  box.innerHTML = html;
  svg.innerHTML = lines;
  var leaves = $$('.leaf', box), dots = $$('.dot', box), paths = $$('path', svg), seen = '';
  var marks = $$('.mk', box), card = $('[data-ks]', box), sel = 0;
  var first = profile && nextLessons(1)[0];
  if (first) sel = GD.COURSES.indexOf(first.c);
  else GD.COURSES.some(function (c, k) { if (progress(c).p < 1) { sel = k; return true; } return false; });
  function choose(k) {
    sel = (k + GD.COURSES.length) % GD.COURSES.length;
    var c = GD.COURSES[sel], pr = progress(c), next = lessonsOf(c).filter(function (x) { return !has(key(c, x.lesson)); })[0];
    card.innerHTML = '<div class="ks__head"><i>' + c.n + '</i><b>' + c.title + '</b><span>' + pr.n + ' / ' + pr.total + '</span></div>' +
      '<span class="bar"><i style="--p:' + pr.p.toFixed(3) + '"></i></span>' +
      '<a class="ks__go" href="#/kurs/' + c.id + (next ? '/' + next.lesson.id : '') + '"><span><small>' + (next ? (pr.n ? 'Weiter mit' : 'Los geht es mit') : 'Alles geschafft') + '</small><b>' +
        esc(next ? next.lesson.title : 'Kurs wiederholen') + '</b></span>' + icon('arrow') + '</a>' +
      '<div class="ks__dots" role="tablist">' + GD.COURSES.map(function (x, i) {
        return '<button type="button" role="tab" data-to="' + i + '" aria-label="' + x.title + '" aria-selected="' + (i === sel) + '"' + (i === sel ? ' class="is-on"' : '') + '></button>';
      }).join('') + '</div>';
    marks.forEach(function (m, i) { m.classList.toggle('is-on', i === sel); });
  }
  choose(sel);
  marks.forEach(function (m) { m.addEventListener('click', function () { choose(+m.getAttribute('data-k')); }); });
  card.addEventListener('click', function (e) { var d = e.target.closest('[data-to]'); if (d) choose(+d.getAttribute('data-to')); });
  /* a swipe across the card turns to the next course */
  var sx = null;
  card.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  card.addEventListener('touchend', function (e) {
    if (sx == null) return;
    var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 40) choose(sel + (dx < 0 ? 1 : -1));
  }, { passive: true });

  leaves.forEach(function (b) {
    var k = b.getAttribute('data-k');
    function hot(on) { $$('[data-k="' + k + '"]', float).forEach(function (el) { if (el !== b) el.classList.toggle('is-hot', on); }); }
    b.addEventListener('pointerenter', function () { hot(true); });
    b.addEventListener('pointerleave', function () { hot(false); });
    b.addEventListener('focus', function () { hot(true); });
    b.addEventListener('blur', function () { hot(false); });
    b.addEventListener('click', function () { go('#/kurs/' + b.getAttribute('data-course')); });
  });

  function place(look) {
    if (!look) return;
    var W = look.W, H = look.H, narrow = W < 760, mid = look.centre.x, cx = look.centre.x, cy = look.centre.y;
    /* the names stand a little out from the crown, clear of the bar above and of the cards below on the left */
    var colL = look.rect.left - 34, colR = look.rect.right + 34, top = chrome.offsetHeight + 96, GAP = 94;
    var items = look.anchors.map(function (p, i) { return { i: i, ax: p.x, ay: p.y, side: i < look.anchors.length / 2 ? 'l' : 'r', y: p.y + 30 }; });
    ['l', 'r'].forEach(function (side) {
      var bottom = side === 'l' ? H - 210 : H - 96;
      var col = items.filter(function (it) { return it.side === side; }).sort(function (a, b) { return a.ay - b.ay; });
      for (var i = 1; i < col.length; i++) col[i].y = Math.max(col[i].y, col[i - 1].y + GAP);
      var over = col.length ? col[col.length - 1].y - bottom : 0;
      if (over > 0) col.forEach(function (it) { it.y -= over; });
      for (var j = col.length - 2; j >= 0; j--) col[j].y = Math.min(col[j].y, col[j + 1].y - GAP);
      if (col.length && col[0].y < top) { var d = top - col[0].y; col.forEach(function (it) { it.y += d; }); }
    });
    /* on a phone the numbers sit on the crown itself, and keep out of each other's way */
    if (narrow) {
      for (var p = 0; p < 3; p++) items.forEach(function (a) {
        items.forEach(function (b) {
          if (a === b) return;
          var dx = b.ax - a.ax, dy = b.ay - a.ay, d = Math.hypot(dx, dy);
          if (d >= 32) return;
          var push = (32 - d) / 2, ux = d ? dx / d : 0, uy = d ? dy / d : 1;
          a.ax -= ux * push; a.ay -= uy * push; b.ax += ux * push; b.ay += uy * push;
        });
      });
    }
    var size = W + 'x' + H;
    if (size !== seen) { svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); seen = size; }
    items.forEach(function (it) {
      var leaf = leaves[it.i], dot = dots[it.i], path = paths[it.i];
      var x = narrow ? it.ax : it.side === 'l' ? colL : colR, y = narrow ? it.ay : it.y;
      leaf.classList.toggle('leaf--l', it.side === 'l');
      leaf.classList.toggle('leaf--r', it.side === 'r');
      leaf.style.left = x.toFixed(1) + 'px'; leaf.style.top = y.toFixed(1) + 'px';
      /* a mark is always where a thumb can reach it, never under the edge or the card */
      var mx = Math.max(24, Math.min(W - 24, it.ax)), my = Math.max(top + 4, Math.min(H - 300, it.ay));
      marks[it.i].style.transform = 'translate3d(' + mx.toFixed(1) + 'px,' + my.toFixed(1) + 'px,0)';
      dot.style.left = it.ax.toFixed(1) + 'px'; dot.style.top = it.ay.toFixed(1) + 'px';
      /* The line out to its name: it leaves the ring the way the crown grows
         there, away from its middle, and bends round to come in level at the
         inner end of the course's bar, which it then is. */
      var bx = it.side === 'l' ? colL : colR, by = y - 1, span = Math.abs(bx - it.ax);
      var rx = it.ax - cx, ry = it.ay - cy, rl = Math.hypot(rx, ry) || 1, k = Math.min(70, Math.hypot(span, by - it.ay) * 0.38);
      var sx = it.ax + rx / rl * 6.5, sy = it.ay + ry / rl * 6.5;
      var c1x = it.ax + rx / rl * k, c1y = it.ay + ry / rl * k, c2x = bx + (it.side === 'l' ? 1 : -1) * Math.min(110, span * 0.55);
      path.setAttribute('d', narrow ? 'M0,0' : 'M' + sx.toFixed(1) + ',' + sy.toFixed(1) + 'C' + c1x.toFixed(1) + ',' + c1y.toFixed(1) + ' ' +
        c2x.toFixed(1) + ',' + by.toFixed(1) + ' ' + bx.toFixed(1) + ',' + by.toFixed(1));
      /* drawn in once, from the tree out: its length is taken the first time */
      if (!narrow && !path.style.getPropertyValue('--len')) path.style.setProperty('--len', Math.ceil(path.getTotalLength() + 60));
    });
  }
  return { place: place };
}

/* the painted tree, as the page was before the scene */
function viewKursePainted(opts) {
  opts = opts || {};
  view.innerHTML =
    '<section class="weg">' +
      '<div class="weg__stage">' +
        '<canvas class="weg__tree" aria-hidden="true"></canvas>' +
        '<svg class="weg__lines" aria-hidden="true"></svg>' +
        '<div class="weg__title" style="--d:.1s"><span class="meta">Dein Weg</span><h1>Wähle, wo du anfängst.</h1></div>' +
        '<div class="weg__leaves"></div>' +
        '<button class="weg__hint meta" type="button" style="--d:1.1s" data-to-grid>Alle Kurse' + icon('down') + '</button>' +
      '</div>' +
    '</section>' + kurseGrid();
  wireGrid();

  var tree = current.tree = GDTree.create($('.weg__tree', view), { seed: 27, counts: COUNTS });
  var earned = earnedLeaves(tree), seen = store.get('leaves', []);
  var fresh = opts.intro ? [] : earned.filter(function (i) { return seen.indexOf(i) < 0; });
  tree.setLeaves(earned);
  placeTree();
  if (!opts.intro) {
    /* leaves earned since you were last here come out now */
    if (fresh.length) {
      tree.bloom(fresh);
      say(fresh.length === 1 ? 'Ein neues Blatt an deinem Baum.' : fresh.length + ' neue Blätter an deinem Baum.');
    } else tree.show();
  }
  store.set('leaves', earned);

  /* a resize re-fits the tree; one that lands mid-painting finishes the painting,
     one that lands during Aram's words leaves the canvas blank for the painting to come */
  var t = 0;
  current.onResize = function () {
    clearTimeout(t);
    t = setTimeout(function () {
      if (current.tree !== tree) return;           /* the page has moved on since the resize */
      var midway = tree.painting();
      placeTree();
      if (midway) tree.finish();
      else if (!document.body.classList.contains('is-painting')) tree.show();
    }, 160);
  };
  addEventListener('resize', current.onResize, { passive: true });

  if (tourNext && !opts.intro) { tourNext = false; setTimeout(startTour, fresh.length ? 1800 : 300); }
}

/* lay the tree out, then hang the six courses on it like the notes on a
   botanical plate: a dot on its slice of the crown, a hairline, the name
   in the margin */
function placeTree() {
  /* the crown stays clear of the heading above it */
  var head = $('.weg__title'), reserve = head ? head.offsetTop + head.offsetHeight + 18 : 0;
  var tree = current.tree.layout(reserve), stage = $('.weg__stage');
  var W = stage.clientWidth, H = stage.clientHeight, mid = (tree.crown.left + tree.crown.right) / 2;
  var colL = tree.crown.left - 44, colR = tree.crown.right + 44;
  var items = GD.COURSES.map(function (c, i) {
    var p = tree.anchors[i] || { x: mid, y: tree.base.y - 40 * (i + 1) };
    return { c: c, i: i, ax: p.x, ay: p.y, side: p.x < mid ? 'l' : 'r', y: p.y };
  });
  /* keep the labels in each margin apart */
  ['l', 'r'].forEach(function (side) {
    var col = items.filter(function (it) { return it.side === side; }).sort(function (x, y) { return x.y - y.y; });
    for (var i = 1; i < col.length; i++) col[i].y = Math.max(col[i].y, col[i - 1].y + 66);
    var over = col.length ? col[col.length - 1].y - (H - 48) : 0;
    if (over > 0) col.forEach(function (it) { it.y -= over; });
    for (var j = col.length - 2; j >= 0; j--) col[j].y = Math.min(col[j].y, col[j + 1].y - 66);
  });

  var narrow = tree.narrow, lines = '', leaves = '';
  items.forEach(function (it, k) {
    var pr = progress(it.c), n = lessonsOf(it.c).length, d = (0.35 + k * 0.09).toFixed(2);
    var x = narrow ? it.ax : it.side === 'l' ? colL : colR, y = narrow ? it.ay : it.y;
    leaves += '<button class="leaf leaf--' + it.side + '" type="button" data-course="' + it.c.id + '" data-k="' + k + '" ' +
      'style="left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px;--d:' + d + 's">' +
      '<i>' + it.c.n + '</i><b>' + it.c.title + '</b><span>' + (pr.n ? pr.n + ' von ' + n + ' Lektionen' : n + ' Lektionen') + '</span>' +
      '<i class="num">' + (+it.c.n) + '</i></button>' +
      '<span class="dot" data-k="' + k + '" style="left:' + it.ax.toFixed(1) + 'px;top:' + it.ay.toFixed(1) + 'px;--d:' + d + 's"><i></i></span>';
    if (!narrow) {
      var ex = it.side === 'l' ? colL + 10 : colR - 10;
      var len = Math.hypot(ex - it.ax, y - it.ay);
      lines += '<path data-k="' + k + '" d="M' + it.ax.toFixed(1) + ',' + it.ay.toFixed(1) + 'L' + ex.toFixed(1) + ',' + y.toFixed(1) + '" ' +
        'style="stroke-dasharray:' + len.toFixed(1) + ';--len:' + len.toFixed(1) + ';--d:' + d + 's"/>';
    }
  });
  $('.weg__leaves', stage).innerHTML = leaves;
  $('.weg__lines', stage).innerHTML = lines;
  $('.weg__lines', stage).setAttribute('viewBox', '0 0 ' + W + ' ' + H);

  $$('.leaf', stage).forEach(function (b) {
    var k = b.getAttribute('data-k');
    function hot(on) { $$('[data-k="' + k + '"]', stage).forEach(function (el) { if (el !== b) el.classList.toggle('is-hot', on); }); }
    b.addEventListener('pointerenter', function () { hot(true); });
    b.addEventListener('pointerleave', function () { hot(false); });
    b.addEventListener('focus', function () { hot(true); });
    b.addEventListener('blur', function () { hot(false); });
    b.addEventListener('click', function () { go('#/kurs/' + b.getAttribute('data-course')); });
  });
}

/* ============================================================================
   ONE LESSON — the course on the left; on the right the lesson: what it is for,
   the video (until Aram films it, a frame that says so), the reading with
   grooves to listen to, and the exercises, each one done in the browser. The
   lesson is done when every exercise is, and the tree grows its leaf.
   ========================================================================== */
var LEVEL = ['', 'Einsteiger', 'Fortgeschritten', 'Profi'];

function taskState(c, l) {
  var k = key(c, l), n = (l.tasks || []).length, s = tasks[k];
  if (!s || s.length !== n) s = (l.tasks || []).map(function () { return !!done[k]; });
  return s;
}

function blockHtml(b, i) {
  if (typeof b === 'string') return '<p>' + b + '</p>';
  if (b.h) return '<h3>' + b.h + '</h3>';
  if (b.list) return '<ul class="lt__list">' + b.list.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
  if (b.steps) return '<ol class="lt__steps">' + b.steps.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol>';
  if (b.tip) return '<div class="lt__note lt__note--tip">' + b.tip + '</div>';
  if (b.mistake) return '<div class="lt__note lt__note--mistake">' + b.mistake + '</div>';
  if (b.groove) return '<figure class="lt__fig"><figcaption>' + esc(b.groove.caption || 'Groove') + '<span>Zum Anhören</span></figcaption><div data-fig="' + i + '"></div></figure>';
  if (b.sticking) return '<figure class="lt__fig"><figcaption>Sticking: ' + esc(b.sticking.text.replace(/[>()]/g, '')) + '<span>Zum Anhören</span></figcaption><div data-fig="' + i + '"></div></figure>';
  return '';
}

function taskHtml(t, i, isDone) {
  return '<section class="task' + (isDone ? ' is-done' : '') + ' rise" style="--i:' + (i + 4) + '" data-task="' + i + '">' +
    '<div class="task__head"><span class="task__n"><span>' + (i + 1) + '</span>' + icon('check') + '</span>' +
    '<div><span class="task__kind">' + (GDDrums.names[t.type] || 'Aufgabe') + '</span><b class="task__title">' + esc(t.title) + '</b>' +
    (t.text ? '<p class="task__text">' + t.text + '</p>' : '') + '</div>' +
    '<span class="task__flag">' + icon('check') + 'Erledigt</span></div>' +
    '<div class="task__body" data-body></div></section>';
}

function sideHtml(c, cur) {
  var pr = progress(c);
  return '<a class="back" href="#/kurse">' + icon('left') + 'Dein Weg</a>' +
    '<span class="meta cv__num">Kurs ' + c.n + '</span>' +
    '<h2 class="cv__title">' + c.title + '</h2>' +
    '<div class="cv__prog"><span class="bar"><i style="--p:' + pr.p.toFixed(3) + '"></i></span>' +
    '<span data-pct>' + pr.n + ' von ' + pr.total + '</span></div>' +
    '<nav aria-label="Lektionen">' + c.modules.map(function (m) {
      return '<div class="mod"><div class="mod__head"><span>' + m.title + '</span><small>' + m.lessons.length + '</small></div>' +
        '<ol class="mod__list">' + m.lessons.map(function (l) {
          var s = taskState(c, l), n = s.filter(Boolean).length, isOn = l === cur.lesson;
          return '<li><a class="les' + (has(key(c, l)) ? ' is-done' : '') + (isOn ? ' is-on' : '') + '" href="#/kurs/' + c.id + '/' + l.id + '"' +
            (isOn ? ' aria-current="page"' : '') + ' data-les="' + l.id + '"><span class="chk">' + icon('check') + '</span><span>' + l.title +
            '</span><small data-les-n>' + (n && n < s.length ? n + '/' + s.length : l.dur) + '</small></a></li>';
        }).join('') + '</ol></div>';
    }).join('') + '</nav>';
}

function viewCourse(id, lid) {
  var c = course(id);
  if (!c) { redirect('#/kurse'); return; }
  var all = lessonsOf(c);
  var cur = all.filter(function (x) { return x.lesson.id === lid; })[0] ||
            all.filter(function (x) { return !has(key(c, x.lesson)); })[0] || all[0];
  if (lid !== cur.lesson.id) { swap('#/kurs/' + c.id + '/' + cur.lesson.id); shownAt = here; }
  var idx = all.indexOf(cur), prev = all[idx - 1], next = all[idx + 1], l = cur.lesson, k = key(c, l);
  var st = taskState(c, l).slice(), N = st.length;
  function count() { return st.filter(Boolean).length; }

  view.innerHTML =
    '<div class="lv">' +
      '<aside class="lv__side rise" data-side>' + sideHtml(c, cur) + '</aside>' +
      '<article class="lv__main">' +
        '<div class="lv__mobilenav"><a href="#/kurse">' + icon('left') + 'Dein Weg</a><span>Lektion ' + (idx + 1) + ' von ' + all.length + '</span></div>' +
        '<header class="lh rise" style="--i:1">' +
          '<div class="lh__crumb"><a href="#/kurse">Kurs ' + c.n + ' · ' + c.title + '</a><i></i><span>' + cur.module.title + '</span>' +
          '<i></i><span>Lektion ' + (idx + 1) + ' von ' + all.length + '</span></div>' +
          '<h1 class="lh__title">' + esc(l.title) + '</h1>' +
          '<div class="lh__meta"><span class="lh__chip">' + l.dur + '</span><span class="lh__chip">' + LEVEL[l.level || 1] + '</span>' +
          '<span class="lh__chip" data-chip></span></div>' +
          (l.goal ? '<div class="lh__goal"><span>Ziel</span><p>' + l.goal + '</p></div>' : '') +
        '</header>' +
        '<div class="lvid rise" style="--i:2" role="img" aria-label="Video: ' + esc(l.video || l.title) + ' (folgt)">' +
          '<span class="lvid__tag">Video · folgt</span><span class="lvid__play">' + icon('play') + '</span>' +
          '<div class="lvid__cap"><b>' + esc(l.video || l.title) + '</b><span>' + l.dur + '</span></div></div>' +
        '<div class="lt rise" style="--i:3">' + (l.body || []).map(blockHtml).join('') + '</div>' +
        (N ? '<section class="lx"><div class="lx__head"><h2>Aufgaben</h2><span class="lx__count" data-count></span></div>' +
          '<div class="lx__bar"><span class="bar"><i data-bar></i></span></div>' +
          l.tasks.map(function (t, i) { return taskHtml(t, i, st[i]); }).join('') + '</section>' : '') +
        '<div class="lup">' + icon('upload') + '<b>Aufnahme teilen</b><span>Lad ein kurzes Video von dir hoch. Aram hört rein und gibt dir im Live-Call Feedback.</span></div>' +
        '<div class="lend"><p data-end></p><div class="lend__nav">' +
          (prev ? '<a class="btn btn--ghost" href="#/kurs/' + c.id + '/' + prev.lesson.id + '">' + icon('left') + 'Zurück</a>' : '') +
          '<a class="btn" data-next-lesson href="' + (next ? '#/kurs/' + c.id + '/' + next.lesson.id : '#/kurse') + '">' +
          (next ? 'Nächste Lektion' : 'Zurück zum Weg') + icon('arrow') + '</a>' +
        '</div></div>' +
      '</article>' +
    '</div>';

  /* the figures in the reading, and the exercises */
  current.widgets = [];
  $$('[data-fig]', view).forEach(function (el) {
    var b = l.body[+el.getAttribute('data-fig')];
    var spec = b.groove ? Object.assign({ type: 'groove' }, b.groove) : { type: 'sticking', text: b.sticking.text, bpm: b.sticking.bpm };
    current.widgets.push(GDDrums.mount(el, spec));
  });
  $$('.task', view).forEach(function (sec) {
    var i = +sec.getAttribute('data-task');
    current.widgets.push(GDDrums.mount($('[data-body]', sec), l.tasks[i], function () { complete(i); }));
  });

  /* the sidebar keeps the lesson you are on in view */
  var side = $('[data-side]', view), on = $('.les.is-on', view);
  if (side && on && side.scrollHeight > side.clientHeight) side.scrollTop = Math.max(0, on.offsetTop - side.clientHeight / 2);

  function paint() {
    var n = count(), allDone = N > 0 && n === N;
    var chip = $('[data-chip]', view);
    chip.innerHTML = allDone ? icon('check') + 'Geschafft' : '<b>' + n + '</b>&nbsp;von ' + N + ' Aufgaben';
    chip.classList.toggle('is-done', allDone);
    if (N) {
      $('[data-count]', view).textContent = n + ' von ' + N + ' erledigt';
      $('[data-bar]', view).style.setProperty('--p', (n / N).toFixed(3));
    }
    $('[data-end]', view).innerHTML = allDone
      ? '<b>Lektion geschafft.</b> An deinem Baum ist ein Blatt gewachsen.'
      : 'Noch <b>' + (N - n) + ' von ' + N + '</b> Aufgaben, dann wächst an deinem Baum ein Blatt.';
    $('[data-next-lesson]', view).classList.toggle('is-due', allDone);
    var les = $('[data-les="' + l.id + '"]', view);
    les.classList.toggle('is-done', allDone);
    $('[data-les-n]', les).textContent = n && n < N ? n + '/' + N : l.dur;
  }
  function complete(i) {
    if (st[i]) return;
    st[i] = true;
    tasks[k] = st.slice(); store.set('tasks', tasks);
    var sec = $('.task[data-task="' + i + '"]', view);
    sec.classList.add('is-done', 'is-pop');
    setTimeout(function () { sec.classList.remove('is-pop'); }, 600);
    if (count() === N && !done[k]) {
      done[k] = true; store.set('done', done);
      var p = progress(c);
      $('.cv__prog .bar i', view).style.setProperty('--p', p.p.toFixed(3));
      $('[data-pct]', view).textContent = p.n + ' von ' + p.total;
      say('Lektion geschafft. An deinem Baum wächst ein neues Blatt.');
    }
    paint();
  }
  paint();
}

/* ============================================================================
   COMMUNITY, KALENDER, MITGLIEDER — Skool's pages, with hairlines where
   Skool puts boxes
   ========================================================================== */
function person(i) { return i === 'me' ? { name: 'Du', init: 'Du' } : GD.MEMBERS[i]; }

function threadOf(p) { return (p.thread || []).concat(comments[p.id] || []); }
/* how long ago, for what was written here */
function ago(t) {
  var m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'gerade eben' : m < 60 ? 'vor ' + m + ' Min.' : m < 1440 ? 'vor ' + Math.round(m / 60) + ' Std.' : 'vor ' + Math.round(m / 1440) + ' Tagen';
}
function commentHtml(c, fresh) {
  var who = person(c.who);
  return '<li class="cmt' + (fresh ? ' is-new' : '') + '"><span class="avatar' + (c.who === 'me' ? '' : ' avatar--soft') + '">' + who.init + '</span>' +
    '<div class="cmt__body"><div class="cmt__head"><b>' + esc(who.name) + '</b>' + (c.who === 0 ? '<i>Admin</i>' : '') +
    '<span>' + (c.at ? ago(c.at) : c.when) + '</span></div><p>' + esc(c.text) + '</p></div></li>';
}
function threadHtml(p) {
  var list = threadOf(p);
  return '<div class="thread__in">' +
    (list.length ? '<ol class="cmts">' + list.map(function (c) { return commentHtml(c); }).join('') + '</ol>' : '<ol class="cmts"></ol><p class="cmts__none">Noch keine Kommentare. Schreib den ersten.</p>') +
    '<form class="cmt-form" data-reply="' + p.id + '"><span class="avatar">Du</span>' +
    '<input type="text" name="t" placeholder="Kommentar schreiben …" aria-label="Kommentar schreiben" maxlength="300" autocomplete="off">' +
    '<button class="cmt-send" type="submit" aria-label="Kommentar senden">' + icon('arrow') + '</button></form></div>';
}

function postHtml(p, i) {
  var who = person(p.who), liked = !!likes[p.id], n = p.likes + (liked ? 1 : 0);
  return '<article class="post rise" style="--i:' + (i + 2) + '" data-cat="' + p.cat + '" data-post="' + p.id + '">' +
    '<div class="post__head"><span class="avatar' + (p.who === 'me' ? '' : ' avatar--soft') + ' avatar--lg">' + who.init + '</span>' +
    '<div class="post__who"><b>' + esc(who.name) + '</b><span>' + p.when + ' · ' + p.cat + '</span></div>' +
    (p.pin ? '<span class="badge badge--outline post__pin">' + icon('pin') + 'Angeheftet</span>' : '') + '</div>' +
    (p.title ? '<h3>' + esc(p.title) + '</h3>' : '<div style="height:10px"></div>') +
    '<p>' + esc(p.body) + '</p>' +
    '<div class="post__foot"><button class="act' + (liked ? ' is-on' : '') + '" type="button" data-like="' + p.id + '" aria-pressed="' + liked + '" aria-label="Gefällt mir">' + icon('heart') +
    '<span>' + n + '</span></button><button class="act" type="button" data-thread="' + p.id + '" aria-expanded="false" aria-label="Kommentare">' + icon('chat') +
    '<span data-count>' + threadOf(p).length + '</span></button></div>' +
    '<div class="thread"></div></article>';
}

function nextThursdays(count) {
  var out = [], d = new Date();
  d.setHours(19, 0, 0, 0);
  while (out.length < count) {
    if (d.getDay() === 4 && d > new Date()) out.push(new Date(d));
    d.setDate(d.getDate() + 1);
  }
  return out;
}
var DAY = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
var MONTH = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
function when(d) {
  var days = Math.round((new Date(d).setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0)) / 864e5);
  return days === 0 ? 'heute' : days === 1 ? 'morgen' : 'in ' + days + ' Tagen';
}

/* the group, in the right-hand column: who, how many, the next call */
function groupCard() {
  var call = nextThursdays(1)[0];
  return '<div class="group card"><b>Groove Dynamics Inner Circle</b><small>Privat · Deutsch</small>' +
    '<p>Schluss mit Stagnation und YouTube-Chaos: coole Songs, wöchentliche Live-Calls und exklusive Kurse.</p>' +
    statsHtml() +
    '<a class="group__next" href="#/kalender">Nächster Live-Call<b>' + DAY[call.getDay()] + ', ' + call.getDate() + '. ' +
    MONTH[call.getMonth()] + ' · 19:00</b></a></div>';
}

function viewCommunity() {
  var cat = 'Alle';
  var posts = myPosts.concat(GD.POSTS.map(function (p, i) { p.id = p.id || 'p' + i; return p; }));
  view.innerHTML =
    '<div class="wrap two">' +
      '<div class="feed">' +
        '<form class="composer rise" data-compose><span class="avatar">Du</span>' +
          '<input type="text" name="t" placeholder="Schreib etwas …" aria-label="Beitrag schreiben" maxlength="400" autocomplete="off">' +
          GDMetal.html('Posten', { type: 'submit', cls: 'lmb--sm' }) + '</form>' +
        '<div class="chips rise" style="--i:1">' + ['Alle', 'Ankündigungen', 'Fragen', 'Erfolge'].map(function (x, i) {
          return '<button class="chip' + (i ? '' : ' is-on') + '" type="button" data-cat="' + x + '">' + x + '</button>';
        }).join('') + '</div>' +

      '</div>' +
      '<aside class="aside rise" style="--i:2">' + groupCard() + '</aside>' +

  var list = $('.posts', view);
  function render() {
    list.innerHTML = posts.filter(function (p) { return cat === 'Alle' || p.cat === cat; })
      .sort(function (a, b) { return (b.pin ? 1 : 0) - (a.pin ? 1 : 0); }).map(postHtml).join('');
  }
  render();
  $$('.chip', view).forEach(function (b) {

  });
  $('[data-compose]', view).addEventListener('submit', function (e) {
    e.preventDefault();
    var input = e.target.elements.t, text = input.value.trim();
    if (!text) { input.focus(); return; }
    var p = { id: 'm' + Date.now(), who: 'me', when: 'gerade eben', cat: 'Allgemein', likes: 0, body: text };
    myPosts.unshift(p); posts.unshift(p); store.set('posts', myPosts);
    input.value = '';
    if (cat !== 'Alle') { cat = 'Alle'; $$('.chip', view).forEach(function (x, i) { x.classList.toggle('is-on', i === 0); }); }
    render();
    say('Gepostet. Aram liest jeden Beitrag selbst.');
  });
  /* a like changes the heart and its number, nothing else on the page */
  list.addEventListener('click', function (e) {
    var b = e.target.closest('[data-like]');
    if (b) {
      var id = b.getAttribute('data-like'), p = posts.filter(function (x) { return x.id === id; })[0], on = !likes[id];
      if (on) likes[id] = true; else delete likes[id];
      store.set('likes', likes);
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-pressed', on);
      $('span', b).textContent = p.likes + (on ? 1 : 0);
      b.classList.remove('is-pop'); void b.offsetWidth; if (on) b.classList.add('is-pop');
      return;
    }
    /* the conversation opens under the post, and closes again */
    var t = e.target.closest('[data-thread]');
    if (!t) return;
    var post = t.closest('.post'), box = $('.thread', post), open = !post.classList.contains('is-open');
    if (open && !box.firstChild) box.innerHTML = threadHtml(posts.filter(function (x) { return x.id === t.getAttribute('data-thread'); })[0]);
    post.classList.toggle('is-open', open);
    t.setAttribute('aria-expanded', open);
    if (open) setTimeout(function () { var f = $('.cmt-form input', post); if (f) f.focus({ preventScroll: true }); }, 350);
  });
  list.addEventListener('input', function (e) {
    var f = e.target.closest('.cmt-form');
    if (f) f.classList.toggle('has-text', !!e.target.value.trim());
  });
  /* a comment of your own, kept with the post */
  list.addEventListener('submit', function (e) {
    var f = e.target.closest('[data-reply]');
    if (!f) return;
    e.preventDefault();
    var input = f.elements.t, text = input.value.trim();
    if (!text) { input.focus(); return; }
    var id = f.getAttribute('data-reply'), c = { who: 'me', at: Date.now(), text: text };
    (comments[id] = comments[id] || []).push(c);
    store.set('comments', comments);
    var post = f.closest('.post'), ol = $('.cmts', post), none = $('.cmts__none', post);
    if (none) none.remove();
    ol.insertAdjacentHTML('beforeend', commentHtml(c, true));
    $('[data-count]', post).textContent = threadOf(posts.filter(function (x) { return x.id === id; })[0]).length;
    input.value = '';
    f.classList.remove('has-text');
  });
}

/* The members page is never the same twice: who is online right now, who
   joined in the last hours, and a different handful of the circle each
   visit — with what they are working on and how long they have kept at it. */
var visits = 0;
function viewMembers() {
  visits++;
  var seed = Math.floor(Date.now() / 6e4) * 7 + visits * 131;
  function pick(n, salt) {
    var pool = GD.POOL.slice(), out = [];
    for (var i = 0; i < n && pool.length; i++) out.push(pool.splice(Math.floor(hash(seed + salt + i * 17) * pool.length), 1)[0]);
    return out;
  }
  var now = pick(9, 1), fresh = pick(4, 5), list = pick(12, 9);
  var ago = [2, 7, 18, 41].map(function (m, i) { return m + Math.floor(hash(seed + i) * 9); });
  function minutes(m) { return m < 60 ? 'vor ' + m + ' Min.' : 'vor ' + Math.round(m / 60) + ' Std.'; }
  function row(m, i, note, badge) {
    return '<li class="person rise" style="--i:' + (i + 1) + '"><span class="avatar avatar--lg' + (m.me ? '' : ' avatar--soft') + '">' + m.init + '</span>' +
      '<div><b>' + m.name + '</b><span>' + note + '</span></div>' +
      '<span class="badge badge--outline">' + badge + '</span></li>';
  }
  var people = [row(GD.MEMBERS[0], 0, '<i class="online"></i>online · Gründer · 28 Jahre am Schlagzeug', 'Admin'),
    row({ name: 'Du', init: 'Du', me: true }, 1, 'dabei seit heute · ' + progressLine(), 'Neu')]
    .concat(list.map(function (m, i) {
      var on = hash(seed + i * 3) < 0.35;
      return row(m, i + 2, (on ? '<i class="online"></i>' + m.doing + ' · ' : '') + m.city + ' · ' + m.kit + ' · ' + m.lessons + ' Lektionen',
        m.streak > 20 ? m.streak + ' Tage am Stück' : 'seit ' + m.since);
    }));
  view.innerHTML =
    '<div class="wrap two">' +
      '<div>' +
        '<h1 class="page-title rise">Mitglieder</h1>' +
        '<p class="page-sub rise"><b>' + M() + '</b> Schlagzeuger · <i class="online"></i><b data-online>' + online + '</b> online</p>' +
        '<div class="here rise" style="--i:1"><span class="meta">Gerade am Üben</span><div class="here__row">' +
          now.map(function (m) { return '<span class="here__who" title="' + m.name + ' · ' + m.doing + '"><span class="avatar avatar--soft">' + m.init + '</span></span>'; }).join('') +
          '<span class="here__more">+<b data-online>' + online + '</b></span></div></div>' +

      '</div>' +
      '<aside class="aside rise" style="--i:2">' + groupCard() + '</aside>' +
    '</div>';
}
/* where you stand, in a few words */
function progressLine() {
  var n = 0;
  GD.COURSES.forEach(function (c) { n += progress(c).n; });
  return n ? n + (n === 1 ? ' Lektion' : ' Lektionen') + ' geschafft' : 'gerade gestartet';
}

/* links inside the app go through go(), so the address stays as it is */
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  go(a.getAttribute('href'));
});
/* a page typed in after a # while the app is open: opened, and the address cleared again */
addEventListener('hashchange', function () {
  if (!/^#\//.test(location.hash)) return;
  var to = location.hash;
  history.replaceState(history.state, '', HOME);
  go(to);
});
/* Back and forward. Working, every step back lands on the tree; a step
   forward may bring back the page that was over it. Before that — in the
   welcome, the questions, the tour — a step back is taken back at once. */
addEventListener('popstate', function (e) {
  var st = e.state || {};
  /* not a step back but a page typed in after a #: the hashchange below takes it */
  if (/^#\//.test(location.hash)) return;
  if (!working()) {
    if (member) { history.pushState({ r: here, d: 0 }, '', HOME); return; }
    here = st.r || ''; route(); return;
  }
  if (st.d === 1 && st.r) here = st.r;
  else { here = '#/kurse'; if (st.r !== here) history.replaceState({ r: here, d: 0 }, '', HOME); }
  if (here !== shownAt) route();
});
/* the first page: a page asked for over the tree is put over it, so back leads there */
(function () {
  var first = parse().name;
  if (working() && first && first !== 'kurse' && ROUTES[first]) {
    history.replaceState({ r: '#/kurse', d: 0 }, '', HOME);
    history.pushState({ r: here, d: 1 }, '', HOME);
  } else swap(here);
})();
route();
})();
</script>
